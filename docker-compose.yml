services:
  web:
    build: .
    container_name: school-web
    ports:
      - "4444:4444"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - FLASK_DEBUG=0
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=sample
      - RATE_GLOBAL_LIMIT=200
      - RATE_BLOCK_DURATION=10
      - ADMIN_SECRET=${ADMIN_SECRET}
    volumes:
      - school_backups:/app/backups
      - school_uploads:/app/uploads
      - school_logs:/var/log
    restart: unless-stopped

volumes:
  school_backups:
  school_uploads:
  school_logs:
