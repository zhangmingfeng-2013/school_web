{% extends "base.html" %}
{% block title %}系统监控 - 多合一工具箱 Web 版{% endblock %}
{% block content %}
<h2 class="mb-4">📊 系统监控 <small class="text-muted fs-6">每1秒自动刷新</small></h2>

<div id="sysInfo">
    <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2">加载中...</p>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
async function fetchSysInfo() {
    try {
        const resp = await fetch('/api/system_info');
        const d = await resp.json();
        if (d.error) { document.getElementById('sysInfo').innerHTML = `<div class="alert alert-danger">${d.error}</div>`; return; }

        let html = '<div class="row g-4">';

        // 基本信息
        html += '<div class="col-12"><div class="card"><div class="card-body">';
        html += `<h5>💻 基本系统信息</h5>`;
        html += `<span class="badge bg-dark me-2">${d.system}</span>`;
        html += `<span class="badge bg-secondary me-2">${d.machine}</span>`;
        html += `<span class="badge bg-info">运行 ${d.uptime}</span>`;
        html += `<p class="mt-2 mb-0 text-muted small">主机名: ${d.hostname} | 版本: ${d.version}</p>`;
        html += '</div></div></div>';

        // CPU
        html += '<div class="col-md-6"><div class="card"><div class="card-body">';
        html += `<h6>🖥️ CPU <span class="badge bg-${d.cpu.percent > 80 ? 'danger' : d.cpu.percent > 50 ? 'warning' : 'success'} fs-6">${d.cpu.percent}%</span></h6>`;
        html += `<div class="progress mb-2" style="height:8px"><div class="progress-bar bg-${d.cpu.percent > 80 ? 'danger' : d.cpu.percent > 50 ? 'warning' : 'success'}" style="width:${d.cpu.percent}%"></div></div>`;
        html += `<small class="text-muted">物理核心: ${d.cpu.physical} | 逻辑核心: ${d.cpu.logical}</small>`;
        html += '</div></div></div>';

        // 内存
        html += '<div class="col-md-6"><div class="card"><div class="card-body">';
        html += `<h6>🧠 内存 <span class="badge bg-${d.memory.percent > 80 ? 'danger' : d.memory.percent > 50 ? 'warning' : 'success'} fs-6">${d.memory.percent}%</span></h6>`;
        html += `<div class="progress mb-2" style="height:8px"><div class="progress-bar bg-${d.memory.percent > 80 ? 'danger' : d.memory.percent > 50 ? 'warning' : 'success'}" style="width:${d.memory.percent}%"></div></div>`;
        html += `<small class="text-muted">已用: ${d.memory.used_gb} GB / 总量: ${d.memory.total_gb} GB（可用: ${d.memory.available_gb} GB）</small>`;
        html += '</div></div></div>';

        // 磁盘
        html += '<div class="col-12"><div class="card"><div class="card-body">';
        html += '<h6>💾 磁盘</h6>';
        for (const disk of d.disk) {
            const color = disk.percent > 80 ? 'danger' : disk.percent > 50 ? 'warning' : 'success';
            html += `<div class="mb-2"><div class="d-flex justify-content-between"><small><strong>${disk.device}</strong> (${disk.mountpoint})</small><small>${disk.used_gb}G / ${disk.total_gb}G</small></div>`;
            html += `<div class="progress" style="height:6px"><div class="progress-bar bg-${color}" style="width:${disk.percent}%"></div></div></div>`;
        }
        html += '</div></div></div>';

        // 网络
        html += '<div class="col-md-6"><div class="card"><div class="card-body">';
        html += '<h6>📡 网络流量</h6>';
        html += `<small>发送: ${d.network.sent_mb} MB | 接收: ${d.network.recv_mb} MB</small><br>`;
        html += `<small>发包: ${d.network.sent_packets} | 收包: ${d.network.recv_packets}</small>`;
        html += '</div></div></div>';

        // 运行时间
        html += '<div class="col-md-6"><div class="card"><div class="card-body">';
        html += '<h6>⏱️ 运行时间</h6>';
        html += `<span class="display-6">${d.uptime}</span>`;
        html += '</div></div></div>';

        html += '</div>';
        document.getElementById('sysInfo').innerHTML = html;
    } catch(e) {
        document.getElementById('sysInfo').innerHTML = `<div class="alert alert-danger">加载失败: ${e.message}</div>`;
    }
}

fetchSysInfo();
setInterval(fetchSysInfo, 1255);
</script>
{% endblock %}
