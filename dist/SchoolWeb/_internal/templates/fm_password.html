{% extends "base.html" %}
{% block title %}密码验证{% endblock %}
{% block content %}
<h2 class="mb-4">🔐 文件管理器访问验证</h2>

<div class="card" style="max-width:420px;margin:60px auto">
    <div class="card-body text-center">
        <p class="text-muted mb-3">请输入密码以访问文件管理器</p>

        <form method="POST">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
            <div class="mb-3">
                <input type="password" name="fm_password" class="form-control form-control-lg text-center" placeholder="输入密码" autofocus>
            </div>
            <button type="submit" class="btn btn-primary w-100">✅ 验证</button>
        </form>
        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary mt-2 w-100">返回首页</a>
    </div>
</div>
{% endblock %}
