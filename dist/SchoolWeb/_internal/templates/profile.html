{% extends "base.html" %}
{% block title %}个人资料 - 多合一工具箱{% endblock %}
{% block content %}
<h2 class="mb-4">👤 个人资料</h2>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
            <div class="mb-3">
                <label class="form-label">用户名</label>
                <input type="text" class="form-control" value="{{ username }}" disabled>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">昵称</label>
                    <input type="text" name="nickname" class="form-control" value="{{ profile.nickname or '' }}" placeholder="给自己取个昵称">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">生日</label>
                    <input type="date" name="birthday" class="form-control" value="{{ profile.birthday or '' }}">
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">手机</label>
                    <input type="text" name="phone" class="form-control" value="{{ profile.phone or '' }}" placeholder="手机号码">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">邮箱</label>
                    <input type="email" name="email" class="form-control" value="{{ profile.email or '' }}" placeholder="电子邮箱">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">个人简介</label>
                <textarea name="bio" class="form-control" rows="3" placeholder="介绍一下自己...">{{ profile.bio or '' }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary">💾 保存</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">返回</a>
        </form>
    </div>
</div>
{% endblock %}
