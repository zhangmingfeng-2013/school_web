{% extends "base.html" %}
{% block title %}🎲 模拟数据生成器 - 多合一工具箱{% endblock %}
{% block content %}
<style nonce="{{ csp_nonce }}">
.mock-wrap { max-width:1100px;margin:0 auto }
.mock-type-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:1rem }
.mock-type-btn { padding:10px;border:2px solid var(--border-light);border-radius:8px;background:var(--bs-body-bg);cursor:pointer;text-align:center;transition:all .15s;font-size:.85rem }
.mock-type-btn:hover { border-color:#3b82f6;background:rgba(59,130,246,.05) }
.mock-type-btn.active { border-color:#3b82f6;background:rgba(59,130,246,.1);font-weight:600 }
.mock-table { font-size:.85rem }
.mock-table code { font-size:.8rem }
</style>

<div class="mock-wrap">
    <h2 class="mb-1">🎲 模拟数据生成器</h2>
    <p class="text-muted mb-3">快速生成测试数据：姓名、手机、邮箱、身份证、地址、日期等</p>

    <div class="card mb-3"><div class="card-body">
        <h6>数据类型（可多选）</h6>
        <div class="mock-type-grid" id="typeGrid">
            <div class="mock-type-btn active" data-type="name_cn">👤 中文姓名</div>
            <div class="mock-type-btn" data-type="name_en">👤 英文姓名</div>
            <div class="mock-type-btn" data-type="phone">📱 手机号</div>
            <div class="mock-type-btn" data-type="email">📧 邮箱</div>
            <div class="mock-type-btn" data-type="idcard">🪪 身份证</div>
            <div class="mock-type-btn" data-type="address">📍 地址</div>
            <div class="mock-type-btn" data-type="company">🏢 公司名</div>
            <div class="mock-type-btn" data-type="date">📅 日期</div>
            <div class="mock-type-btn" data-type="ip">🌐 IP地址</div>
            <div class="mock-type-btn" data-type="url">🔗 URL</div>
            <div class="mock-type-btn" data-type="uuid">🆔 UUID</div>
            <div class="mock-type-btn" data-type="color_hex">🎨 颜色</div>
            <div class="mock-type-btn" data-type="bankcard">💳 银行卡</div>
        </div>
        <div class="d-flex gap-2 align-items-center">
            <label style="font-size:13px">数量 <input type="number" id="mockCount" value="10" min="1" max="100" style="width:70px"></label>
            <button class="btn btn-primary" data-csp-click="genMockData">🎲 生成数据</button>
            <button class="btn btn-outline-success" data-csp-click="exportCsv">📥 导出CSV</button>
            <button class="btn btn-outline-secondary" data-csp-click="copyMockData">📋 复制JSON</button>
        </div>
    </div></div>

    <div class="card"><div class="card-body">
        <div class="table-responsive" id="mockTableWrap">
            <p class="text-muted text-center py-4" id="mockPlaceholder">选择数据类型，点击生成按钮</p>
        </div>
    </div></div>
</div>
{% endblock %}

{% block scripts %}
<script nonce="{{ csp_nonce }}">
// Data pools
var CN_SURNAMES = '赵钱孙李周吴郑王冯陈褚卫蒋沈韩杨朱秦尤许何吕施张孔曹严华金魏陶姜戚谢邹喻柏水窦章云苏潘葛奚范彭郎鲁韦昌马苗凤花方俞任袁柳酆鲍史唐费廉岑薛雷贺倪汤滕殷罗毕郝邬安常乐于时傅皮下齐康伍余元卜顾孟平黄和穆萧尹姚邵湛汪祁毛禹狄米贝明臧计伏成戴谈宋茅庞熊纪舒屈项祝董梁杜阮蓝闵席季麻强贾路娄危江童颜郭梅盛林刁钟徐邱骆高夏蔡田樊胡凌霍虞万支柯昝管卢莫经房裘缪干解应宗丁宣贲邓郁单杭洪包诸左石崔吉钮龚程嵇邢滑裴陆荣翁荀羊於惠甄曲家封芮羿储靳汲邴糜松井段富巫乌焦巴弓牧隗山谷车侯宓蓬全郗班仰秋仲伊宫宁仇栾暴甘钭厉戎祖武符刘景詹束龙叶幸司韶郜黎蓟薄印宿白怀蒲邰从鄂索咸籍赖卓蔺屠蒙池乔阴鬱胥能苍双闻莘党翟谭贡劳逄姬申扶堵冉宰郦雍卻璩桑桂濮牛寿通边扈燕冀郏浦尚农温别庄晏柴瞿阎充慕连茹习宦艾鱼容向古易慎戈廖庾终暨居衡步都耿满弘匡国文寇广禄阙东欧殳沃利蔚越夔隆师巩厍聂晁勾敖融冷訾辛阚那简饶空曾毋沙乜养鞠须丰巢关蒯相查后荆红游竺权逯盖益桓公万俟司马上官欧阳夏侯诸葛闻人东方赫连皇甫尉迟公羊澹台公冶宗政濮阳淳于单于太叔申屠公孙仲孙轩辕令狐钟离宇文长孙慕容鲜于闾丘司徒司空丌官司寇仉督子车颛孙端木巫马公西漆雕乐正壤驷公良拓跋夹谷宰父谷梁晋楚闫法汝鄹涂钦段干百里东郭南门呼延归海羊舌微生岳帅缑亢况后有琴梁丘左丘东门西门商牟佘佴伯赏南宫墨哈谯笪年爱阳佟第五言福'.split('');
var CN_NAMES_MALE = '伟强磊洋勇军杰涛明辉鹏飞超斌浩峰刚健龙华林毅俊宇翔瑞凯博文博学才良德仁义礼智信诚忠孝勇猛威武雄壮志凌云腾飞展鹏远航启明向阳朝晖晨光'.split('');
var CN_NAMES_FEMALE = '芳敏静丽娟秀英华艳红霞玲萍芬兰梅菊莲荷花叶草云雪月星晨雨露风霜春夏秋冬燕莺凤鹤蝶鹃鹊鸽鸥鹭'.split('');
var EN_FIRST = 'James John Robert Michael William David Richard Joseph Thomas Charles Christopher Daniel Matthew Anthony Mark Donald Steven Paul Andrew Joshua Kenneth Kevin Brian George Edward Ronald Timothy Jason Jeffrey Ryan Jacob Gary Nicholas Eric Jonathan Stephen Larry Justin Scott Brandon Frank Raymond Gregory Samuel Patrick Jack Alexander Henry Oliver Noah Emma Olivia Ava Isabella Sophia Charlotte Mia Amelia Harper Evelyn Abigail Emily Elizabeth Sofia Madison'.split(' ');
var EN_LAST = 'Smith Johnson Williams Brown Jones Garcia Miller Davis Rodriguez Martinez Hernandez Lopez Gonzalez Wilson Anderson Thomas Taylor Moore Jackson Martin Lee Perez Thompson White Harris Sanchez Clark Ramirez Lewis Robinson Walker Young Allen King Wright Scott Torres Nguyen Hill Green Adams Baker Nelson Carter Mitchell Roberts Turner Phillips Campbell Parker Evans Edwards Collins Stewart Morris Rogers Reed Cook Morgan Bell Murphy Bailey Rivera Cooper Richardson Cox Howard Ward Torres Peterson Gray James Watson Brooks Kelly Sanders Price Bennett Wood Barnes Ross Henderson Coleman Jenkins Perry Powell Long Patterson Hughes Flores Washington Butler Simmons Foster Gonzales Bryant Alexander Russell Griffin Diaz Hayes Myers Ford Hamilton Graham Sullivan Wallace Woods Cole West Jordan Owens Reynolds Fisher Ellis Harrison Gibson McDonald Cruz Marshall Ortiz Gomez Murray Freeman Wells Webb Simpson Stevens Tucker Porter Hunter Hicks Crawford Henry Boyd Mason Morales Kennedy Warren Dixon Ramos Reyes Burns Gordon Shaw Holmes Rice Robertson Hunt Black Daniels Palmer Mills Nichols Grant Knight Ferguson Rose Stone Hawkins Dunn Perkins Hudson Spencer Gardner Stephens Payne Pierce Berry Matthews Arnold Wagner Willis Ray Watkins Olson Carroll Duncan Snyder Hart Cunningham Bradley Lane Andrews Ruiz Harper Fox Riley Armstrong Carpenter Weaver Greene Lawrence Elliott Chavez Sims Austin Peters Kelley Franklin Lawson Fields Gutierrez Ryan Schmidt Carr Vasquez Castillo Wheeler Chapman Oliver Montgomery Richards Williamson Johnston Banks Meyer Bishop McCoy Howell Alvarez Morrison Hansen Fernandez Garza Harvey Little Burton Stanley Nguyen George Jacobs Reid Kim Fuller Lynch Dean Gilbert Garrett Romero Welch Larson Frazier Burke Hanson Day Mendoza Moreno Bowman Medina Fowler Brewer Hoffman Carlson Silva Pearson Holland Douglas Fleming Jensen Vargas Byrd Davidson Hopkins May Terry Herrera Wade Soto Walters Curtis Neal Caldwell Lowe Jennings Barnett Graves Jimenez Horton Shelton Barrett Obrien Castro Sutton Gregory McKinney Lucas Miles Craig Rodriquez Chambers Holt Lambert Fletcher Watts Bates Hale Rhodes Pena Beck Newman Haynes McDaniel Mendez Bush Vaughn Parks Dawson Santiago Norris Hardy Love Steele Curry Powers Schultz Barker Guzman Page Munoz Ball Keller Chandler Weber Leonard Walsh Lyons Ramsey Wolfe Schneider Mullins Benson Sharp Bowen Daniel Barber Cummings Hines Baldwin Griffith Valdez Hubbard Salazar Reeves Warner Stevenson Burgess Santos Tate Cross Garner Mann Mack Moss Thornton Dennis McGee Farmer Delgado Aguilar Vega Glover Manning Cohen Harmon Rodgers Robbins Newton Todd Blair Higgins Ingram Reese Cannon Strickland Townsend Potter Goodwin Walton Rowe Hampton Ortega Patton Swanson Joseph Francis Goodman Maldonado Yates Becker Erickson Hodges Rios Conner Adkins Webster Norman Malone Hammond Flowers Cobb Moody Quinn Blake Maxwell Pope Floyd Osborne Paul McCarthy Guerrero Lindsey Estrada Sandoval Gibbs Tyler Gross Fitzgerald Stokes Doyle Sherman Saunders Wise Colon Gill Alvarado Greer Padilla Waters Nunez Ballard Schwartz McBride Houston Christensen Klein Pratt Briggs Parsons Zimmerman French Buchanan Moran Copeland Holloway Brock Poole Frank Logan Owen Bass Marsh Drake Wong Jefferson Park Morton Abbott Sparks Patrick Norton Huff Clayton Massey Figueroa Carson Bowers Roberson Barton Tran Lamb Harrington Case Boone Cortez Clarke Mathis Singleton Wilkins Cain Bryan Underwood Hogan McKenzie Collier Luna Pena Dickerson'.split(' ');
var STREETS = ['中山路','人民路','建设路','解放路','和平路','文化路','长安街','南京路','北京路','长江路','黄河路','滨海路','花园路','朝阳路','新华路','东风路','兴华路','光明路','中华路','学府路'];
var CITIES = ['北京市','上海市','广州市','深圳市','杭州市','南京市','成都市','武汉市','重庆市','西安市','苏州市','天津市','长沙市','郑州市','东莞市','青岛市','沈阳市','宁波市','昆明市','大连市','厦门市','合肥市','佛山市','福州市','哈尔滨市','济南市','温州市','长春市','石家庄市','常州市','泉州市','南宁市','贵阳市','南昌市','太原市','烟台市','嘉兴市','南通市','金华市','珠海市','惠州市','徐州市','海口市','乌鲁木齐市','绍兴市','中山市','台州市','兰州市'];
var COMPANIES = ['华为技术','阿里巴巴','腾讯科技','百度在线','京东集团','字节跳动','美团点评','小米科技','网易集团','滴滴出行','拼多多','快手科技','哔哩哔哩','蔚来汽车','理想汽车','小鹏汽车','大疆创新','海康威视','中兴通讯','格力电器','联想集团','科大讯飞','商汤科技','旷视科技','依图科技','地平线','寒武纪','第四范式','云从科技','壁仞科技'];

var _mockResult = [];

function escHtml(s) { var d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; }

function genMockData() {
    var count = parseInt(document.getElementById('mockCount').value) || 10;
    var active = document.querySelectorAll('#typeGrid .mock-type-btn.active');
    var types = [];
    active.forEach(function(el){ types.push(el.getAttribute('data-type')); });
    if (types.length === 0) { alert('请选择至少一种数据类型'); return; }

    _mockResult = [];
    for (var i = 0; i < count; i++) {
        var row = {};
        for (var j = 0; j < types.length; j++) row[types[j]] = genField(types[j]);
        _mockResult.push(row);
    }
    renderTable(types);
}

function genField(type) {
    var r = function(n){ var s=''; for(var i=0;i<n;i++) s+=Math.floor(Math.random()*10); return s; };
    var pick = function(arr){ return arr[Math.floor(Math.random()*arr.length)]; };
    switch(type) {
        case 'name_cn': return pick(CN_SURNAMES) + (Math.random()>0.5 ? pick(CN_NAMES_MALE) : pick(CN_NAMES_FEMALE)) + (Math.random()>0.5 ? pick(CN_NAMES_MALE.slice(0,10)) : '');
        case 'name_en': return pick(EN_FIRST) + ' ' + pick(EN_LAST);
        case 'phone': return '1' + pick(['3','4','5','6','7','8','9']) + r(9);
        case 'email': return pick(EN_FIRST).toLowerCase() + r(3) + '@' + pick(['qq.com','163.com','gmail.com','outlook.com','hotmail.com']);
        case 'idcard': var area = pick(['110101','310101','440101','330101','320101']); var bd = String(1950+Math.floor(Math.random()*55)).slice(2)+String(Math.floor(Math.random()*12)+1).padStart(2,'0')+String(Math.floor(Math.random()*28)+1).padStart(2,'0'); return area + '19' + bd + r(2) + pick('0123456789X');
        case 'address': return pick(CITIES) + pick(['朝阳区','海淀区','浦东新区','天河区','西湖区','鼓楼区','武侯区','南山区','雁塔区','渝中区']) + pick(STREETS) + (Math.floor(Math.random()*300)+1) + '号';
        case 'company': return pick(COMPANIES) + pick(['有限公司','科技股份','网络科技','信息技术','集团控股']);
        case 'date': var d = new Date(2020+Math.floor(Math.random()*6), Math.floor(Math.random()*12), Math.floor(Math.random()*28)+1); return d.toISOString().split('T')[0];
        case 'ip': return Math.floor(Math.random()*223+1)+'.'+Math.floor(Math.random()*256)+'.'+Math.floor(Math.random()*256)+'.'+Math.floor(Math.random()*254+1);
        case 'url': return 'https://' + pick(['www','api','admin','app','m']) + '.' + pick(['example','test','demo','my','dev']) + pick(['.com','.cn','.org','.io','.net']) + '/' + pick(['page','user','login','home','docs','api']);
        case 'uuid': return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0,v=c==='x'?r:(r&0x3|0x8);return v.toString(16);});
        case 'color_hex': return '#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0');
        case 'bankcard': return pick(['6222','6217','6228','6212','6214']) + r(14);
        default: return '';
    }
}

function renderTable(types) {
    var html = '<table class="table table-sm table-hover mock-table"><thead><tr><th>#</th>';
    var labels = {name_cn:'中文姓名',name_en:'英文姓名',phone:'手机号',email:'邮箱',idcard:'身份证',address:'地址',company:'公司名',date:'日期',ip:'IP地址',url:'URL',uuid:'UUID',color_hex:'颜色',bankcard:'银行卡'};
    for (var i = 0; i < types.length; i++) html += '<th>' + (labels[types[i]] || types[i]) + '</th>';
    html += '</tr></thead><tbody>';
    for (var i = 0; i < _mockResult.length; i++) {
        html += '<tr><td>' + (i+1) + '</td>';
        for (var j = 0; j < types.length; j++) {
            var v = _mockResult[i][types[j]] || '';
            if (types[j] === 'email' || types[j] === 'url') html += '<td><code>' + escHtml(v) + '</code></td>';
            else html += '<td>' + escHtml(v) + '</td>';
        }
        html += '</tr>';
    }
    html += '</tbody></table>';
    document.getElementById('mockTableWrap').innerHTML = html;
}

function copyMockData() {
    var text = JSON.stringify(_mockResult, null, 2);
    navigator.clipboard.writeText(text).then(function(){ alert('已复制JSON到剪贴板'); }).catch(function(){});
}

function exportCsv() {
    if (_mockResult.length === 0) return;
    var headers = Object.keys(_mockResult[0]);
    var csv = headers.join(',') + '\n';
    for (var i = 0; i < _mockResult.length; i++) {
        var row = headers.map(function(h){ var v = String(_mockResult[i][h]||''); return v.indexOf(',')>=0?'"'+v+'"':v; });
        csv += row.join(',') + '\n';
    }
    var blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'mock_data.csv'; a.click();
}

// Type toggle
(function(){
    document.getElementById('typeGrid').addEventListener('click', function(e){
        var btn = e.target.closest('.mock-type-btn');
        if (!btn) return;
        btn.classList.toggle('active');
    });
})();

genMockData();
</script>
{% endblock %}
