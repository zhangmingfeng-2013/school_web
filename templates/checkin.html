{% extends "base.html" %}
{% block title %}每日签到 - 多合一工具箱{% endblock %}
{% block content %}
<style nonce="{{ csp_nonce }}">
.ck-container { max-width: 900px; margin: 0 auto; }
.ck-header { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
.ck-streak {
    font-size: 2rem; font-weight: 700; background: linear-gradient(135deg, #f59e0b, #ef4444);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.ck-streak-label { font-size: .85rem; color: var(--bs-secondary-color); }
.ck-year-nav { display: flex; gap: .35rem; align-items: center; margin-left: auto; }
.ck-year-nav button {
    padding: .35rem .75rem; border-radius: 8px; border: 1.5px solid var(--bs-border-color);
    background: var(--bs-body-bg); color: var(--bs-body-color); cursor: pointer;
    font-size: .85rem; transition: all .2s;
}
.ck-year-nav button:hover { border-color: #f59e0b; }
.ck-year-nav button.active { background: #f59e0b; color: #fff; border-color: #f59e0b; }
/* Heatmap */
.ck-heatmap { overflow-x: auto; padding-bottom: .5rem; }
.ck-heatmap-grid { display: flex; gap: 3px; }
.ck-heatmap-col { display: flex; flex-direction: column; gap: 3px; }
.ck-cell {
    width: 14px; height: 14px; border-radius: 3px; background: var(--bs-border-color);
    cursor: default; transition: all .15s; position: relative;
}
.ck-cell:hover { transform: scale(1.3); z-index: 2; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
.ck-cell.level-1 { background: #bbf7d0; }
.ck-cell.level-2 { background: #86efac; }
.ck-cell.level-3 { background: #4ade80; }
.ck-cell.level-4 { background: #22c55e; }
.ck-cell.level-5 { background: #16a34a; }
.ck-cell.today { box-shadow: 0 0 0 2px #f59e0b; }
.ck-month-labels { display: flex; gap: 3px; margin-bottom: 4px; padding-left: 26px; }
.ck-month-labels span { font-size: .65rem; color: var(--bs-secondary-color); width: 14px; }
.ck-day-labels { display: flex; flex-direction: column; gap: 3px; margin-right: 6px; padding-top: 18px; }
.ck-day-labels span { font-size: .65rem; color: var(--bs-secondary-color); height: 14px; line-height: 14px; width: 20px; text-align: right; }
/* Checkin card */
.ck-today-card {
    padding: 1.5rem; border-radius: 16px; background: var(--bs-body-bg);
    border: 2px solid var(--bs-border-color); margin-bottom: 1.5rem;
    display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;
}
.ck-today-card.checked { border-color: #4ade80; background: rgba(74,222,128,.05); }
.ck-mood-select { display: flex; gap: .4rem; flex-wrap: wrap; }
.ck-mood-btn {
    width: 44px; height: 44px; border-radius: 12px; border: 2px solid transparent;
    background: var(--bs-body-bg); font-size: 1.4rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all .2s;
}
.ck-mood-btn:hover { transform: scale(1.1); }
.ck-mood-btn.selected { border-color: #f59e0b; background: rgba(245,158,11,.1); transform: scale(1.1); }
.ck-checkin-btn {
    padding: .75rem 2rem; border-radius: 30px; border: none; font-weight: 700; font-size: 1.1rem;
    background: linear-gradient(135deg, #f59e0b, #ef4444); color: #fff;
    cursor: pointer; transition: all .2s; box-shadow: 0 4px 15px rgba(245,158,11,.3);
}
.ck-checkin-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(245,158,11,.4); }
.ck-checkin-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
.ck-note-input {
    flex: 1; min-width: 150px; padding: .6rem 1rem; border-radius: 10px;
    border: 1.5px solid var(--bs-border-color); background: var(--bs-body-bg);
    color: var(--bs-body-color); font-size: .9rem;
}
.ck-note-input:focus { border-color: #f59e0b; outline: none; }
.ck-legend { display: flex; align-items: center; gap: 4px; font-size: .7rem; color: var(--bs-secondary-color); justify-content: flex-end; margin-top: .5rem; }
.ck-legend .ck-cell { width: 12px; height: 12px; }
/* Tooltip */
.ck-tooltip {
    position: fixed; background: #1f2937; color: #fff; padding: .35rem .6rem;
    border-radius: 6px; font-size: .75rem; pointer-events: none; z-index: 9999;
    white-space: nowrap; display: none; box-shadow: 0 4px 12px rgba(0,0,0,.3);
}
@media (max-width: 640px) {
    .ck-today-card { flex-direction: column; align-items: stretch; }
    .ck-cell { width: 11px; height: 11px; }
}
</style>

<div class="ck-container">
    <div class="ck-header">
        <div>
            <div class="ck-streak-label">🔥 连续签到</div>
            <div><span class="ck-streak" id="ckStreak">0</span> <span class="u86">天</span></div>
        </div>
        <div class="u87">
            <span class="u88">📅 <span id="ckYearLabel">2026</span> 年共签到 <strong id="ckTotal">0</strong> 天</span>
        </div>
    </div>

    <!-- Today checkin -->
    <div class="ck-today-card" id="ckTodayCard">
        <div class="u89">📅 今日签到</div>
        <div class="ck-mood-select" id="ckMoodSelect">
            <button class="ck-mood-btn selected" data-csp-click="selectMood" data-csp-args='["😊"]'>😊</button>
            <button class="ck-mood-btn" data-csp-click="selectMood" data-csp-args='["😄"]'>😄</button>
            <button class="ck-mood-btn" data-csp-click="selectMood" data-csp-args='["😢"]'>😢</button>
            <button class="ck-mood-btn" data-csp-click="selectMood" data-csp-args='["😡"]'>😡</button>
            <button class="ck-mood-btn" data-csp-click="selectMood" data-csp-args='["🤔"]'>🤔</button>
            <button class="ck-mood-btn" data-csp-click="selectMood" data-csp-args='["😴"]'>😴</button>
        </div>
        <input type="text" class="ck-note-input" id="ckNote" placeholder="今天的心情...（选填）" maxlength="200">
        <button class="ck-checkin-btn" data-csp-click="doCheckin" id="ckCheckinBtn">✅ 签到</button>
        <div id="ckCheckedMsg" class="u90">✅ 今日已签到 <span id="ckCheckedMood"></span></div>
    </div>

    <!-- Heatmap -->
    <div class="u91">
        <div class="ck-day-labels" id="ckDayLabels"></div>
        <div class="u92">
            <div class="ck-month-labels" id="ckMonthLabels"></div>
            <div class="ck-heatmap-grid" id="ckHeatmap"></div>
            <div class="ck-legend">
                <span>少</span>
                <div class="ck-cell level-0"></div><div class="ck-cell level-1"></div><div class="ck-cell level-2"></div>
                <div class="ck-cell level-3"></div><div class="ck-cell level-4"></div><div class="ck-cell level-5"></div>
                <span>多</span>
            </div>
        </div>
    </div>
</div>

<div class="ck-tooltip" id="ckTooltip"></div>
{% endblock %}

{% block scripts %}
<script nonce="{{ csp_nonce }}">
var currentYear = new Date().getFullYear();
var currentMood = '😊';
var todayStr = new Date().toISOString().split('T')[0];
var checkinDates = {};

function selectMood(mood) {
    currentMood = mood;
    document.querySelectorAll('.ck-mood-btn').forEach(function(b) { b.classList.remove('selected'); });
    var target = document.querySelector('[data-csp-args*="\\"' + mood + '\\""]');
    if (target) target.classList.add('selected');
}

function loadCheckinData() {
    document.getElementById('ckYearLabel').textContent = currentYear;
    fetch('/api/checkin/status?year=' + currentYear)
    .then(function(r) { return r.json(); })
    .then(function(d) {
        document.getElementById('ckStreak').textContent = d.streak;
        document.getElementById('ckTotal').textContent = d.total;
        checkinDates = {};
        d.dates.forEach(function(item) { checkinDates[item.date] = item.mood; });

        if (d.checked_today) {
            document.getElementById('ckCheckinBtn').style.display = 'none';
            document.getElementById('ckMoodSelect').style.display = 'none';
            document.getElementById('ckNote').style.display = 'none';
            document.getElementById('ckCheckedMsg').style.display = 'block';
            document.getElementById('ckCheckedMood').textContent = d.today_mood || '';
            document.getElementById('ckTodayCard').classList.add('checked');
        }
        renderHeatmap();
    });
}

function renderHeatmap() {
    var container = document.getElementById('ckHeatmap');
    var monthLabels = document.getElementById('ckMonthLabels');
    var dayLabels = document.getElementById('ckDayLabels');

    // Day labels
    dayLabels.innerHTML = '<span></span><span>一</span><span></span><span>三</span><span></span><span>五</span><span></span>';

    // Calculate grid
    var startDate = new Date(currentYear, 0, 1);
    var endDate = new Date(currentYear, 11, 31);
    var firstDay = startDate.getDay(); // 0=Sun
    // Adjust to Monday start
    var dayOffset = firstDay === 0 ? 6 : firstDay - 1;

    var cols = [];
    var weekDays = [];
    // Fill first column before Jan 1
    var d = new Date(startDate);
    d.setDate(d.getDate() - dayOffset);
    for (var i = 0; i < 7; i++) {
        weekDays.push(new Date(d));
        d.setDate(d.getDate() + 1);
    }

    var colDates = [];
    for (var i = 0; i < 7; i++) {
        colDates.push(new Date(weekDays[i]));
    }

    // Build weeks
    var weeks = [];
    var currentWeek = [];
    for (var i = 0; i < 7; i++) {
        currentWeek.push(colDates[i]);
    }
    weeks.push(currentWeek);

    while (true) {
        var nextWeek = [];
        var lastDay = weeks[weeks.length - 1][6];
        for (var i = 0; i < 7; i++) {
            var nd = new Date(lastDay);
            nd.setDate(nd.getDate() + i + 1);
            nextWeek.push(nd);
        }
        // Stop if we're past the end of the year
        if (nextWeek[0].getFullYear() > currentYear && nextWeek[0].getMonth() > 0) {
            // Check if any day in this week is still in the year
            var hasDays = false;
            for (var i = 0; i < 7; i++) {
                if (nextWeek[i].getFullYear() === currentYear) { hasDays = true; break; }
            }
            if (!hasDays) break;
        }
        weeks.push(nextWeek);
    }

    // Month labels
    var mlHtml = '';
    var lastMonth = -1;
    weeks.forEach(function(week, wi) {
        var mid = week[3]; // middle of week
        if (mid.getMonth() !== lastMonth && mid.getFullYear() === currentYear) {
            var months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
            // Calculate position
            var spanWidth = 14 * 7 + 3 * 6; // cell width * 7 + gap * 6
            mlHtml += '<span class="u93" + (wi * (14 + 3)) + 'px;">' + months[mid.getMonth()] + '</span>';
            lastMonth = mid.getMonth();
        }
    });
    monthLabels.innerHTML = '<div class="u94">' + mlHtml + '</div>';

    // Render cells
    var html = '';
    weeks.forEach(function(week, wi) {
        html += '<div class="ck-heatmap-col">';
        week.forEach(function(date, di) {
            var dateStr = date.toISOString().split('T')[0];
            var inYear = date.getFullYear() === currentYear;
            var cls = '';
            if (inYear) {
                var mood = checkinDates[dateStr];
                if (mood) {
                    // Map mood to level (just use level 4 for simplicity since each day has one checkin)
                    cls = ' level-3';
                }
                if (dateStr === todayStr) cls += ' today';
            } else {
                cls = '';
            }
            html += '<div class="ck-cell' + cls + '" data-date="' + dateStr + '" data-csp-click="showTooltip" data-csp-args=\'["' + dateStr + '"]\'></div>';
        });
        html += '</div>';
    });
    container.innerHTML = html;

    // Add hover tooltips
    document.querySelectorAll('.ck-cell').forEach(function(cell) {
        cell.addEventListener('mouseenter', function(e) {
            var d = this.getAttribute('data-date');
            var tip = document.getElementById('ckTooltip');
            var mood = checkinDates[d];
            if (mood) {
                tip.textContent = d + ' ' + mood + ' 已签到';
            } else {
                var cellDate = new Date(d + 'T00:00:00');
                if (cellDate.getFullYear() === currentYear) {
                    tip.textContent = d + ' 未签到';
                } else {
                    tip.style.display = 'none';
                    return;
                }
            }
            tip.style.display = 'block';
            tip.style.left = (e.clientX + 12) + 'px';
            tip.style.top = (e.clientY - 30) + 'px';
        });
        cell.addEventListener('mouseleave', function() {
            document.getElementById('ckTooltip').style.display = 'none';
        });
    });
}

function showTooltip(dateStr) { /* handled by event listeners above */ }

function doCheckin() {
    var btn = document.getElementById('ckCheckinBtn');
    var note = document.getElementById('ckNote').value.trim();
    btn.disabled = true;
    btn.textContent = '签到中...';

    fetch('/api/checkin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mood: currentMood, note: note })
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
        if (d.error) {
            btn.disabled = false;
            btn.textContent = '✅ 签到';
            alert(d.error);
            return;
        }
        document.getElementById('ckCheckinBtn').style.display = 'none';
        document.getElementById('ckMoodSelect').style.display = 'none';
        document.getElementById('ckNote').style.display = 'none';
        document.getElementById('ckCheckedMsg').style.display = 'block';
        document.getElementById('ckCheckedMood').textContent = currentMood;
        document.getElementById('ckTodayCard').classList.add('checked');
        loadCheckinData();
    })
    .catch(function() {
        btn.disabled = false;
        btn.textContent = '✅ 签到';
    });
}

loadCheckinData();
</script>
{% endblock %}
