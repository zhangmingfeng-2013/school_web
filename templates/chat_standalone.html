{% extends "base.html" %}
{% block title %}聊天 - 多合一工具箱{% endblock %}
{% block content %}
<div class="chat-container">
    <div id="sidebar" class="chat-sidebar">
        <div class="chat-sidebar-title">
            💬 聊天
            <button data-csp-click="openAISettings" class="ai-settings-btn" title="AI 机器人设置">⚙️</button>
        </div>
        <button data-csp-click="switchToWorld" id="worldBtn" class="ch-btn active">🌍 世界频道</button>
        <button data-csp-click="switchToAI" id="aiBtn" class="ch-btn">🤖 AI 助手</button>
        <div class="chat-friends-header">
            好友 <button data-csp-click="toggleSearch" class="chat-search-btn">🔍</button>
        </div>
        <div id="searchBox" class="chat-search-box">
            <input id="searchQ" placeholder="搜索昵称..." class="chat-search-input" data-csp-enter="doSearch">
            <div id="searchResults" class="chat-search-results"></div>
        </div>
        <div id="friendReqs" class="chat-friend-reqs">好友请求</div>
        <div id="friendReqsList"></div>
        <div id="friendList" class="chat-friend-list"></div>
    </div>

    <div class="chat-main">
        <div id="chatHeader" class="chat-header">
            🌍 世界频道
            <button id="aiClearBtn" data-csp-click="clearAIHistory" class="ai-clear-btn">🗑️ 清空对话</button>
        </div>
        <div id="messages" class="chat-messages">
            <div class="chat-empty">暂无消息，开始聊天吧！</div>
        </div>
        <div class="chat-input-row">
            <input id="msgInput" placeholder="发消息..." maxlength="4000" class="chat-input" data-csp-enter="sendMsg">
            <button data-csp-click="sendMsg" class="chat-send-btn">发送</button>
        </div>
    </div>
</div>

<div id="ctxMenu" class="chat-ctx-menu">
    <div data-csp-click="recallMsg" class="chat-ctx-item">↩️ 撤回消息</div>
</div>

<!-- AI 设置弹窗 -->
<div id="aiSettingsOverlay" class="ai-modal-overlay">
    <div class="ai-modal">
        <div class="ai-modal-header">
            🤖 AI 机器人设置
            <button data-csp-click="closeAISettings" class="ai-modal-close">&times;</button>
        </div>
        <div class="ai-modal-body">
            <label>API 地址</label>
            <input id="aiProviderUrl" placeholder="https://api.openai.com/v1" class="ai-input">
            <small>支持任何 OpenAI 兼容接口（如 DeepSeek、通义千问、智谱等）</small>

            <label>模型名称</label>
            <input id="aiModelName" placeholder="gpt-4o-mini" class="ai-input">
            <small>例如 gpt-4o-mini, deepseek-chat, qwen-plus</small>

            <label>API Key</label>
            <input id="aiApiKey" type="password" placeholder="sk-..." class="ai-input">
            <small>密钥已保存，重新输入才会更新。留空则使用已保存的密钥</small>
        </div>
        <div class="ai-modal-footer">
            <a href="/ai_config" class="u74">📋 高级配置 →</a>
            <button data-csp-click="closeAISettings" class="ai-btn-secondary">取消</button>
            <button data-csp-click="saveAISettings" class="ai-btn-primary">保存</button>
        </div>
    </div>
</div>

<style nonce="{{ csp_nonce }}">

.chat-messages { flex:1; overflow-y:auto; padding:14px; background:#fafafa }
.chat-input-row { display:flex; gap:8px; padding:10px 14px; border-top:1px solid #ddd }
.chat-input { flex:1; padding:8px 14px; border:1px solid #ddd; border-radius:20px; font-size:14px }

.chat-friends-header { font-size:12px; color:#999; padding:8px 12px; display:flex; justify-content:space-between; align-items:center }
.chat-search-btn { background:none; border:none; cursor:pointer }
.chat-search-box { display:none; padding:4px 8px; position:relative }
.chat-search-input { width:100%; padding:6px; border:1px solid #ddd; border-radius:4px; font-size:13px }

.chat-friend-list { flex:1; overflow-y:auto; padding:4px 8px }

.chat-ctx-menu { display:none; position:fixed; background:#fff; border:1px solid #ddd; border-radius:8px; box-shadow:0 4px 12px rgba(0,0,0,.15); z-index:1000 }

.sr-item:hover { background:#e8eeff }
.btn-xs { padding:2px 6px;font-size:11px;border:1px solid #ddd;border-radius:4px;background:#fff;cursor:pointer }
.btn-xs.primary { background:#04c;color:#fff;border-color:#04c }
.btn-xs.danger { background:#dc3545;color:#fff;border-color:#dc3545 }

/* AI 设置按钮 */
.ai-settings-btn { background:none;border:none;cursor:pointer;font-size:16px;padding:2px 4px;border-radius:4px }
.ai-settings-btn:hover { background:#ddd }
.ai-clear-btn { display:none;background:none;border:1px solid #ddd;border-radius:6px;cursor:pointer;font-size:12px;padding:2px 8px;color:#999 }

/* AI 设置弹窗 */
.ai-modal-overlay { display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:2000;justify-content:center;align-items:center }
.ai-modal-overlay.show { display:flex }

.ai-modal-close:hover { color:#333 }
.ai-modal-body { padding:16px 20px }
.ai-modal-body label { display:block;font-size:13px;font-weight:600;color:#555;margin:12px 0 4px }
.ai-modal-body label:first-child { margin-top:0 }
.ai-modal-body small { display:block;font-size:11px;color:#999;margin-top:2px }
.ai-input { width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px;box-sizing:border-box }
.ai-input:focus { border-color:#04c;outline:none }
.ai-modal-footer { padding:12px 20px;border-top:1px solid #eee;display:flex;justify-content:flex-end;gap:8px }
.ai-btn-primary { padding:8px 20px;background:#04c;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px }
.ai-btn-primary:hover { background:#038 }
.ai-btn-secondary { padding:8px 20px;background:#f0f0f0;border:1px solid #ddd;border-radius:6px;cursor:pointer;font-size:14px }
.ai-btn-secondary:hover { background:#e0e0e0 }

/* AI 正在输入动画 */
.ai-typing { display:flex;gap:4px;padding:8px 14px;align-items:center }
.ai-typing span { width:8px;height:8px;background:#bbb;border-radius:50%;animation:ai-bounce 1.2s infinite }
.ai-typing span:nth-child(2) { animation-delay:0.2s }
.ai-typing span:nth-child(3) { animation-delay:0.4s }

/* 响应式：小屏时 sidebar 缩小 */
@media (max-width: 768px) {
    .chat-sidebar { width:160px }
}
@media (max-width: 480px) {
    .chat-container { min-height:400px; height:auto }
    .chat-sidebar { width:100%; max-height:120px }
}
</style>

<script nonce="{{ csp_nonce }}">
var channel='world', dmUser='', currentUser='', friends=[], recallId=null, polling=null;
var myUsername = '{{ username }}';
var aiMode = false;  // 是否在 AI 聊天模式

function ajax(url, opts) {
    if(!opts) opts = {};
    opts.credentials = 'include';
    return fetch(url, opts).then(r => r.json());
}

// ===== 频道切换 =====
function switchToWorld() {
    channel='world'; dmUser=''; aiMode=false;
    document.getElementById('worldBtn').classList.add('active');
    document.getElementById('aiBtn').classList.remove('active');
    document.getElementById('chatHeader').innerHTML = '🌍 世界频道';
    document.getElementById('aiClearBtn').style.display = 'none';
    document.getElementById('msgInput').placeholder = '发消息...';
    document.getElementById('msgInput').maxLength = 1000;
    loadMsgs();
}
function switchDM(user) {
    channel='dm'; dmUser=user; aiMode=false;
    document.getElementById('worldBtn').classList.remove('active');
    document.getElementById('aiBtn').classList.remove('active');
    document.getElementById('chatHeader').innerHTML = '💬 '+user;
    document.getElementById('aiClearBtn').style.display = 'none';
    document.getElementById('msgInput').placeholder = '发消息...';
    document.getElementById('msgInput').maxLength = 1000;
    loadMsgs();
}
function switchToAI() {
    channel='ai'; dmUser=''; aiMode=true;
    document.getElementById('worldBtn').classList.remove('active');
    document.getElementById('aiBtn').classList.add('active');
    document.getElementById('chatHeader').innerHTML = '🤖 AI 助手 <span id="aiModelBadge" class="u75"></span>';
    document.getElementById('aiClearBtn').style.display = 'inline-block';
    document.getElementById('msgInput').placeholder = '向 AI 提问...';
    document.getElementById('msgInput').maxLength = 4000;
    loadAIMsgs();
    loadAIModelBadge();
}

// ===== 加载 AI 模型名称徽章 =====
async function loadAIModelBadge() {
    try {
        var cfg = await ajax('/api/chat/ai/config');
        var badge = document.getElementById('aiModelBadge');
        if (badge && cfg.model_name) badge.textContent = '(' + cfg.model_name + ')';
    } catch(e) {}
}

// ===== HTML 转义（防 XSS）=====
function escapeHtml(s) {
    if (s == null) return ''
    var div = document.createElement('div')
    div.appendChild(document.createTextNode(String(s)))
    return div.innerHTML
}

// ===== 加载消息 =====
async function loadMsgs() {
    if (aiMode) { loadAIMsgs(); return; }
    var url = '/api/chat/messages?channel=' + channel;
    if(channel==='dm') url += '&with=' + dmUser;
    var msgs = await ajax(url) || [];
    var html = msgs.length===0 ? '<div class="chat-empty">暂无消息</div>' :
        msgs.map(function(m){
            var cls = 'msg' + (m.sender===myUsername?' mine':'') + (m.content==='[消息已撤回]'?' recalled':'');
            return '<div class="'+cls+'" data-msg-id="'+m.id+'" data-msg-sender="'+escapeHtml(m.sender)+'" data-msg-content="'+encodeURIComponent(m.content)+'">'
                + '<div class="sender">'+escapeHtml(m.sender)+'</div>'
                + '<div class="bubble">'+escapeHtml(m.content)+'</div>'
                + '<div class="time">'+(m.created_at||'').slice(5,16)+'</div></div>';
        }).join('');
    var box = document.getElementById('messages');
    box.innerHTML = html;
    box.scrollTop = box.scrollHeight;
}

// ===== 加载 AI 对话历史 =====
async function loadAIMsgs() {
    var msgs = await ajax('/api/chat/ai/messages') || [];
    var html = msgs.length===0 ? '<div class="chat-empty">你好！我是 AI 助手，有什么可以帮你的？</div>' :
        msgs.map(function(m){
            var isMe = m.role === 'user';
            var cls = 'msg' + (isMe?' mine':' bot');
            var content = escapeHtml(m.content).replace(/\n/g, '<br>');
            return '<div class="'+cls+'">'
                + '<div class="sender">'+(isMe?myUsername:'🤖 AI 助手')+'</div>'
                + '<div class="bubble">'+content+'</div>'
                + '<div class="time">'+(m.created_at||'').slice(5,16)+'</div></div>';
        }).join('');
    var box = document.getElementById('messages');
    box.innerHTML = html;
    box.scrollTop = box.scrollHeight;
}

function showMenu(e, id, sender, content) {
    if(decodeURIComponent(content) === '[消息已撤回]') return;
    if(sender !== myUsername) return;
    e.preventDefault();
    recallId = id;
    var m = document.getElementById('ctxMenu');
    m.style.display = 'block'; m.style.left = e.clientX+'px'; m.style.top = e.clientY+'px';
}

async function recallMsg() {
    if(!recallId || !confirm('确定撤回？')) return;
    await ajax('/api/chat/messages/'+recallId, {method:'DELETE'});
    recallId = null; document.getElementById('ctxMenu').style.display = 'none';
    loadMsgs();
}

// ===== 发送消息 =====
async function sendMsg() {
    var inp = document.getElementById('msgInput');
    var text = inp.value.trim();
    if(!text) return;
    inp.value = '';

    if (aiMode) {
        await sendAIMsg(text);
    } else {
        await ajax('/api/chat/send', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({channel:channel,content:text,recipient:dmUser||undefined})});
        loadMsgs();
    }
}

// ===== AI 消息发送 =====
async function sendAIMsg(text) {
    var box = document.getElementById('messages');
    // 暂停轮询，避免刷新覆盖输入提示
    var savedPoll = polling;
    if (polling) { clearInterval(polling); polling = null; }

    // 显示用户消息
    var userHtml = '<div class="msg mine"><div class="sender">'+myUsername+'</div><div class="bubble">'+text+'</div><div class="time">刚刚</div></div>';
    // 显示输入中动画
    var typingHtml = '<div class="msg bot" id="aiTyping"><div class="sender">🤖 AI 助手</div><div class="bubble"><div class="ai-typing"><span></span><span></span><span></span></div></div></div>';
    box.innerHTML += userHtml + typingHtml;
    box.scrollTop = box.scrollHeight;

    try {
        var resp = await ajax('/api/chat/ai/ask', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({message:text})
        });

        // 移除输入中动画
        var typingEl = document.getElementById('aiTyping');
        if (typingEl) typingEl.remove();

        if (resp.error) {
            box.innerHTML += '<div class="msg bot"><div class="sender">🤖 AI 助手</div><div class="bubble u76">❌ '+resp.error+'</div></div>';
        } else {
            box.innerHTML += '<div class="msg bot"><div class="sender">🤖 AI 助手</div><div class="bubble">'+resp.reply.replace(/\n/g,'<br>')+'</div><div class="time">刚刚</div></div>';
        }
    } catch(e) {
        var typingEl = document.getElementById('aiTyping');
        if (typingEl) typingEl.remove();
        box.innerHTML += '<div class="msg bot"><div class="sender">🤖 AI 助手</div><div class="bubble u76">❌ 请求失败: '+e.message+'</div></div>';
    }

    box.scrollTop = box.scrollHeight;
    // 恢复轮询
    if (savedPoll) polling = setInterval(function(){ if (!aiMode) { loadMsgs(); loadFriends(); } }, 3000);
}

// ===== 清空 AI 历史 =====
async function clearAIHistory() {
    if (!confirm('确定清空所有 AI 对话历史？')) return;
    await ajax('/api/chat/ai/clear', {method:'POST'});
    document.getElementById('messages').innerHTML = '<div class="chat-empty">对话已清空，开始新的对话吧！</div>';
}

// ===== AI 设置弹窗 =====
async function openAISettings() {
    // 加载已保存配置
    try {
        var cfg = await ajax('/api/chat/ai/config');
        document.getElementById('aiProviderUrl').value = cfg.provider_url || '';
        document.getElementById('aiModelName').value = cfg.model_name || 'gpt-3.5-turbo';
        document.getElementById('aiApiKey').value = '';  // 不显示已保存的 key
        if (cfg.has_key) {
            document.getElementById('aiApiKey').placeholder = '已保存 (留空则不更新)';
        }
    } catch(e) {}
    document.getElementById('aiSettingsOverlay').classList.add('show');
}
function closeAISettings() {
    document.getElementById('aiSettingsOverlay').classList.remove('show');
}
async function saveAISettings() {
    var providerUrl = document.getElementById('aiProviderUrl').value.trim();
    var modelName = document.getElementById('aiModelName').value.trim();
    var apiKey = document.getElementById('aiApiKey').value.trim();

    if (!providerUrl) { alert('请填写 API 地址'); return; }
    if (!apiKey && !document.getElementById('aiApiKey').placeholder.includes('已保存')) {
        alert('请填写 API Key');
        return;
    }

    var payload = { provider_url: providerUrl, model_name: modelName || 'gpt-3.5-turbo' };
    if (apiKey) payload.api_key = apiKey;

    var resp = await ajax('/api/chat/ai/config', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(payload)
    });

    if (resp.success) {
        closeAISettings();
        alert('AI 设置已保存！现在可以点击 🤖 AI 助手 开始对话');
        if (aiMode) loadAIModelBadge();
    } else {
        alert('保存失败: ' + (resp.error || '未知错误'));
    }
}

// ===== 好友操作 =====
async function loadFriends() {
    var fs = await ajax('/api/chat/friends') || [];
    friends = fs;
    var list = document.getElementById('friendList');
    list.innerHTML = fs.map(function(f){
        return '<div class="fr-item'+(dmUser===f.username?' active':'')+'" data-chat-user="'+f.username+'">'+f.nickname+' <small>('+f.username+')</small></div>';
    }).join('');
    var frs = await ajax('/api/chat/friends/requests') || [];
    var reqsDiv = document.getElementById('friendReqs');
    var reqsList = document.getElementById('friendReqsList');
    if(frs.length) {
        reqsDiv.style.display = 'block';
        reqsList.innerHTML = frs.map(function(r){
            return '<div class="req-item"><span>'+r.nickname+'</span><div><button class="btn-xs primary chat-accept-btn" data-chat-user="'+r.from+'">\u2713</button> <button class="btn-xs danger chat-delfriend-btn" data-chat-user="'+r.from+'">\u2715</button></div></div>';
        }).join('');
    } else { reqsDiv.style.display = 'none'; reqsList.innerHTML = ''; }
}

function toggleSearch() {
    document.getElementById('searchBox').style.display = document.getElementById('searchBox').style.display==='none'?'block':'none';
}

async function doSearch() {
    var q = document.getElementById('searchQ').value.trim();
    if(!q) return;
    var results = await ajax('/api/chat/search?q='+encodeURIComponent(q)) || [];
    var box = document.getElementById('searchResults');
    if(results.length===0) { box.style.display='none'; return; }
    box.style.display = 'block';
    box.innerHTML = results.map(function(r){
        return '<div class="sr-item chat-sendreq-btn" data-chat-user="'+r.username+'">'+r.nickname+' <small>('+r.username+')</small></div>';
    }).join('');
}

async function sendReq(username) {
    var r = await ajax('/api/chat/friends/request', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:username})});
    alert(r.error || '好友请求已发送');
    document.getElementById('searchResults').style.display = 'none';
    document.getElementById('searchQ').value = '';
}

async function acceptReq(username) {
    await ajax('/api/chat/friends/accept', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:username})});
    loadFriends();
}

async function delFriend(username) {
    await ajax('/api/chat/friends/remove', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:username})});
    loadFriends();
}

// ---- CSP-safe event delegation for JS-rendered elements ----
document.addEventListener('click', function(e) {
    var el;
    // Friend list item click → switchDM
    el = e.target.closest('[data-chat-user]');
    if (el && el.closest('#friendList')) {
        switchDM(el.getAttribute('data-chat-user'));
        return;
    }
    // Search result → sendReq
    el = e.target.closest('.chat-sendreq-btn');
    if (el) { sendReq(el.getAttribute('data-chat-user')); return; }
    // Accept friend request
    el = e.target.closest('.chat-accept-btn');
    if (el) { acceptReq(el.getAttribute('data-chat-user')); return; }
    // Del friend request
    el = e.target.closest('.chat-delfriend-btn');
    if (el) { delFriend(el.getAttribute('data-chat-user')); return; }
    // Close AI settings when clicking overlay
    if (e.target.id === 'aiSettingsOverlay') { closeAISettings(); }
});

// 轮询：世界/DM 每3秒刷新，AI 模式不轮询（手动刷新即可）
polling = setInterval(function(){ loadMsgs(); loadFriends(); }, 3000);
loadMsgs(); loadFriends();

document.addEventListener('click', function(e){
    if(!document.getElementById('ctxMenu').contains(e.target))
        document.getElementById('ctxMenu').style.display = 'none';
});

document.getElementById('messages').addEventListener('contextmenu', function(e) {
    var el = e.target.closest('[data-msg-id]');
    if (!el) return;
    var id = parseInt(el.getAttribute('data-msg-id'));
    var sender = el.getAttribute('data-msg-sender');
    var content = el.getAttribute('data-msg-content');
