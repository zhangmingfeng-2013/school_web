{% extends "base.html" %}
{% block title %}聊天 - 多合一工具箱{% endblock %}
{% block content %}
<div style="display:flex;height:calc(100vh - 120px);min-height:500px;border:1px solid #ddd;border-radius:10px;overflow:hidden;background:#fff">
    <!-- Sidebar -->
    <div id="sidebar" style="width:220px;background:#f8f9fa;border-right:1px solid #ddd;display:flex;flex-direction:column">
        <div style="padding:12px;border-bottom:1px solid #ddd;font-weight:700">💬 聊天</div>
        <button onclick="switchToWorld()" id="worldBtn" class="ch-btn active">🌍 世界频道</button>
        <div style="font-size:12px;color:#999;padding:8px 12px;display:flex;justify-content:space-between;align-items:center">
            好友 <button onclick="toggleSearch()" style="background:none;border:none;cursor:pointer">🔍</button>
        </div>
        <div id="searchBox" style="display:none;padding:4px 8px;position:relative">
            <input id="searchQ" placeholder="搜索昵称..." style="width:100%;padding:6px;border:1px solid #ddd;border-radius:4px;font-size:13px" onkeyup="if(event.key==='Enter')doSearch()">
            <div id="searchResults" style="display:none;position:absolute;top:100%;left:8px;right:8px;background:#fff;border:1px solid #ddd;border-radius:6px;z-index:10;max-height:150px;overflow-y:auto"></div>
        </div>
        <div id="friendReqs" style="font-size:11px;color:#f60;padding:4px 8px;display:none">好友请求</div>
        <div id="friendReqsList"></div>
        <div id="friendList" style="flex:1;overflow-y:auto;padding:4px 8px"></div>
    </div>

    <!-- Chat area -->
    <div style="flex:1;display:flex;flex-direction:column">
        <div id="chatHeader" style="padding:10px 14px;border-bottom:1px solid #ddd;font-weight:700">🌍 世界频道</div>
        <div id="messages" style="flex:1;overflow-y:auto;padding:14px;background:#fafafa">
            <div style="text-align:center;color:#999;padding:60px">暂无消息，开始聊天吧！</div>
        </div>
        <div style="display:flex;gap:8px;padding:10px 14px;border-top:1px solid #ddd">
            <input id="msgInput" placeholder="发消息..." maxlength="1000" style="flex:1;padding:8px 14px;border:1px solid #ddd;border-radius:20px;font-size:14px" onkeyup="if(event.key==='Enter')sendMsg()">
            <button onclick="sendMsg()" style="padding:6px 20px;background:#04c;color:#fff;border:none;border-radius:20px;cursor:pointer;font-size:14px">发送</button>
        </div>
    </div>
</div>

<div id="ctxMenu" style="display:none;position:fixed;background:#fff;border:1px solid #ddd;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:1000" onclick="this.style.display='none'">
    <div onclick="recallMsg()" style="padding:8px 16px;cursor:pointer;font-size:13px">↩️ 撤回消息</div>
</div>

<style nonce="{{ csp_nonce }}">
.ch-btn { padding:10px 12px;background:none;border:none;text-align:left;cursor:pointer;font-size:14px;border-bottom:1px solid #eee;width:100% }
.ch-btn.active,.ch-btn:hover { background:#e8eeff }
.fr-item { padding:6px 8px;cursor:pointer;border-radius:6px;font-size:13px;display:flex;justify-content:space-between;align-items:center }
.fr-item:hover,.fr-item.active { background:#e8eeff }
.req-item { display:flex;justify-content:space-between;align-items:center;padding:4px 8px;font-size:13px }
.msg { margin-bottom:12px;max-width:70% }
.msg.mine { margin-left:auto }
.msg .sender { font-size:11px;color:#999;margin-bottom:2px }
.msg.mine .sender { text-align:right }
.msg .bubble { padding:8px 14px;border-radius:14px;background:#fff;font-size:14px;line-height:1.5;word-break:break-word }
.msg.mine .bubble { background:#04c;color:#fff }
.msg .time { font-size:10px;color:#bbb;margin-top:2px }
.msg.mine .time { text-align:right }
.msg.recalled .bubble { background:#f5f5f5;color:#999;font-style:italic }
.sr-item { padding:6px 8px;cursor:pointer;font-size:13px }
.sr-item:hover { background:#e8eeff }
.btn-xs { padding:2px 6px;font-size:11px;border:1px solid #ddd;border-radius:4px;background:#fff;cursor:pointer }
.btn-xs.primary { background:#04c;color:#fff;border-color:#04c }
.btn-xs.danger { background:#dc3545;color:#fff;border-color:#dc3545 }
</style>

<script nonce="{{ csp_nonce }}">
var channel='world', dmUser='', currentUser='', friends=[], recallId=null, polling=null;
var myUsername = '{{ username }}';

function ajax(url, opts) {
    if(!opts) opts = {};
    opts.credentials = 'include';
    return fetch(url, opts).then(r => r.json());
}

function switchToWorld() { channel='world'; dmUser=''; document.getElementById('worldBtn').classList.add('active'); document.getElementById('chatHeader').textContent='🌍 世界频道'; loadMsgs() }
function switchDM(user) { channel='dm'; dmUser=user; document.getElementById('worldBtn').classList.remove('active'); document.getElementById('chatHeader').textContent='💬 '+user; loadMsgs() }

async function loadMsgs() {
    var url = '/api/chat/messages?channel=' + channel;
    if(channel==='dm') url += '&with=' + dmUser;
    var msgs = await ajax(url) || [];
    var html = msgs.length===0 ? '<div style="text-align:center;color:#999;padding:60px">暂无消息</div>' :
        msgs.map(function(m){
            var cls = 'msg' + (m.sender===myUsername?' mine':'') + (m.content==='[消息已撤回]'?' recalled':'');
            return '<div class="'+cls+'" data-id="'+m.id+'" oncontextmenu="showMenu(event,'+m.id+',\''+m.sender+'\',\''+encodeURIComponent(m.content)+'\')">'
                + '<div class="sender">'+m.sender+'</div>'
                + '<div class="bubble">'+m.content+'</div>'
                + '<div class="time">'+(m.created_at||'').slice(5,16)+'</div></div>';
        }).join('');
    var box = document.getElementById('messages');
    box.innerHTML = html;
    box.scrollTop = box.scrollHeight;
}

function showMenu(e, id, sender, content) {
    if(decodeURIComponent(content) === '[消息已撤回]') return;
    if(sender !== myUsername) return;
    e.preventDefault();
    recallId = id;
    var m = document.getElementById('ctxMenu');
    m.style.display = 'block'; m.style.left = e.clientX+'px'; m.style.top = e.clientY+'px';
}

async function recallMsg() {
    if(!recallId || !confirm('确定撤回？')) return;
    await ajax('/api/chat/messages/'+recallId, {method:'DELETE'});
    recallId = null; document.getElementById('ctxMenu').style.display = 'none';
    loadMsgs();
}

async function sendMsg() {
    var inp = document.getElementById('msgInput');
    var text = inp.value.trim();
    if(!text) return;
    await ajax('/api/chat/send', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({channel:channel,content:text,recipient:dmUser||undefined})});
    inp.value = ''; loadMsgs();
}

async function loadFriends() {
    var fs = await ajax('/api/chat/friends') || [];
    friends = fs;
    var list = document.getElementById('friendList');
    list.innerHTML = fs.map(function(f){
        return '<div class="fr-item'+(dmUser===f.username?' active':'')+'" onclick="switchDM(\''+f.username+'\')">'+f.nickname+' <small>('+f.username+')</small></div>';
    }).join('');
    var frs = await ajax('/api/chat/friends/requests') || [];
    var reqsDiv = document.getElementById('friendReqs');
    var reqsList = document.getElementById('friendReqsList');
    if(frs.length) {
        reqsDiv.style.display = 'block';
        reqsList.innerHTML = frs.map(function(r){
            return '<div class="req-item"><span>'+r.nickname+'</span><div><button class="btn-xs primary" onclick="acceptReq(\''+r.from+'\')">✓</button> <button class="btn-xs danger" onclick="delFriend(\''+r.from+'\')">✕</button></div></div>';
        }).join('');
    } else { reqsDiv.style.display = 'none'; reqsList.innerHTML = ''; }
}

function toggleSearch() {
    document.getElementById('searchBox').style.display = document.getElementById('searchBox').style.display==='none'?'block':'none';
}

async function doSearch() {
    var q = document.getElementById('searchQ').value.trim();
    if(!q) return;
    var results = await ajax('/api/chat/search?q='+encodeURIComponent(q)) || [];
    var box = document.getElementById('searchResults');
    if(results.length===0) { box.style.display='none'; return; }
    box.style.display = 'block';
    box.innerHTML = results.map(function(r){
        return '<div class="sr-item" onclick="sendReq(\''+r.username+'\')">'+r.nickname+' <small>('+r.username+')</small></div>';
    }).join('');
}

async function sendReq(username) {
    var r = await ajax('/api/chat/friends/request', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:username})});
    alert(r.error || '好友请求已发送');
    document.getElementById('searchResults').style.display = 'none';
    document.getElementById('searchQ').value = '';
}

async function acceptReq(username) {
    await ajax('/api/chat/friends/accept', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:username})});
    loadFriends();
}

async function delFriend(username) {
    await ajax('/api/chat/friends/remove', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:username})});
    loadFriends();
}

setInterval(function(){ loadMsgs(); loadFriends(); }, 3000);
loadMsgs(); loadFriends();

document.addEventListener('click', function(e){
    if(!document.getElementById('ctxMenu').contains(e.target))
        document.getElementById('ctxMenu').style.display = 'none';
});
</script>
{% endblock %}
