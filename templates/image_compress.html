{% extends "base.html" %}
{% block title %}图片压缩 - 多合一工具箱{% endblock %}
{% block content %}
<style nonce="{{ csp_nonce }}">
.img-compress-container { max-width: 800px; margin: 0 auto; }
.upload-zone {
    border: 2px dashed var(--border-light); border-radius: 16px;
    padding: 3rem 2rem; text-align: center; cursor: pointer;
    transition: border-color .2s, background .2s;
}
.upload-zone:hover, .upload-zone.drag-over {
    border-color: #3b82f6; background: rgba(59,130,246,.05);
}
.upload-zone .icon { font-size: 3rem; margin-bottom: .5rem; }
.upload-zone p { color: var(--text-muted); margin: 0; }
.preview-row { display: flex; gap: 1.5rem; margin-top: 1.5rem; }
.preview-col { flex: 1; text-align: center; }
.preview-col img { max-width: 100%; max-height: 300px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); object-fit: contain; }
.preview-label { font-weight: 600; margin-bottom: .5rem; }
.file-info { font-size: .85rem; color: var(--text-muted); margin-top: .5rem; }
.reduction-badge { font-size: 1rem; font-weight: 700; }
@media (max-width: 600px) { .preview-row { flex-direction: column; } }
</style>

<h2 class="mb-4">🖼️ 图片压缩</h2>

<div class="img-compress-container">
    <div class="card mb-4">
        <div class="card-body">
            <div id="uploadZone" class="upload-zone" data-csp-click="triggerUpload">
                <div class="icon">📁</div>
                <p>点击或拖拽图片到此处上传</p>
                <small class="text-muted">支持 JPG、PNG、WebP 格式</small>
            </div>
            <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" style="display:none;" data-csp-change="handleFileSelect">
        </div>
    </div>

    <div id="compressSettings" style="display:none;">
        <div class="card mb-4">
            <div class="card-body">
                <h6 class="card-title mb-3">压缩设置</h6>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">压缩质量: <strong id="qualityLabel">80</strong>%</label>
                        <input type="range" id="qualitySlider" class="form-range" min="10" max="100" value="80" data-csp-change="updateQualityLabel">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">最大宽度 (px)</label>
                        <input type="number" id="maxWidth" class="form-control" value="1920" min="100" max="8000" placeholder="不限制则留空">
                        <small class="text-muted">超出此宽度将等比缩放</small>
                    </div>
                </div>
                <button class="btn btn-primary btn-lg mt-3 w-100" data-csp-click="compressImage" id="compressBtn" disabled>🗜️ 开始压缩</button>
            </div>
        </div>
    </div>

    <div id="compressLoading" style="display:none; text-align:center; padding:2rem;">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-muted">正在压缩...</p>
    </div>

    <div class="card" id="compressResult" style="display:none;">
        <div class="card-body">
            <h6 class="card-title mb-3">压缩结果</h6>
            <div class="preview-row">
                <div class="preview-col">
                    <div class="preview-label">原始图片</div>
                    <img id="originalPreview" src="" alt="原始图片">
                    <div class="file-info" id="originalInfo"></div>
                </div>
                <div class="preview-col">
                    <div class="preview-label">压缩后</div>
                    <img id="compressedPreview" src="" alt="压缩后图片">
                    <div class="file-info" id="compressedInfo"></div>
                </div>
            </div>
            <div class="text-center mt-3">
                <span class="badge bg-success reduction-badge" id="reductionInfo"></span>
            </div>
            <div class="text-center mt-3">
                <button class="btn btn-success btn-lg" data-csp-click="downloadCompressed">💾 下载压缩图片</button>
            </div>
        </div>
    </div>

    <div id="compressError" style="display:none;" class="alert alert-danger mt-3"></div>
</div>
{% endblock %}

{% block scripts %}
<script nonce="{{ csp_nonce }}">
var selectedFile = null;

function triggerUpload() {
    document.getElementById('fileInput').click();
}

function handleFileSelect(e) {
    var files = e.target.files;
    if (files && files.length > 0) {
        selectedFile = files[0];
        if (!selectedFile.type.match(/image\/(jpeg|png|webp)/)) {
            alert('请上传 JPG、PNG 或 WebP 格式的图片');
            selectedFile = null;
            return;
        }
        document.getElementById('compressSettings').style.display = 'block';
        document.getElementById('compressBtn').disabled = false;
        // Preview original
        var reader = new FileReader();
        reader.onload = function(ev) {
            document.getElementById('originalPreview').src = ev.target.result;
            document.getElementById('originalInfo').textContent = formatFileSize(selectedFile.size);
        };
        reader.readAsDataURL(selectedFile);
        // Reset results
        document.getElementById('compressResult').style.display = 'none';
        document.getElementById('compressError').style.display = 'none';
    }
}

function updateQualityLabel(e) {
    document.getElementById('qualityLabel').textContent = e.target.value;
}

function compressImage() {
    if (!selectedFile) return;

    document.getElementById('compressLoading').style.display = 'block';
    document.getElementById('compressResult').style.display = 'none';
    document.getElementById('compressError').style.display = 'none';

    var formData = new FormData();
    formData.append('file', selectedFile);
    formData.append('quality', document.getElementById('qualitySlider').value);
    var mw = document.getElementById('maxWidth').value;
    if (mw) formData.append('max_width', mw);

    fetch('/api/image_compress', {
        method: 'POST',
        body: formData,
        credentials: 'include'
    }).then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
    }).then(function(d) {
        document.getElementById('compressLoading').style.display = 'none';
        if (d.ok) {
            document.getElementById('compressedPreview').src = 'data:' + (d.mime_type || 'image/jpeg') + ';base64,' + d.compressed;
            document.getElementById('compressedInfo').textContent = formatFileSize(d.compressed_size || 0);
            var reduction = d.original_size ? Math.round((1 - d.compressed_size / d.original_size) * 100) : 0;
            var reductionEl = document.getElementById('reductionInfo');
            reductionEl.textContent = '减小了 ' + reduction + '%';
            reductionEl.className = 'badge reduction-badge ' + (reduction > 30 ? 'bg-success' : reduction > 0 ? 'bg-warning text-dark' : 'bg-secondary');
            document.getElementById('compressResult').style.display = 'block';
        } else {
            showCompressError(d.error || '压缩失败');
        }
    }).catch(function(err) {
        document.getElementById('compressLoading').style.display = 'none';
        showCompressError('请求失败: ' + err.message);
    });
}

function showCompressError(msg) {
    var err = document.getElementById('compressError');
    err.textContent = msg;
    err.style.display = 'block';
}

function downloadCompressed() {
    var img = document.getElementById('compressedPreview');
    if (!img.src || !img.src.startsWith('data:')) return;
    var a = document.createElement('a');
    a.href = img.src;
    a.download = 'compressed_' + (selectedFile ? selectedFile.name : 'image.jpg');
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

function formatFileSize(bytes) {
    if (!bytes) return '0 B';
    var sizes = ['B', 'KB', 'MB', 'GB'];
    var i = Math.floor(Math.log(bytes) / Math.log(1024));
    return (bytes / Math.pow(1024, i)).toFixed(1) + ' ' + sizes[i];
}

// Drag and drop
(function() {
    var zone = document.getElementById('uploadZone');
    zone.addEventListener('dragover', function(e) { e.preventDefault(); e.stopPropagation(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', function(e) { e.preventDefault(); e.stopPropagation(); zone.classList.remove('drag-over'); });
    zone.addEventListener('drop', function(e) {
        e.preventDefault(); e.stopPropagation();
        zone.classList.remove('drag-over');
        var files = e.dataTransfer.files;
        if (files && files.length > 0) {
            selectedFile = files[0];
            if (!selectedFile.type.match(/image\/(jpeg|png|webp)/)) {
                alert('请上传 JPG、PNG 或 WebP 格式的图片');
                selectedFile = null;
                return;
            }
            document.getElementById('compressSettings').style.display = 'block';
            document.getElementById('compressBtn').disabled = false;
            document.getElementById('compressResult').style.display = 'none';
            document.getElementById('compressError').style.display = 'none';
            var reader = new FileReader();
            reader.onload = function(ev) {
                document.getElementById('originalPreview').src = ev.target.result;
                document.getElementById('originalInfo').textContent = formatFileSize(selectedFile.size);
            };
            reader.readAsDataURL(selectedFile);
        }
    });
})();
</script>
{% endblock %}
