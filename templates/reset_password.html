{% extends "base.html" %}
{% block title %}重置密码{% endblock %}
{% block content %}
<div class="card u107">
    <div class="card-body p-4">
        <h3 class="text-center mb-4">🔐 重置密码</h3>

        <form method="POST">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
            <div class="mb-3">
                <label class="form-label">用户名</label>
                <input type="text" name="username" class="form-control form-control-lg" placeholder="输入用户名" required>
            </div>
            <div class="mb-3">
                <label class="form-label">重置令牌</label>
                <input class="form-control u108" type="text" name="token"  placeholder="粘贴从忘记密码页面获取的令牌" required>
            </div>
            <div class="mb-3">
                <label class="form-label">验证码</label>
                <div class="input-group">
                    <input class="form-control u52" type="text" name="captcha"  placeholder="输入验证码" maxlength="6" required>
                    <img class="captcha-img u53" src="data:image/gif;base64,R0lGODlhAQABAAAAACw="  title="点击刷新" alt="验证码">
                </div>
            </div>
            <hr>
            <div class="mb-3">
                <label class="form-label">新密码 <small class="text-muted">(至少8位，含字母和数字)</small></label>
                <input type="password" name="new_pwd" autocomplete="new-password" class="form-control form-control-lg" placeholder="输入新密码" required>
            </div>
            <div class="mb-3">
                <label class="form-label">确认新密码</label>
                <input type="password" name="confirm_pwd" autocomplete="new-password" class="form-control form-control-lg" placeholder="再次输入新密码" required>
            </div>
            <button type="submit" class="btn btn-success btn-lg w-100 mb-2">✅ 重置密码</button>
        </form>

        <div class="text-center mt-3">
            <a href="{{ url_for('login') }}" class="text-decoration-none">← 返回登录</a>
        </div>
    </div>
</div>
{% endblock %}
