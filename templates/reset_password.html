{% extends "base.html" %}
{% block title %}重置密码{% endblock %}
{% block content %}
<div class="card" style="max-width:440px;margin:60px auto">
    <div class="card-body p-4">
        <h3 class="text-center mb-4">🔐 重置密码</h3>

        <form method="POST">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
            <div class="mb-3">
                <label class="form-label">用户名</label>
                <input type="text" name="username" class="form-control form-control-lg" placeholder="输入用户名" required>
            </div>
            <div class="mb-3">
                <label class="form-label">重置令牌</label>
                <input type="text" name="token" class="form-control" placeholder="粘贴从忘记密码页面获取的令牌" required style="font-family:monospace;font-size:14px">
            </div>
            <div class="mb-3">
                <label class="form-label">验证码</label>
                <div class="input-group">
                    <input type="text" name="captcha" class="form-control" placeholder="输入验证码" maxlength="4" required style="font-size:18px;letter-spacing:4px">
                    <img src="/api/captcha" onclick="this.src='/api/captcha?'+Date.now()" title="点击刷新" alt="验证码" style="height:46px;border:1px solid #d9d9d9;border-radius:4px;cursor:pointer">
                </div>
            </div>
            <hr>
            <div class="mb-3">
                <label class="form-label">新密码 <small class="text-muted">(至少8位，含字母和数字)</small></label>
                <input type="password" name="new_pwd" class="form-control form-control-lg" placeholder="输入新密码" required>
            </div>
            <div class="mb-3">
                <label class="form-label">确认新密码</label>
                <input type="password" name="confirm_pwd" class="form-control form-control-lg" placeholder="再次输入新密码" required>
            </div>
            <button type="submit" class="btn btn-success btn-lg w-100 mb-2">✅ 重置密码</button>
        </form>

        <div class="text-center mt-3">
            <a href="{{ url_for('login') }}" class="text-decoration-none">← 返回登录</a>
        </div>
    </div>
</div>
{% endblock %}
