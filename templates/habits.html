{% extends "base.html" %}
{% block title %}习惯追踪 - 多合一工具箱{% endblock %}
{% block content %}
<style nonce="{{ csp_nonce }}">
.habits-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1rem; }
.habit-card { border: 1px solid var(--border-light); border-radius: 12px; padding: 1rem; background: var(--bs-body-bg); transition: box-shadow .2s; }
.habit-card:hover { box-shadow: var(--card-shadow); }
.habit-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
.habit-name { font-weight: 600; font-size: 1.1rem; }
.habit-days { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 0.5rem; }
.habit-day { width: 24px; height: 24px; border-radius: 4px; cursor: pointer; border: 1px solid var(--border-light); display: flex; align-items: center; justify-content: center; font-size: 0.7rem; transition: all .15s; background: var(--bs-tertiary-bg); }
.habit-day.checked { background: #10b981; color: #fff; border-color: #10b981; }
.habit-day.today { border: 2px solid #3b82f6; }
.progress { height: 8px; border-radius: 4px; }
.progress-bar { border-radius: 4px; transition: width .3s; }
.habit-progress-label { font-size: 0.8rem; color: var(--text-muted); }
.habit-progress-pct { font-size: 0.8rem; font-weight: 600; }
.habit-actions { display: flex; gap: 4px; }
.icon-picker-item { display: inline-block; width: 36px; height: 36px; line-height: 36px; text-align: center; border-radius: 8px; cursor: pointer; border: 2px solid transparent; font-size: 1.2rem; transition: all .15s; }
.icon-picker-item:hover { border-color: #3b82f6; background: rgba(59,130,246,.1); }
.icon-picker-item.selected { border-color: #3b82f6; background: rgba(59,130,246,.15); }
.color-picker-wrap { display: flex; gap: 6px; flex-wrap: wrap; }
.color-dot { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: all .15s; }
.color-dot:hover { transform: scale(1.15); }
.color-dot.selected { border-color: #3b82f6; transform: scale(1.1); }
.checkin-btn { display:block;width:100%;padding:10px 16px;border-radius:10px;font-weight:700;font-size:1rem;cursor:pointer;border:2px dashed #10b981;background:rgba(16,185,129,.08);color:#10b981;transition:all .2s;margin-bottom:.75rem }
.checkin-btn:hover { border-style:solid;background:rgba(16,185,129,.18);transform:scale(1.02) }
.checkin-btn.done { border-color:#d1d5db;background:#f9fafb;color:#6b7280;border-style:solid;cursor:default }
.checkin-btn.done:hover { transform:none;background:#f9fafb }
.habit-day.today-big { width:36px;height:36px;border-radius:6px;font-size:.85rem;font-weight:700;border-width:3px;border-color:#3b82f6;box-shadow:0 0 8px rgba(59,130,246,.25) }
.habit-day.today-big.checked { background:#10b981;color:#fff;border-color:#10b981;box-shadow:0 0 12px rgba(16,185,129,.35) }
.streak-badge { display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:20px;font-size:.75rem;font-weight:600 }
.streak-fire { color:#f59e0b }
.streak-badge-fire { background:rgba(245,158,11,.15) }
[data-bs-theme="dark"] .streak-badge-fire { background:rgba(245,158,11,.2) }
.overview-card { background:linear-gradient(135deg,rgba(59,130,246,.05),rgba(16,185,129,.05));border:1px solid var(--border-light);border-radius:12px;padding:1rem;margin-bottom:1.5rem }
.overview-stats { display:flex;gap:1.5rem;flex-wrap:wrap }
.overview-stat { text-align:center;min-width:70px }
.overview-stat-val { font-size:1.8rem;font-weight:700 }
.overview-stat-label { font-size:.75rem;color:var(--text-muted);margin-top:2px }
.confetti { position:fixed;z-index:9999;pointer-events:none;animation:confettiFall 1s ease-out forwards }
@keyframes confettiFall { 0%{opacity:1;transform:translateY(0) rotate(0deg)} 100%{opacity:0;transform:translateY(120px) rotate(360deg)} }
</style>

<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h2 class="mb-0">✅ 习惯追踪</h2>
    <div class="d-flex gap-2">
        <button class="btn btn-primary btn-sm" data-csp-click="showAddHabit">➕ 新建习惯</button>
        <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary btn-sm">← 返回</a>
    </div>
</div>

<!-- Today Overview -->
<div class="overview-card" id="overviewCard">
    <div class="d-flex justify-content-between align-items-center mb-2">
        <h6 class="mb-0">📅 今日打卡状态 — <span id="todayDate"></span></h6>
        <button class="btn btn-sm btn-outline-success" data-csp-click="checkinAllToday">✅ 一键全部打卡</button>
    </div>
    <div class="overview-stats" id="overviewStats">
        <div class="overview-stat"><div class="overview-stat-val" style="color:#3b82f6" id="ovTotal">0</div><div class="overview-stat-label">总习惯</div></div>
        <div class="overview-stat"><div class="overview-stat-val" style="color:#10b981" id="ovDone">0</div><div class="overview-stat-label">今日已完成</div></div>
        <div class="overview-stat"><div class="overview-stat-val" style="color:#f59e0b" id="ovRemain">0</div><div class="overview-stat-label">待打卡</div></div>
        <div class="overview-stat"><div class="overview-stat-val" style="color:#ec4899" id="ovBestStreak">0</div><div class="overview-stat-label">🔥 最佳连续</div></div>
        <div class="overview-stat"><div class="overview-stat-val" style="color:#8b5cf6" id="ovRate">0%</div><div class="overview-stat-label">本月达成率</div></div>
    </div>
</div>

<!-- Add Habit Form -->
<div class="card mb-4" id="addHabitCard" style="display:none;">
    <div class="card-body">
        <h5 class="card-title mb-3">新建习惯</h5>
        <form id="habitForm" data-csp-submit="submitHabit">
            <div class="mb-3">
                <label class="form-label">习惯名称</label>
                <input type="text" name="name" class="form-control" placeholder="例如：每天喝水" required>
            </div>
            <div class="mb-3">
                <label class="form-label">图标</label>
                <div id="iconPicker">
                    <span class="icon-picker-item selected" data-icon="✅">✅</span>
                    <span class="icon-picker-item" data-icon="📚">📚</span>
                    <span class="icon-picker-item" data-icon="🏃">🏃</span>
                    <span class="icon-picker-item" data-icon="💧">💧</span>
                    <span class="icon-picker-item" data-icon="🧘">🧘</span>
                    <span class="icon-picker-item" data-icon="🎵">🎵</span>
                    <span class="icon-picker-item" data-icon="✍️">✍️</span>
                    <span class="icon-picker-item" data-icon="💤">💤</span>
                </div>
                <input type="hidden" name="icon" value="✅" id="selectedIcon">
            </div>
            <div class="mb-3">
                <label class="form-label">颜色</label>
                <div class="color-picker-wrap" id="colorPicker">
                    <span class="color-dot selected" data-color="#10b981" style="background:#10b981;"></span>
                    <span class="color-dot" data-color="#3b82f6" style="background:#3b82f6;"></span>
                    <span class="color-dot" data-color="#8b5cf6" style="background:#8b5cf6;"></span>
                    <span class="color-dot" data-color="#ec4899" style="background:#ec4899;"></span>
                    <span class="color-dot" data-color="#f59e0b" style="background:#f59e0b;"></span>
                    <span class="color-dot" data-color="#ef4444" style="background:#ef4444;"></span>
                    <span class="color-dot" data-color="#06b6d4" style="background:#06b6d4;"></span>
                    <span class="color-dot" data-color="#84cc16" style="background:#84cc16;"></span>
                </div>
                <input type="hidden" name="color" value="#10b981" id="selectedColor">
            </div>
            <button type="submit" class="btn btn-success">💾 保存</button>
            <button type="button" class="btn btn-outline-secondary" data-csp-click="hideAddHabit">取消</button>
        </form>
    </div>
</div>

<!-- Habits Grid -->
<div class="habits-grid" id="habitsGrid">
    <div class="text-center text-muted py-4" style="grid-column:1/-1;">加载中...</div>
</div>
{% endblock %}
{% block scripts %}
<script nonce="{{ csp_nonce }}">
var habitDaysCount = 30;
var _allHabits = []; // cached for overview

function getLast30Days() {
    var days = [];
    var today = new Date();
    for (var i = habitDaysCount - 1; i >= 0; i--) {
        var d = new Date(today);
        d.setDate(d.getDate() - i);
        days.push(d.toISOString().split('T')[0]);
    }
    return days;
}

function showAddHabit() {
    document.getElementById('addHabitCard').style.display = 'block';
    document.querySelector('#habitForm input[name="name"]').focus();
}

function hideAddHabit() {
    document.getElementById('addHabitCard').style.display = 'none';
    document.getElementById('habitForm').reset();
    document.getElementById('selectedIcon').value = '✅';
    document.getElementById('selectedColor').value = '#10b981';
}

function submitHabit(e) {
    var form = this;
    var data = new FormData(form);
    var body = {
        name: data.get('name'),
        icon: data.get('icon'),
        color: data.get('color')
    };
    fetch('/api/habits', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body)
    }).then(function(r) { return r.json(); })
    .then(function(d) {
        if (d.ok || d.id) { hideAddHabit(); loadHabits(); }
    }).catch(function() { alert('保存失败'); });
}

function deleteHabit(id) {
    if (!confirm('确定删除这个习惯吗？')) return;
    fetch('/api/habits/' + id, { method: 'DELETE' })
        .then(function(r) { return r.json(); })
        .then(function() { loadHabits(); })
        .catch(function() {});
}

// ====== 核心：每日打卡 ======
function toggleHabitDay(habitId, day, completed) {
    var body = { habit_id: habitId, date: day, completed: !completed };
    fetch('/api/habit_logs', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body)
    }).then(function(r) { return r.json(); })
    .then(function(d) {
        if (d.ok) {
            if (!completed) spawnConfetti(); // only on check (not uncheck)
            loadHabits();
        }
    }).catch(function() {});
}

function checkinToday(habitId) {
    var today = new Date().toISOString().split('T')[0];
    toggleHabitDay(habitId, today, false);
}

function checkinAllToday() {
    var today = new Date().toISOString().split('T')[0];
    var promises = [];
    for (var i = 0; i < _allHabits.length; i++) {
        var h = _allHabits[i];
        var logs = h.logs || [];
        // Build map from logs array
        var done = false;
        for (var j = 0; j < logs.length; j++) {
            if (logs[j].date === today && logs[j].completed) { done = true; break; }
        }
        if (!done) {
            promises.push(fetch('/api/habit_logs', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({habit_id: h.id, date: today, completed: true})
            }));
        }
    }
    if (promises.length === 0) {
        alert('今日已全部打卡！🎉');
        return;
    }
    Promise.all(promises).then(function() {
        spawnConfetti();
        loadHabits();
    }).catch(function() {
        loadHabits();
    });
}

// ====== 彩纸动效 ======
function spawnConfetti() {
    var emojis = ['🎉','✨','🌟','💫','🎊','⭐','🔥','💪'];
    for (var i = 0; i < 12; i++) {
        var el = document.createElement('div');
        el.className = 'confetti';
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.left = (Math.random() * 80 + 10) + '%';
        el.style.top = (Math.random() * 30 + 30) + '%';
        el.style.fontSize = (Math.random() * 16 + 14) + 'px';
        el.style.animationDelay = (Math.random() * 0.3) + 's';
        document.body.appendChild(el);
        setTimeout(function(){ el.remove(); }, 1300);
    }
}

// ====== 连续打卡计算 ======
function calcStreak(logsMap) {
    var today = new Date().toISOString().split('T')[0];
    var yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    var yesterdayStr = yesterday.toISOString().split('T')[0];

    // Current streak: count consecutive days backward from today or yesterday
    var streak = 0;
    var checkDate = logsMap[today] ? today : (logsMap[yesterdayStr] ? yesterdayStr : null);
    if (!checkDate) return 0;

    var d = new Date(checkDate);
    while (true) {
        var ds = d.toISOString().split('T')[0];
        if (logsMap[ds]) {
            streak++;
            d.setDate(d.getDate() - 1);
        } else {
            break;
        }
    }
    return streak;
}

// ====== 渲染习惯卡片 ======
function renderHabits(habits) {
    var grid = document.getElementById('habitsGrid');
    var days = getLast30Days();
    var today = new Date().toISOString().split('T')[0];

    if (!habits || habits.length === 0) {
        grid.innerHTML = '<div class="text-center text-muted py-4" style="grid-column:1/-1;">还没有习惯，点击上方按钮创建一个吧！</div>';
        return;
    }

    var html = '';
    for (var i = 0; i < habits.length; i++) {
        var h = habits[i];
        var logs = h.logs || {};
        var logsMap = {};
        for (var k = 0; k < logs.length; k++) {
            if (logs[k].completed) logsMap[logs[k].date] = true;
        }
        var completedCount = Object.keys(logsMap).length;
        var todayDone = !!logsMap[today];
        var streak = calcStreak(logsMap);

        html += '<div class="habit-card">';
        // Check-in button
        if (todayDone) {
            html += '<div class="checkin-btn done">✅ 今日已打卡 ' + (streak > 0 ? '· 🔥 连续' + streak + '天' : '') + '</div>';
        } else {
            html += '<button class="checkin-btn" data-csp-click="checkinToday" data-csp-args="[' + h.id + ']">✅ 今日打卡</button>';
        }

        html += '<div class="habit-header">';
        html += '<span class="habit-name">' + (h.icon||'✅') + ' ' + (h.name||'未命名') + '</span>';
        html += '<div class="habit-actions">';
        if (streak >= 3) {
            html += '<span class="streak-badge streak-badge-fire"><span class="streak-fire">🔥</span> ' + streak + '天</span>';
        }
        html += '<button class="btn btn-outline-secondary btn-sm" data-csp-click="deleteHabit" data-csp-args="[' + (h.id||0) + ']">🗑</button>';
        html += '</div>';
        html += '</div>';

        // Day grid
        html += '<div class="habit-days">';
        for (var j = 0; j < days.length; j++) {
            var d = days[j];
            var checked = logsMap[d] ? ' checked' : '';
            var todayClass = d === today ? ' today-big' : '';
            var label = d.slice(5);
            html += '<div class="habit-day' + checked + todayClass + '" data-csp-click="toggleHabitDayRaw" data-habit="' + h.id + '" data-day="' + d + '" data-completed="' + (logsMap[d] ? '1' : '0') + '" title="' + d + '">';
            html += checked ? '✓' : label.slice(3);
            html += '</div>';
        }
        html += '</div>';

        // Progress bar (CSP-safe: use classes + data attrs, apply styles via DOM API below)
        var pct = Math.round((completedCount / habitDaysCount) * 100);
        var hColor = h.color || '#10b981';
        html += '<div class="d-flex justify-content-between align-items-center mb-1">';
        html += '<span class="habit-progress-label">' + completedCount + '/' + habitDaysCount + ' 天</span>';
        html += '<span class="habit-progress-pct" data-color="' + hColor + '">' + pct + '%</span>';
        html += '</div>';
        html += '<div class="progress"><div class="progress-bar" data-width="' + pct + '" data-bg="' + hColor + '"></div></div>';

        html += '</div>';
    }
    grid.innerHTML = html;

    // CSP-safe: apply dynamic styles via DOM API after innerHTML
    var bars = grid.querySelectorAll('.progress-bar');
    for (var bi = 0; bi < bars.length; bi++) {
        bars[bi].style.width = bars[bi].getAttribute('data-width') + '%';
        bars[bi].style.background = bars[bi].getAttribute('data-bg');
    }
    var pcts = grid.querySelectorAll('.habit-progress-pct');
    for (var pi = 0; pi < pcts.length; pi++) {
        pcts[pi].style.color = pcts[pi].getAttribute('data-color');
    }
}

// ====== 今日概览面板 ======
function renderOverview(habits) {
    _allHabits = habits || [];
    var today = new Date().toISOString().split('T')[0];
    var todayDateEl = document.getElementById('todayDate');
    var now = new Date();
    todayDateEl.textContent = now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日 ' + ['日','一','二','三','四','五','六'][now.getDay()];

    if (!habits || habits.length === 0) {
        document.getElementById('ovTotal').textContent = '0';
        document.getElementById('ovDone').textContent = '0';
        document.getElementById('ovRemain').textContent = '0';
        document.getElementById('ovBestStreak').textContent = '0';
        document.getElementById('ovRate').textContent = '0%';
        return;
    }

    var total = habits.length;
    var done = 0;
    var bestStreak = 0;
    var monthTotal = 0;
    var monthDone = 0;
    var monthPrefix = today.slice(0, 7);

    for (var i = 0; i < habits.length; i++) {
        var logs = habits[i].logs || [];
        var logsMap = {};
        for (var j = 0; j < logs.length; j++) {
            if (logs[j].completed) {
                logsMap[logs[j].date] = true;
            }
            if (logs[j].date.slice(0,7) === monthPrefix) {
                monthTotal++;
                if (logs[j].completed) monthDone++;
            }
        }
        if (logsMap[today]) done++;
        var streak = calcStreak(logsMap);
        if (streak > bestStreak) bestStreak = streak;
    }

    document.getElementById('ovTotal').textContent = total;
    document.getElementById('ovDone').textContent = done;
    document.getElementById('ovRemain').textContent = total - done;
    document.getElementById('ovBestStreak').textContent = bestStreak;
    document.getElementById('ovRate').textContent = monthTotal > 0 ? Math.round(monthDone / monthTotal * 100) + '%' : '0%';

    // Color the done/remain based on progress
    var doneEl = document.getElementById('ovDone');
    var remainEl = document.getElementById('ovRemain');
    var card = document.getElementById('overviewCard');
    if (done === total && total > 0) {
        doneEl.style.color = '#10b981';
        remainEl.style.color = '#10b981';
        card.style.background = 'linear-gradient(135deg,rgba(16,185,129,.08),rgba(16,185,129,.03))';
    } else {
        doneEl.style.color = '#10b981';
        remainEl.style.color = total - done > 0 ? '#f59e0b' : '#10b981';
        card.style.background = 'linear-gradient(135deg,rgba(59,130,246,.05),rgba(16,185,129,.05))';
    }
}

function loadHabits() {
    fetch('/api/habits').then(function(r) { return r.json(); })
    .then(function(data) {
        var habits = data.habits || data || [];
        renderOverview(habits);
        renderHabits(habits);
    }).catch(function() {
        document.getElementById('habitsGrid').innerHTML = '<div class="text-center text-muted py-4" style="grid-column:1/-1;">加载失败</div>';
    });
}

// ====== Event handlers ======
// icon picker
(function() {
    var icons = document.querySelectorAll('#iconPicker .icon-picker-item');
    icons.forEach(function(el) {
        el.addEventListener('click', function() {
            icons.forEach(function(x) { x.classList.remove('selected'); });
            this.classList.add('selected');
            document.getElementById('selectedIcon').value = this.getAttribute('data-icon');
        });
    });

    var colors = document.querySelectorAll('#colorPicker .color-dot');
    colors.forEach(function(el) {
        // Set background via JS (bypasses CSP inline-style blocking)
        el.style.background = el.getAttribute('data-color');
        el.addEventListener('click', function() {
            colors.forEach(function(x) { x.classList.remove('selected'); });
            this.classList.add('selected');
            document.getElementById('selectedColor').value = this.getAttribute('data-color');
        });
    });
})();

// day toggle via click delegation
document.addEventListener('click', function(e) {
    var el = e.target.closest('.habit-day');
    if (!el) return;
    var habitId = parseInt(el.getAttribute('data-habit'));
    var day = el.getAttribute('data-day');
    var completed = el.getAttribute('data-completed') === '1';
    toggleHabitDay(habitId, day, completed);
});

loadHabits();

// ====== CSP 修复：JS 初始化被屏蔽的 inline style ======
(function initCspFix() {
    // 隐藏新建习惯表单
    document.getElementById('addHabitCard').style.display = 'none';
    // 概览面板初始颜色
    document.getElementById('ovTotal').style.color = '#3b82f6';
    document.getElementById('ovDone').style.color = '#10b981';
    document.getElementById('ovRemain').style.color = '#f59e0b';
    document.getElementById('ovBestStreak').style.color = '#ec4899';
    document.getElementById('ovRate').style.color = '#8b5cf6';
})();
</script>
{% endblock %}
