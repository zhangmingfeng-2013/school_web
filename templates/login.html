{% extends "base.html" %}
{% block title %}{{ _('login_title') }} - {{ _('app_title') }}{% endblock %}
{% block content %}
<div class="auth-card">
    <div class="card">
        <div class="card-body p-4">
            <h3 class="text-center mb-4">🔐 {{ _('login_title') }}</h3>
            <form method="POST" action="{{ url_for('login') }}">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
                <div class="mb-3">
                    <label class="form-label">{{ _('login_username') }}</label>
                    <input type="text" name="username" class="form-control form-control-lg" placeholder="{{ _('login_placeholder_user') }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">{{ _('login_password') }}</label>
                    <input type="password" name="password" autocomplete="off" class="form-control form-control-lg" placeholder="{{ _('login_placeholder_pass') }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">{{ _('login_captcha') }}</label>
                    <div class="input-group">
                        <input type="text" name="captcha" class="form-control" placeholder="{{ _('login_placeholder_captcha') }}" maxlength="4" required style="font-size:18px;letter-spacing:4px">
                        <img src="/api/captcha" class="captcha-img" title="{{ _('login_captcha_click') }}" alt="{{ _('login_captcha') }}" style="height:46px;border:1px solid #d9d9d9;border-radius:4px;cursor:pointer">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100 mb-2">{{ _('login_submit') }}</button>
            </form>
            <div class="text-center mt-3">
                <a href="{{ url_for('register') }}" class="text-decoration-none">{{ _('login_register_link') }}</a>
            </div>
            <div class="text-center mt-2">
                <a href="{{ url_for('forgot_password') }}" class="text-decoration-none text-muted small">{{ _('login_forgot') }}</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
