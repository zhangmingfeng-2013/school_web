{% extends "base.html" %}
{% block title %}二维码生成 - 多合一工具箱{% endblock %}
{% block content %}
<style nonce="{{ csp_nonce }}">
.qr-container { max-width: 700px; margin: 0 auto; }
.qr-result { text-align: center; padding: 2rem; }
.qr-result img { max-width: 300px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.1); }
.qr-controls { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
.qr-size-btn { padding: .35rem .8rem; }
.qr-size-btn.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }
</style>

<h2 class="mb-4">📱 二维码生成</h2>

<div class="qr-container">
    <div class="card mb-4">
        <div class="card-body">
            <div class="mb-3">
                <label class="form-label fw-bold">输入文本或链接</label>
                <textarea id="qrText" class="form-control" rows="4" placeholder="输入要生成二维码的文本、URL 或其他内容..." data-csp-enter="generateQR"></textarea>
                <small class="text-muted">支持文字、链接、WiFi、名片等信息</small>
            </div>

            <div class="qr-controls mb-3">
                <label class="form-label mb-0 me-2 fw-bold">尺寸：</label>
                <button class="btn btn-outline-secondary btn-sm qr-size-btn active" data-csp-click="setQRSize" data-csp-args='["small"]'>小 (200)</button>
                <button class="btn btn-outline-secondary btn-sm qr-size-btn" data-csp-click="setQRSize" data-csp-args='["medium"]'>中 (300)</button>
                <button class="btn btn-outline-secondary btn-sm qr-size-btn" data-csp-click="setQRSize" data-csp-args='["large"]'>大 (500)</button>
            </div>

            <div class="d-flex gap-2">
                <button class="btn btn-primary btn-lg" data-csp-click="generateQR">✨ 生成二维码</button>
            </div>
        </div>
    </div>

    <div id="qrLoading" style="display:none; text-align:center; padding:2rem;">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-muted">正在生成...</p>
    </div>

    <div class="card" id="qrResultCard" style="display:none;">
        <div class="card-body qr-result">
            <img id="qrImage" src="" alt="QR Code">
            <div class="mt-3">
                <button class="btn btn-success" data-csp-click="downloadQR">💾 下载二维码</button>
            </div>
        </div>
    </div>

    <div id="qrError" style="display:none;" class="alert alert-danger mt-3"></div>
</div>
{% endblock %}

{% block scripts %}
<script nonce="{{ csp_nonce }}">
var currentQRData = null;
var currentQRSize = 'small';
var sizeMap = { small: 200, medium: 300, large: 500 };

function setQRSize(size) {
    currentQRSize = size;
    document.querySelectorAll('.qr-size-btn').forEach(function(btn) { btn.classList.remove('active'); });
    document.querySelector('.qr-size-btn[data-csp-args*="' + size + '"]').classList.add('active');
    if (currentQRData) generateQR();
}

function generateQR() {
    var text = document.getElementById('qrText').value.trim();
    if (!text) { alert('请输入文本内容'); return; }

    document.getElementById('qrResultCard').style.display = 'none';
    document.getElementById('qrError').style.display = 'none';
    document.getElementById('qrLoading').style.display = 'block';

    currentQRData = text;

    fetch('/api/qrcode', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text, size: sizeMap[currentQRSize] })
    }).then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
    }).then(function(d) {
        document.getElementById('qrLoading').style.display = 'none';
        if (d.ok && d.qrcode) {
            var img = document.getElementById('qrImage');
            img.src = 'data:image/png;base64,' + d.qrcode;
            document.getElementById('qrResultCard').style.display = 'block';
        } else {
            showQRError(d.error || '生成失败');
        }
    }).catch(function(err) {
        document.getElementById('qrLoading').style.display = 'none';
        showQRError('请求失败: ' + err.message);
    });
}

function showQRError(msg) {
    var err = document.getElementById('qrError');
    err.textContent = msg;
    err.style.display = 'block';
}

function downloadQR() {
    var img = document.getElementById('qrImage');
    if (!img.src) return;
    var a = document.createElement('a');
    a.href = img.src;
    a.download = 'qrcode_' + Date.now() + '.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}
</script>
{% endblock %}
