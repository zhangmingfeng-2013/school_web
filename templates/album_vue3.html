<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>毕业纪念相册</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root,[data-theme="light"] { --abg:#f5f5f5; --acolor:#333; --ahbg:#fff; --aborder:#e8e8e8; --atab-bg:#fff; --atab-color:#999; --auser:#666; --acard:#fff; --acard-shadow:0 2px 8px rgba(0,0,0,.06); --amodal:#fff; --ainput-bg:#fff; --ainput-border:#d9d9d9; --aimg-bg:#f0f0f0; --azone-bg:#fafafa; --azone-border:#d9d9d9; --acomment-border:#f0f0f0; --aempty:#999; --aoverlay:rgba(0,0,0,.4); --aspin:#e0e0e0; }
[data-theme="dark"] { --abg:#2d2d30; --acolor:#e5e7eb; --ahbg:#1c1c1e; --aborder:#3a3a3e; --atab-bg:#1c1c1e; --atab-color:#9ca3af; --auser:#9ca3af; --acard:#3b3b40; --acard-shadow:0 2px 8px rgba(0,0,0,.3); --amodal:#3b3b40; --ainput-bg:#3b3b40; --ainput-border:#4a4a50; --aimg-bg:#3b3b40; --azone-bg:#3b3b40; --azone-border:#4a4a50; --acomment-border:#3a3a3e; --aempty:#6b7280; --aoverlay:rgba(0,0,0,.6); --aspin:#4a4a50; }
body { background:var(--abg,#f5f5f5); font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif; color:var(--acolor,#333); transition:background .3s,color .3s; }
[v-cloak] { display:none!important; }

header { background:var(--ahbg,#fff); border-bottom:1px solid var(--aborder,#e8e8e8); padding:14px 20px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:200; }
header .logo { font-size:18px; font-weight:700; }
header .user-info { font-size:13px; color:var(--auser,#666); display:flex; align-items:center; gap:8px; }
.badge { display:inline-block; padding:2px 10px; border-radius:10px; font-size:11px; }
.badge-teacher { background:#fff3cd; color:#856404; }
.badge-student { background:#e2f0ff; color:#0056b3; }

.tabs { display:flex; background:var(--atab-bg); border-bottom:1px solid var(--aborder); }
.tabs button { flex:1; padding:12px; border:none; background:var(--atab-bg); cursor:pointer; font-size:14px; font-weight:600; color:var(--atab-color); transition:.2s; }
.tabs button.active { color:#04c; border-bottom:2px solid #04c; }

main { max-width:1000px; margin:0 auto; padding:16px; }

.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
.card { background:var(--acard); border-radius:10px; overflow:hidden; box-shadow:var(--acard-shadow); cursor:pointer; transition:.2s; }
.card:hover { transform:translateY(-2px); box-shadow:var(--acard-shadow); }
.card .img-wrap { height:170px; overflow:hidden; background:var(--aimg-bg); }
.card .img-wrap img { width:100%; height:100%; object-fit:cover; }

.empty-state { text-align:center; padding:60px 20px; color:var(--aempty); }
.empty-state .icon { font-size:50px; margin-bottom:10px; }

.btn { display:inline-block; padding:8px 20px; border-radius:6px; border:none; cursor:pointer; font-size:14px; }
.btn-primary { background:#04c; color:#fff; }
.btn-default { background:var(--acard); color:var(--acolor); border:1px solid var(--ainput-border); }
.btn-sm { padding:6px 14px; font-size:12px; }
.btn:hover { opacity:.85; }

.fab { position:fixed; bottom:28px; right:28px; width:50px; height:50px; border-radius:50%; background:#04c; color:#fff; border:none; font-size:24px; cursor:pointer; box-shadow:0 4px 12px rgba(0,68,204,.3); z-index:199; transition:transform .2s; }
.fab:hover { transform:scale(1.1); }

.overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:var(--aoverlay); z-index:999; display:flex; align-items:center; justify-content:center; }
.modal { background:var(--amodal); border-radius:12px; width:90%; max-width:760px; max-height:90vh; overflow-y:auto; padding:20px; }
.modal-sm { max-width:420px; }

.form-group { margin-bottom:12px; }
.form-group label { font-size:13px; font-weight:600; display:block; margin-bottom:4px; }
input[type="text"], input[type="password"], textarea { width:100%; padding:8px 12px; border:1px solid var(--ainput-border); border-radius:6px; font-size:14px; font-family:inherit; background:var(--ainput-bg); color:var(--acolor); }
input:focus, textarea:focus { outline:none; border-color:#04c; box-shadow:0 0 0 2px rgba(0,68,204,.1); }
textarea { resize:none; }

.comment-item { padding:8px 0; border-bottom:1px solid var(--acomment-border); }
.comment-item:last-child { border-bottom:none; }
.comment-item .author { font-weight:600; font-size:13px; }
.comment-item .time { font-size:11px; color:var(--aempty); margin-left:6px; }
.comment-item .body { font-size:14px; color:var(--acolor); white-space:pre-wrap; margin-top:2px; }

.msg-card { background:var(--acard); border-radius:10px; padding:16px; margin-bottom:10px; display:flex; gap:10px; }
.msg-avatar { width:36px; height:36px; border-radius:50%; background:#04c; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; flex-shrink:0; }

.upload-zone { border:2px dashed var(--azone-border); border-radius:8px; padding:24px; text-align:center; cursor:pointer; background:var(--azone-bg); transition:.2s; }
.upload-zone:hover { border-color:#04c; background:#f4f8ff; }

.spinner { display:inline-block; width:30px; height:30px; border:3px solid var(--aspin); border-top-color:#04c; border-radius:50%; animation:spin .7s linear infinite; }
@keyframes spin{to{transform:rotate(360deg)}}

.flex { display:flex; }
.flex-gap { gap:10px; }
.align-end { align-items:flex-end; }
.mt-10 { margin-top:10px; }
.mb-10 { margin-bottom:10px; }
.text-center { text-align:center; }
.text-sm { font-size:12px; color:var(--aempty); }
.fw-600 { font-weight:600; }
</style>
</head>
<body>
<script id="ud" type="application/json">{{ {"u":username,"p":permission,"t":permission!="guest"} | tojson | safe }}</script>
{% raw %}
<div id="app" v-cloak>
  <!-- Header -->
  <header>
    <div class="logo">🎓 毕业纪念相册</div>
    <div class="user-info">
      <span>{{ user.u }}</span>
      <span :class="'badge '+(user.p=='administrator'?'badge-teacher':'badge-student')">{{ user.p=='administrator'?'管理员':'用户' }}</span>
      <button class="btn btn-sm btn-default" @click="goDashboard">← 返回</button>
      <button class="theme-btn" id="albumThemeToggle" onclick="toggleAlbumTheme()" title="切换主题" style="margin-left:6px;background:none;border:1px solid var(--aborder,#ccc);border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;color:var(--acolor,#333);transition:.2s;">🌙</button>
    </div>
  </header>

  <!-- Tabs -->
  <div class="tabs">
    <button :class="{active:tab==='graduation'}" @click="switchTab('graduation')">🎓 毕业图片</button>
    <button :class="{active:tab==='daily'}" @click="switchTab('daily')">📷 精彩瞬间</button>
    <button :class="{active:tab==='board'}" @click="switchTab('board')">💬 留言板</button>
  </div>

  <main>
    <!-- Loading -->
    <div v-if="isLoading" class="text-center" style="padding:60px"><div class="spinner"></div></div>

    <!-- ===== Images ===== -->
    <template v-if="tab!=='board' && !isLoading">
      <div v-if="images.length===0" class="empty-state">
        <div class="icon">{{ tab==='graduation'?'🎓':'📷' }}</div>
        <p style="font-size:15px">还没有{{ tab==='graduation'?'毕业图片':'精彩瞬间' }}</p>
        <p class="text-sm mt-10">{{ user.t ? '点击右下角 + 上传照片' : '访客不能上传，请申请VIP' }}</p>
      </div>
      <div v-else class="grid">
        <div v-for="img in images" :key="img.id" class="card" @click="openDetail(img)">
          <div class="img-wrap"><img :src="'/static/albums/'+img.filename"></div>
          <div style="padding:8px 10px">
            <div style="font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ img.name }}</div>
            <div class="flex" style="justify-content:space-between;font-size:11px;color:#999;margin-top:2px">
              <span>{{ img.commentCount||0 }} 💬</span>
              <span>{{ img.uploadTime }}</span>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- ===== Board ===== -->
    <template v-if="tab==='board' && !isLoading">
      <div style="background:var(--acard);border-radius:10px;padding:14px;margin-bottom:12px" class="flex flex-gap align-end">
        <textarea v-model="boardText" rows="2" placeholder="写下对大家说的话..." style="flex:1"></textarea>
        <button class="btn btn-primary" @click="addBoardMessage">发表</button>
      </div>
      <div v-if="boardMessages.length===0" class="empty-state">
        <div class="icon">💭</div>
        <p style="font-size:15px">还没有留言</p>
      </div>
      <div v-for="msg in boardMessages" :key="msg.id" class="msg-card">
        <img src="/api/avatar/{{ (msg.authorName or msg.author)[0] }}?size=36&bg=04c&color=fff" alt="{{ (msg.authorName or msg.author)[0] }}" class="msg-avatar" style="object-fit:cover;border-radius:50%;">
        <div style="flex:1">
          <div class="fw-600" style="font-size:13px">{{ msg.authorName||msg.author }}</div>
          <div class="text-sm" style="margin:2px 0 4px">{{ msg.time }}</div>
          <div style="font-size:14px;color:#555;line-height:1.7;white-space:pre-wrap;word-break:break-word">{{ msg.text }}</div>
        </div>
      </div>
    </template>
  </main>

  <!-- Upload FAB -->
  <button class="fab" @click="handleUploadClick">+</button>

  <!-- ===== Detail Modal ===== -->
  <div v-if="detailImage" class="overlay" @click.self="detailImage=null">
    <div class="modal">
      <div style="background:var(--ainput-bg);border-radius:8px;padding:12px;margin-bottom:10px;text-align:center">
        <img :src="'/static/albums/'+detailImage.filename" style="max-width:100%;max-height:420px;border-radius:4px">
      </div>
      <div class="text-sm mb-10">{{ detailImage.uploadTime }} · {{ detailImage.uploaderName }}</div>
      <div class="fw-600" style="font-size:14px;margin-bottom:6px">评论 ({{ imageComments.length }})</div>
      <div style="max-height:240px;overflow-y:auto;border:1px solid #eee;border-radius:6px;padding:2px 10px">
        <div v-if="imageComments.length===0" class="text-center text-sm" style="padding:16px">暂无评论，写第一条吧 ✍️</div>
        <div v-for="c in imageComments" :key="c.id" class="comment-item">
          <span class="author">{{ c.authorName||c.author }}</span><span class="time">{{ c.time }}</span>
          <div class="body">{{ c.text }}</div>
        </div>
      </div>
      <div class="flex flex-gap align-end mt-10">
        <textarea v-model="commentText" rows="2" placeholder="写评论..." style="flex:1"></textarea>
        <button class="btn btn-primary btn-sm" @click="addImageComment">发送</button>
      </div>
      <div class="text-center mt-10"><button class="btn btn-sm btn-default" @click="detailImage=null">关闭</button></div>
    </div>
  </div>

  <!-- ===== Upload Modal ===== -->
  <div v-if="showUpload" class="overlay" @click.self="showUpload=false">
    <div class="modal modal-sm">
      <div class="fw-600" style="font-size:16px;margin-bottom:14px">📤 上传图片</div>
      <div class="form-group">
        <label>分类</label>
        <div class="flex flex-gap" style="font-size:14px">
          <label style="cursor:pointer"><input type="radio" v-model="uploadCategory" value="graduation"> 🎓 毕业图片</label>
          <label style="cursor:pointer"><input type="radio" v-model="uploadCategory" value="daily"> 📷 精彩瞬间</label>
        </div>
      </div>
      <div class="form-group"><label>名称</label><input v-model="uploadName" placeholder="给图片起个名字"></div>
      <div class="form-group">
        <label>图片</label>
        <div class="upload-zone" @click="$refs.fileInput.click()" @dragover.prevent @drop.prevent="onUploadDrop">
          <div v-if="!uploadPreview" style="color:#999">
            <div style="font-size:32px">📁</div>
            <div>点击或拖拽上传</div>
            <div class="text-sm mt-10">jpg/png/gif/webp · ≤ 5MB</div>
          </div>
          <img v-else :src="uploadPreview" style="max-width:100%;max-height:160px;border-radius:4px">
        </div>
        <input ref="fileInput" type="file" accept="image/jpeg,image/png,image/gif,image/webp" @change="onUploadFile" style="display:none">
      </div>
      <div class="flex" style="justify-content:flex-end;gap:8px">
        <button class="btn btn-default" @click="showUpload=false">取消</button>
        <button class="btn btn-primary" :disabled="isUploading" @click="doUpload">{{ isUploading?'上传中...':'上传' }}</button>
      </div>
    </div>
  </div>
</div>
{% endraw %}
<script>
const { createApp, ref, onMounted } = Vue;
const ud = JSON.parse(document.getElementById('ud').textContent);

createApp({
  setup() {
    // ---------- State ----------
    const user = ref(ud);
    const tab = ref('graduation');
    const images = ref([]);
    const boardMessages = ref([]);
    const imageComments = ref([]);
    const detailImage = ref(null);
    const isLoading = ref(false);
    const showUpload = ref(false);
    const boardText = ref('');
    const commentText = ref('');

    // Upload form
    const uploadCategory = ref('graduation');
    const uploadName = ref('');
    const uploadFile = ref(null);
    const uploadPreview = ref('');
    const isUploading = ref(false);

    // ---------- API ----------
    async function api(path, options) {
      const r = await fetch('/api/album/' + path, options);
      return r.json();
    }

    // ---------- Navigation ----------
    // ====== 主题切换 ======
    function getAlbumTheme() { return localStorage.getItem('theme') || 'light'; }
    function applyAlbumTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.setAttribute('data-bs-theme', t);
      var btn = document.getElementById('albumThemeToggle');
      if (btn) btn.textContent = t === 'dark' ? '☀️' : '🌙';
      localStorage.setItem('theme', t);
    }
    function toggleAlbumTheme() {
      applyAlbumTheme(getAlbumTheme() === 'dark' ? 'light' : 'dark');
    }
    applyAlbumTheme(getAlbumTheme());

    function goDashboard() { window.location.href = '/dashboard'; }

    function switchTab(newTab) {
      tab.value = newTab;
      if (newTab === 'board') loadBoard();
      else loadImages();
    }

    // ---------- Images ----------
    async function loadImages() {
      isLoading.value = true;
      try {
        const cat = tab.value === 'graduation' ? 'graduation' : 'daily';
        const data = await api('images?category=' + cat);
        images.value = Array.isArray(data) ? data : [];
        for (const img of images.value) {
          try {
            const cmts = await api('images/' + img.id + '/comments');
            img.commentCount = Array.isArray(cmts) ? cmts.length : 0;
          } catch { img.commentCount = 0; }
        }
      } catch {}
      isLoading.value = false;
    }

    async function openDetail(img) {
      detailImage.value = img;
      commentText.value = '';
      try {
        const cmts = await api('images/' + img.id + '/comments');
        imageComments.value = Array.isArray(cmts) ? cmts : [];
      } catch { imageComments.value = []; }
    }

    async function addImageComment() {
      const text = commentText.value.trim();
      if (!text) return alert('请输入评论');
      const data = await api('images/' + detailImage.value.id + '/comments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      if (data.error) return alert(data.error);
      const cmts = await api('images/' + detailImage.value.id + '/comments');
      imageComments.value = Array.isArray(cmts) ? cmts : [];
      commentText.value = '';
      loadImages();
    }

    // ---------- Board ----------
    async function loadBoard() {
      isLoading.value = true;
      try {
        const data = await api('comments');
        boardMessages.value = Array.isArray(data) ? data : [];
      } catch {}
      isLoading.value = false;
    }

    async function addBoardMessage() {
      const text = boardText.value.trim();
      if (!text) return alert('请输入留言');
      if (text.length > 500) return alert('留言不超过500字');
      const data = await api('comments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      if (data.error) return alert(data.error);
      boardText.value = '';
      loadBoard();
    }

    // ---------- Upload ----------
    function onUploadFile(e) {
      const f = e.target.files[0];
      if (!f) { uploadFile.value = null; uploadPreview.value = ''; return; }
      if (f.size > 5 * 1024 * 1024) { alert('图片超过5MB'); e.target.value = ''; return; }
      if (!['image/jpeg', 'image/png', 'image/gif', 'image/webp'].includes(f.type)) { alert('不支持的格式'); e.target.value = ''; return; }
      uploadFile.value = f;
      const reader = new FileReader();
      reader.onload = ev => { uploadPreview.value = ev.target.result; };
      reader.readAsDataURL(f);
    }
    function onUploadDrop(e) {
      const f = e.dataTransfer.files[0]; if (!f) return;
      const dt = new DataTransfer(); dt.items.add(f); document.querySelector('#app input[type=file]').files = dt.files;
      onUploadFile({ target: document.querySelector('#app input[type=file]') });
    }
    async function doUpload() {
      if (!uploadFile.value) return alert('请选择图片');
      isUploading.value = true;
      const fd = new FormData();
      fd.append('image', uploadFile.value);
      fd.append('category', uploadCategory.value);
      fd.append('name', uploadName.value || uploadFile.value.name);
      const data = await api('upload', { method: 'POST', body: fd });
      isUploading.value = false;
      if (data.error) return alert(data.error);
      showUpload.value = false;
      uploadPreview.value = ''; uploadFile.value = null;
      if (data.approved === false) {
        alert('✅ 照片已上传成功，等待管理员审核通过后可见');
      } else {
        alert('✅ 照片上传成功');
      }
      tab.value = uploadCategory.value;
      loadImages();
    }

    // ---------- Init ----------
    onMounted(() => loadImages());

    function handleUploadClick() {
      if (!user.t) {
        alert('❌ 访客不能上传照片\n\n请到仪表盘申请 VIP 权限后再上传');
        return;
      }
      showUpload.value = true;
    }

    return {
      user, tab, images, boardMessages, imageComments, detailImage,
      isLoading, showUpload, boardText, commentText,
      uploadCategory, uploadName, uploadPreview, isUploading,
      goDashboard, switchTab, loadImages, openDetail, addImageComment,
      loadBoard, addBoardMessage, onUploadFile, onUploadDrop, doUpload,
      handleUploadClick
    };
  }
}).mount('#app');
</script>
</body>
</html>
