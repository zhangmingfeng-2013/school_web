{% extends "base.html" %}
{% block title %}安全验证{% endblock %}
{% block content %}
<h2 class="mb-4">🔐 安全验证</h2>

<div class="card" style="max-width:420px;margin:60px auto">
    <div class="card-body text-center">
        <p class="text-muted mb-3">请输入验证码以继续访问</p>

        <form method="POST">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
            <div class="mb-3">
                <img src="/api/captcha" onclick="this.src='/api/captcha?'+Date.now()" title="点击刷新" alt="验证码" style="border:1px solid #d9d9d9;border-radius:6px;cursor:pointer">
            </div>
            <div class="mb-3">
                <input type="text" name="captcha" class="form-control text-center" placeholder="输入验证码" maxlength="4" autofocus style="font-size:22px;letter-spacing:6px">
            </div>
            <button type="submit" class="btn btn-primary w-100">✅ 验证</button>
        </form>
    </div>
</div>
{% endblock %}
