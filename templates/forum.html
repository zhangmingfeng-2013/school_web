{% extends "base.html" %}
{% block title %}校友社区论坛 - {{ _('app_title') }}{% endblock %}
{% block content %}

<style nonce="{{ csp_nonce }}">
/* ===== 论坛布局 ===== */
.forum-container { display: flex; gap: 1.5rem; align-items: flex-start; }
.forum-sidebar { width: 220px; flex-shrink: 0; position: sticky; top: 1rem; }
.forum-main { flex: 1; min-width: 0; }

/* 版块列表 */
.cat-list { list-style: none; padding: 0; margin: 0; }
.cat-item { padding: 10px 14px; border-radius: 8px; cursor: pointer; transition: background .15s; margin-bottom: 2px; font-size: .9rem; display: flex; align-items: center; gap: 8px; }
.cat-item:hover { background: var(--bg-card-hover); }
.cat-item.active { background: rgba(13,110,253,.12); font-weight: 600; color: #0d6efd; }
.cat-item .badge { margin-left: auto; font-size: .7rem; }
[data-bs-theme="dark"] .cat-item.active { background: rgba(13,110,253,.2); }

/* 搜索栏 */
.forum-search { position: relative; margin-bottom: 1rem; }
.forum-search input { padding-right: 40px; }
.forum-search .btn-search { position: absolute; right: 4px; top: 4px; bottom: 4px; border: none; background: transparent; font-size: 1.1rem; }

/* 帖子卡片 */
.post-card { border: 1px solid var(--border-light); border-radius: 10px; padding: 1rem 1.2rem; margin-bottom: .75rem; cursor: pointer; transition: box-shadow .15s, border-color .15s; }
.post-card:hover { box-shadow: var(--card-shadow); border-color: #0d6efd40; }
.post-card.pinned { border-left: 3px solid #f59e0b; }
.post-card.locked { opacity: .75; }
.post-card-title { font-size: 1.05rem; font-weight: 600; margin-bottom: .3rem; display: flex; align-items: center; gap: 8px; }
.post-card-meta { font-size: .78rem; color: var(--text-muted); display: flex; gap: 1rem; flex-wrap: wrap; }
.post-card-meta span { display: inline-flex; align-items: center; gap: 3px; }

/* 分页 */
.forum-pagination { display: flex; justify-content: center; gap: .4rem; margin-top: 1.5rem; }
.forum-pagination button { min-width: 38px; }

/* 弹窗内容 */
.post-detail-content { white-space: pre-wrap; line-height: 1.7; font-size: .95rem; }
.reply-item { padding: .8rem 0; border-bottom: 1px solid var(--border-light); }
.reply-item:last-child { border-bottom: none; }
.reply-meta { font-size: .78rem; color: var(--text-muted); margin-bottom: .4rem; }
.reply-content { white-space: pre-wrap; font-size: .9rem; line-height: 1.6; }

/* 通知下拉 */
.forum-notif-btn { position: relative; cursor: pointer; }
.forum-notif-btn .badge { position: absolute; top: -4px; right: -6px; font-size: .55rem; display: none; }
.forum-notif-btn.has-unread .badge { display: inline-block; }

/* 发帖表单 */
.new-post-form textarea { min-height: 150px; resize: vertical; }

/* 响应式 */
@media (max-width: 768px) {
    .forum-container { flex-direction: column; }
    .forum-sidebar { width: 100%; position: static; }
}
</style>

<div class="forum-container">
    <!-- 左侧版块侧栏 -->
    <div class="forum-sidebar">
        <div class="card">
            <div class="card-body py-3">
                <h6 class="mb-3 u152">📂 版块分类</h6>
                <ul class="cat-list" id="catList">
                    <li class="cat-item active" data-cat-id="0" data-csp-click="filterByCategory" data-csp-args='[0]'>
                        📋 全部帖子 <span class="badge bg-secondary" id="catBadge0">0</span>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <!-- 右侧主内容 -->
    <div class="forum-main">
        <!-- 操作栏 -->
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <div class="forum-search flex-grow-1 u153">
                <input type="text" class="form-control" id="searchInput" placeholder="搜索帖子关键词..." data-csp-enter="searchPosts">
                <button class="btn-search" data-csp-click="searchPosts">🔍</button>
            </div>
            <button class="btn btn-primary" data-csp-click="showNewPostModal">
                ✏️ 发布新帖
            </button>
        </div>

        <!-- 帖子列表 -->
        <div id="postList">
            <div class="text-center text-muted py-5">加载中...</div>
        </div>

        <!-- 分页 -->
        <div class="forum-pagination" id="pagination"></div>
    </div>
</div>

<!-- ===== 发布新帖弹窗 ===== -->
<div class="modal fade" id="newPostModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">✏️ 发布新帖</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body new-post-form">
                <div class="mb-3">
                    <label class="form-label">版块</label>
                    <select class="form-select" id="newPostCat"></select>
                </div>
                <div class="mb-3">
                    <label class="form-label">标题</label>
                    <input type="text" class="form-control" id="newPostTitle" maxlength="200" placeholder="一句话说清楚你想说什么...">
                </div>
                <div class="mb-3">
                    <label class="form-label">内容</label>
                    <textarea class="form-control" id="newPostContent" placeholder="详细描述你的想法..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" data-csp-click="submitNewPost">发布</button>
            </div>
        </div>
    </div>
</div>

<!-- ===== 帖子详情弹窗 ===== -->
<div class="modal fade" id="postDetailModal" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h5 class="modal-title" id="detailTitle"></h5>
                    <small class="text-muted" id="detailMeta"></small>
                </div>
                <div class="d-flex gap-2 align-items-center">
                    <span id="detailBadges"></span>
                    <div class="dropdown u30" id="adminActions">
                        <button class="btn btn-sm btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown">⚙️</button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#" data-csp-click="adminPinPost">📌 置顶/取消</a></li>
                            <li><a class="dropdown-item" href="#" data-csp-click="adminLockPost">🔒 锁定/解锁</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="#" data-csp-click="adminDeletePost">🗑️ 删除帖子</a></li>
                        </ul>
                    </div>
                    <button class="btn btn-sm btn-outline-danger u30" id="authorDeleteBtn"  data-csp-click="authorDeletePost">🗑️ 删除</button>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
            </div>
            <div class="modal-body">
                <div class="post-detail-content mb-4" id="detailContent"></div>
                <div class="d-flex align-items-center gap-3 mb-3" id="detailActions">
                    <button class="btn btn-sm btn-outline-danger" data-csp-click="toggleLikePost">❤️ <span id="detailLikeCount">0</span></button>
                </div>
                <hr>
                <h6 class="mb-3">💬 回复 (<span id="detailReplyCount">0</span>)</h6>
                <div id="replyList"></div>
                <div class="mt-3" id="replyForm">
                    <textarea class="form-control mb-2" id="replyInput" rows="3" placeholder="写下你的回复..."></textarea>
                    <button class="btn btn-primary btn-sm" data-csp-click="submitReply">回复</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script nonce="{{ csp_nonce }}">
// ===== 全局状态 =====
var state = {
    currentCat: 0,
    currentPage: 1,
    currentKeyword: '',
    categories: [],
    currentPostId: null,
    currentPost: null
};

var bsNewPostModal = null;
var bsPostDetailModal = null;

// ===== 初始化 =====
document.addEventListener('DOMContentLoaded', function() {
    bsNewPostModal = new bootstrap.Modal(document.getElementById('newPostModal'));
    bsPostDetailModal = new bootstrap.Modal(document.getElementById('postDetailModal'));
    loadCategories();
    loadPosts();
});

// ===== 加载版块 =====
function loadCategories() {
    fetch('/api/forum/categories')
        .then(r => r.json())
        .then(d => {
            state.categories = d.categories;
            var html = '<li class="cat-item active" data-cat-id="0" data-csp-click="filterByCategory" data-csp-args=\'[0]\'>'
                + '📋 全部帖子 <span class="badge bg-secondary" id="catBadge0">' + d.categories.reduce(function(s,c){return s+c.post_count;},0) + '</span></li>';
            d.categories.forEach(function(c) {
                html += '<li class="cat-item" data-cat-id="' + c.id + '" data-csp-click="filterByCategory" data-csp-args=\'[' + c.id + ']\'>'
                    + c.icon + ' ' + c.name + ' <span class="badge bg-secondary">' + c.post_count + '</span></li>';
            });
            document.getElementById('catList').innerHTML = html;
        });
}

// ===== 筛选版块 =====
window.filterByCategory = function(catId) {
    state.currentCat = catId;
    state.currentPage = 1;
    state.currentKeyword = '';
    document.getElementById('searchInput').value = '';
    // 更新高亮
    document.querySelectorAll('.cat-item').forEach(function(el) {
        el.classList.toggle('active', parseInt(el.getAttribute('data-cat-id')) === catId);
    });
    loadPosts();
};

// ===== 搜索 =====
window.searchPosts = function() {
    state.currentKeyword = document.getElementById('searchInput').value.trim();
    state.currentPage = 1;
    loadPosts();
};

// ===== 加载帖子列表 =====
function loadPosts() {
    var params = '?page=' + state.currentPage;
    if (state.currentCat > 0) params += '&category_id=' + state.currentCat;
    if (state.currentKeyword) params += '&keyword=' + encodeURIComponent(state.currentKeyword);

    fetch('/api/forum/posts' + params)
        .then(r => r.json())
        .then(d => {
            renderPosts(d.posts);
            renderPagination(d.page, d.total_pages, d.total);
        })
        .catch(function() {
            document.getElementById('postList').innerHTML = '<div class="text-center text-muted py-5">加载失败，请重试</div>';
        });
}

function renderPosts(posts) {
    var html = '';
    if (posts.length === 0) {
        html = '<div class="text-center text-muted py-5">暂无帖子，快来发布第一条吧 🎉</div>';
    }
    posts.forEach(function(p) {
        var badgeHtml = '';
        if (p.is_pinned) badgeHtml += '<span class="badge bg-warning text-dark me-1">📌 置顶</span>';
        if (p.is_locked) badgeHtml += '<span class="badge bg-secondary me-1">🔒 锁定</span>';
        html += '<div class="post-card' + (p.is_pinned ? ' pinned' : '') + (p.is_locked ? ' locked' : '') + '" data-csp-click="viewPost" data-csp-args=\'[' + p.id + ']\'>'
            + '<div class="post-card-title">' + badgeHtml + p.title + '</div>'
            + '<div class="post-card-meta">'
            + '<span>👤 ' + escapeHtml(p.username) + '</span>'
            + '<span>🕐 ' + p.created_at.substring(0, 16) + '</span>'
            + '<span>👁️ ' + p.view_count + '</span>'
            + '<span>💬 ' + p.reply_count + '</span>'
            + '<span>❤️ ' + p.like_count + '</span>'
            + '</div></div>';
    });
    document.getElementById('postList').innerHTML = html;
}

function renderPagination(page, totalPages, total) {
    var html = '<small class="text-muted me-2">共 ' + total + ' 条</small>';
    if (totalPages <= 1) { document.getElementById('pagination').innerHTML = html; return; }

    // 上一页
    html += '<button class="btn btn-sm btn-outline-secondary" data-csp-click="goPage" data-csp-args=\'[' + Math.max(1, page-1) + ']\'' + (page <= 1 ? ' disabled' : '') + '>‹</button>';

    var start = Math.max(1, page - 2);
    var end = Math.min(totalPages, page + 2);
    if (start > 1) html += '<button class="btn btn-sm btn-outline-secondary" data-csp-click="goPage" data-csp-args=\'[1]\'>1</button>';
    if (start > 2) html += '<span class="mx-1">...</span>';

    for (var i = start; i <= end; i++) {
        html += '<button class="btn btn-sm ' + (i === page ? 'btn-primary' : 'btn-outline-secondary') + '" data-csp-click="goPage" data-csp-args=\'[' + i + ']\'>' + i + '</button>';
    }

    if (end < totalPages - 1) html += '<span class="mx-1">...</span>';
    if (end < totalPages) html += '<button class="btn btn-sm btn-outline-secondary" data-csp-click="goPage" data-csp-args=\'[' + totalPages + ']\'>' + totalPages + '</button>';

    // 下一页
    html += '<button class="btn btn-sm btn-outline-secondary" data-csp-click="goPage" data-csp-args=\'[' + Math.min(totalPages, page+1) + ']\'' + (page >= totalPages ? ' disabled' : '') + '>›</button>';

    document.getElementById('pagination').innerHTML = html;
}

window.goPage = function(p) {
    state.currentPage = p;
    loadPosts();
    document.getElementById('postList').scrollIntoView({behavior: 'smooth'});
};

// ===== 显示发帖弹窗 =====
window.showNewPostModal = function() {
    var sel = document.getElementById('newPostCat');
    sel.innerHTML = '';
    state.categories.forEach(function(c) {
        sel.innerHTML += '<option value="' + c.id + '">' + c.icon + ' ' + c.name + '</option>';
    });
    document.getElementById('newPostTitle').value = '';
    document.getElementById('newPostContent').value = '';
    bsNewPostModal.show();
};

// ===== 提交新帖 =====
window.submitNewPost = function() {
    var title = document.getElementById('newPostTitle').value.trim();
    var content = document.getElementById('newPostContent').value.trim();
    var catId = parseInt(document.getElementById('newPostCat').value);

    if (!title || !content) { alert('标题和内容不能为空'); return; }
    if (title.length > 200) { alert('标题不能超过200字'); return; }

    var btn = document.querySelector('[data-csp-click="submitNewPost"]');
    btn.disabled = true; btn.textContent = '发布中...';

    fetch('/api/forum/posts', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({title: title, content: content, category_id: catId})
    })
    .then(r => r.json())
    .then(d => {
        if (d.ok) {
            bsNewPostModal.hide();
            loadCategories();
            loadPosts();
        } else {
            alert(d.error || '发布失败');
        }
    })
    .catch(function() { alert('网络错误'); })
    .finally(function() { btn.disabled = false; btn.textContent = '发布'; });
};

// ===== 查看帖子详情 =====
window.viewPost = function(pid) {
    state.currentPostId = pid;
    fetch('/api/forum/posts/' + pid)
        .then(r => r.json())
        .then(d => {
            if (!d.post) { alert('帖子不存在'); return; }
            state.currentPost = d.post;
            renderPostDetail(d.post);
            bsPostDetailModal.show();
        });
};

function renderPostDetail(post) {
    document.getElementById('detailTitle').textContent = post.title;

    var badges = '';
    if (post.is_pinned) badges += '<span class="badge bg-warning text-dark">📌 置顶</span> ';
    if (post.is_locked) badges += '<span class="badge bg-secondary">🔒 锁定</span> ';
    document.getElementById('detailBadges').innerHTML = badges;

    document.getElementById('detailMeta').textContent = '👤 ' + post.username + ' · ' + post.cat_icon + ' ' + post.cat_name + ' · 🕐 ' + post.created_at.substring(0, 16) + ' · 👁️ ' + post.view_count;
    document.getElementById('detailContent').textContent = post.content;

    // 点赞按钮
    var likeBtn = document.querySelector('[data-csp-click="toggleLikePost"]');
    likeBtn.innerHTML = (post.liked ? '❤️' : '🤍') + ' <span id="detailLikeCount">' + post.like_count + '</span>';
    likeBtn.classList.toggle('btn-outline-danger', !post.liked);
    likeBtn.classList.toggle('btn-danger', post.liked);

    // 管理员操作
    var isAdmin = '{{ permission }}' === 'administrator';
    var isAuthor = '{{ username }}' === post.username;
    document.getElementById('adminActions').style.display = isAdmin ? '' : 'none';
    document.getElementById('authorDeleteBtn').style.display = (isAuthor && !isAdmin) ? '' : 'none';

    // 回复列表
    document.getElementById('detailReplyCount').textContent = post.replies.length;
    var replyHtml = '';
    post.replies.forEach(function(r) {
        replyHtml += '<div class="reply-item">'
            + '<div class="reply-meta"><strong>' + escapeHtml(r.username) + '</strong> · ' + r.created_at.substring(0, 16)
            + (isAdmin || r.username === '{{ username }}' ? ' <a href="javascript:void(0)" class="text-danger u154" data-csp-click="deleteReply" data-csp-args=\'[' + r.id + ']\'>删除</a>' : '')
            + '</div>'
            + '<div class="reply-content">' + escapeHtml(r.content) + '</div>'
            + '<button class="btn btn-sm btn-link p-0 mt-1 reply-like-btn u97" data-csp-click="toggleLikeReply" data-csp-args=\'[' + r.id + ']\'>'
            + (r.liked ? '❤️' : '🤍') + ' ' + r.like_count
            + '</button>'
            + '</div>';
    });
    document.getElementById('replyList').innerHTML = replyHtml || '<div class="text-muted small py-3">暂无回复，快来抢沙发 🛋️</div>';

    // 锁定状态
    var replyForm = document.getElementById('replyForm');
    if (post.is_locked && !isAdmin) {
        replyForm.innerHTML = '<div class="alert alert-warning py-2 mb-0">🔒 此帖已被锁定，无法回复</div>';
    } else {
        replyForm.innerHTML = '<textarea class="form-control mb-2" id="replyInput" rows="3" placeholder="写下你的回复..."></textarea>'
            + '<button class="btn btn-primary btn-sm" data-csp-click="submitReply">回复</button>';
    }
}

// ===== 点赞帖子 =====
var likeLocked = false;
window.toggleLikePost = function() {
    if (!state.currentPostId || likeLocked) return;
    likeLocked = true;
    fetch('/api/forum/like', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({target_type: 'post', target_id: state.currentPostId})
    })
    .then(r => r.json())
    .then(d => {
        if (d.ok) {
            // 重新拉取帖子详情，保证与服务端完全一致
            viewPost(state.currentPostId);
        }
    })
    .finally(function() { likeLocked = false; });
};

// ===== 点赞回复 =====
window.toggleLikeReply = function(rid) {
    fetch('/api/forum/like', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({target_type: 'reply', target_id: rid})
    })
    .then(r => r.json())
    .then(d => {
        if (d.ok) {
            // 刷新详情
            viewPost(state.currentPostId);
        }
    });
};

// ===== 提交回复 =====
window.submitReply = function() {
    var content = document.getElementById('replyInput').value.trim();
    if (!content) { alert('回复内容不能为空'); return; }
    fetch('/api/forum/replies', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({post_id: state.currentPostId, content: content})
    })
    .then(r => r.json())
    .then(d => {
        if (d.ok) {
            viewPost(state.currentPostId);
        } else {
            alert(d.error || '回复失败');
        }
    });
};

// ===== 删除回复 =====
window.deleteReply = function(rid) {
    if (!confirm('确定删除这条回复？')) return;
    fetch('/api/forum/replies/' + rid, {method: 'DELETE'})
        .then(r => r.json())
        .then(d => {
            if (d.ok) viewPost(state.currentPostId);
            else alert(d.error);
        });
};

// ===== 发布者：删除自己的帖子 =====
window.authorDeletePost = function() {
    if (!confirm('确定永久删除此帖？所有回复也将被删除。')) return;
    fetch('/api/forum/posts/' + state.currentPostId, {method: 'DELETE'})
        .then(r => r.json())
        .then(d => {
            if (d.ok) {
                bsPostDetailModal.hide();
                loadCategories();
                loadPosts();
            } else {
                alert(d.error || '删除失败');
            }
        });
};

// ===== 管理员：置顶 =====
window.adminPinPost = function() {
    fetch('/api/forum/posts/' + state.currentPostId + '/pin', {method: 'POST'})
        .then(r => r.json())
        .then(d => {
            if (d.ok) {
                bsPostDetailModal.hide();
                loadPosts();
                alert(d.is_pinned ? '已置顶' : '已取消置顶');
            }
        });
};

// ===== 管理员：锁定 =====
window.adminLockPost = function() {
    fetch('/api/forum/posts/' + state.currentPostId + '/lock', {method: 'POST'})
        .then(r => r.json())
        .then(d => {
            if (d.ok) {
                viewPost(state.currentPostId);
                alert(d.is_locked ? '已锁定' : '已解锁');
            }
        });
};

// ===== 管理员：删除帖子 =====
window.adminDeletePost = function() {
    if (!confirm('确定永久删除此帖？所有回复也将被删除。')) return;
    fetch('/api/forum/posts/' + state.currentPostId, {method: 'DELETE'})
        .then(r => r.json())
        .then(d => {
            if (d.ok) {
                bsPostDetailModal.hide();
                loadCategories();
                loadPosts();
            }
        });
};

// ===== 工具函数 =====
function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}
</script>

{% endblock %}
