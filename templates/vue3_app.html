<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" content="{{ csrf_token }}">
<title>多合一工具箱</title>
<!-- Element Plus CSS -->
<link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
<!-- Element Plus Dark CSS -->
<link rel="stylesheet" href="https://unpkg.com/element-plus/theme-chalk/dark/css-vars.css">
<!-- Font Awesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style nonce="{{ csp_nonce }}">
:root {
  --sidebar-width: 220px;
  --header-height: 56px;
  --bg-primary: #f0f2f5;
  --bg-card: #ffffff;
  --text-primary: #303133;
  --text-secondary: #909399;
  --border-color: #e4e7ed;
}
html.dark {
  --bg-primary: #141414;
  --bg-card: #1d1d1d;
  --text-primary: #e5eaf3;
  --text-secondary: #a3a6ad;
  --border-color: #363637;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg-primary); color: var(--text-primary); transition: background .3s, color .3s; }
#app { min-height:100vh; display:flex; flex-direction:column; }
.app-header { height:var(--header-height); background:var(--bg-card); border-bottom:1px solid var(--border-color); display:flex; align-items:center; padding:0 20px; position:fixed; top:0; left:0; right:0; z-index:1000; box-shadow:0 1px 4px rgba(0,0,0,.04); gap:12px; }
.app-header .brand { font-size:18px; font-weight:700; color:var(--el-color-primary); white-space:nowrap; }
.app-header .header-center { flex:1; display:flex; align-items:center; gap:12px; }
.app-header .header-right { display:flex; align-items:center; gap:8px; }
.app-body { display:flex; flex:1; margin-top:var(--header-height); }
.app-sidebar { width:var(--sidebar-width); background:var(--bg-card); border-right:1px solid var(--border-color); position:fixed; top:var(--header-height); left:0; bottom:0; overflow-y:auto; transition:transform .3s; z-index:999; padding:8px 0; }
.app-main { flex:1; margin-left:var(--sidebar-width); padding:20px; min-height:calc(100vh - var(--header-height)); }
.sidebar-menu { border-right:none !important; }
/* 移动端 */
@media (max-width:768px) {
  .app-sidebar { transform:translateX(-100%); }
  .app-sidebar.open { transform:translateX(0); }
  .app-main { margin-left:0; }
  .mobile-menu-btn { display:inline-flex !important; }
}
.mobile-menu-btn { display:none !important; }
.login-bg { min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
.login-card { width:420px; max-width:95vw; background:var(--bg-card); border-radius:16px; padding:40px; box-shadow:0 20px 60px rgba(0,0,0,.15); }
.login-card h2 { text-align:center; margin-bottom:32px; font-weight:700; color:var(--text-primary); }
/* Dashboard cards */
.stat-card { background:var(--bg-card); border-radius:12px; padding:20px; border:1px solid var(--border-color); transition:.2s; }
.stat-card:hover { transform:translateY(-2px); box-shadow:0 4px 16px rgba(0,0,0,.08); }
.stat-card .stat-value { font-size:32px; font-weight:700; color:var(--el-color-primary); }
.stat-card .stat-label { font-size:13px; color:var(--text-secondary); margin-top:4px; }
.feature-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:16px; }
.feature-card { background:var(--bg-card); border-radius:12px; padding:24px; border:1px solid var(--border-color); cursor:pointer; transition:.2s; text-decoration:none; color:var(--text-primary); display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px; }
.feature-card:hover { transform:translateY(-2px); box-shadow:0 4px 16px rgba(0,0,0,.1); border-color:var(--el-color-primary); }
.feature-card .icon { font-size:36px; }
.feature-card .name { font-weight:600; font-size:15px; }
.feature-card .desc { font-size:12px; color:var(--text-secondary); }
/* Chat styles */
.chat-container { display:flex; flex-direction:column; height:calc(100vh - var(--header-height) - 40px); background:var(--bg-card); border-radius:12px; border:1px solid var(--border-color); }
.chat-messages { flex:1; overflow-y:auto; padding:16px; }
.chat-input-area { padding:16px; border-top:1px solid var(--border-color); display:flex; gap:8px; }
.chat-msg { margin-bottom:12px; display:flex; gap:8px; }
.chat-msg.mine { flex-direction:row-reverse; }
.chat-msg .bubble { max-width:70%; padding:10px 14px; border-radius:12px; font-size:14px; line-height:1.5; }
.chat-msg.mine .bubble { background:var(--el-color-primary); color:#fff; border-bottom-right-radius:4px; }
.chat-msg.other .bubble { background:var(--el-fill-color); color:var(--text-primary); border-bottom-left-radius:4px; }
.chat-msg .meta { font-size:11px; color:var(--text-secondary); margin-bottom:2px; }
/* Bot bubble */
.chat-msg.bot .bubble { background:linear-gradient(135deg, #667eea20, #764ba220); border:1px solid var(--el-color-primary-light); }
.typing-dots { display:flex; gap:4px; padding:8px 0; }
.typing-dots span { width:6px; height:6px; border-radius:50%; background:var(--el-color-primary); animation:typing 1.4s infinite ease-in-out; }
.typing-dots span:nth-child(2) { animation-delay:.2s; }
.typing-dots span:nth-child(3) { animation-delay:.4s; }
@keyframes typing { 0%,60%,100% { transform:translateY(0); opacity:.3; } 30% { transform:translateY(-8px); opacity:1; } }
/* Pet styles */
.pet-container { text-align:center; padding:40px 20px; }
.pet-display { font-size:120px; line-height:1; transition:transform .3s; cursor:pointer; user-select:none; display:inline-block; }
.pet-display:hover { transform:scale(1.1); }
.pet-display:active { transform:scale(.95); }
.pet-name { font-size:24px; font-weight:700; margin-top:8px; }
.pet-stats { display:flex; justify-content:center; gap:24px; margin:16px 0; flex-wrap:wrap; }
.pet-stat { text-align:center; min-width:80px; }
.pet-stat .label { font-size:11px; color:var(--text-secondary); }
.pet-stat .bar { height:6px; background:var(--el-fill-color); border-radius:3px; margin-top:4px; overflow:hidden; }
.pet-stat .bar-fill { height:100%; border-radius:3px; transition:width .5s; }
.pet-actions { display:flex; justify-content:center; gap:12px; margin:20px 0; flex-wrap:wrap; }
/* Scrollbar */
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--el-border-color); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:var(--el-text-color-secondary); }
/* Forum */
.forum-post { background:var(--bg-card); border-radius:12px; padding:16px; border:1px solid var(--border-color); margin-bottom:12px; cursor:pointer; transition:.2s; }
.forum-post:hover { border-color:var(--el-color-primary); box-shadow:0 2px 8px rgba(0,0,0,.06); }
.forum-post .title { font-size:16px; font-weight:600; }
.forum-post .meta { font-size:12px; color:var(--text-secondary); margin-top:8px; display:flex; gap:16px; }
/* Album grid */
.album-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:12px; }
.album-card { background:var(--bg-card); border-radius:10px; overflow:hidden; border:1px solid var(--border-color); cursor:pointer; transition:.2s; }
.album-card:hover { transform:translateY(-2px); box-shadow:0 4px 16px rgba(0,0,0,.1); }
.album-card img { width:100%; height:170px; object-fit:cover; display:block; }
.album-card .info { padding:8px 12px; font-size:12px; color:var(--text-secondary); }
/* Page transitions */
.fade-enter-active, .fade-leave-active { transition:opacity .25s ease; }
.fade-enter-from, .fade-leave-to { opacity:0; }
/* Notifications */
.notif-bell { position:relative; cursor:pointer; font-size:20px; }
.notif-bell .badge { position:absolute; top:-6px; right:-8px; }
</style>
</head>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/vue-router@4/dist/vue-router.global.prod.js"></script>
<script src="https://unpkg.com/element-plus/dist/index.full.min.js"></script>
<script src="https://unpkg.com/@element-plus/icons-vue"></script>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

<script>
const { createApp, ref, reactive, computed, watch, onMounted, onUnmounted, nextTick, h } = Vue;
const { createRouter, createWebHashHistory } = VueRouter;

// ===================== CSRF & API Helper =====================
const api = axios.create({ withCredentials: true });
api.interceptors.request.use(config => {
  const csrf = document.querySelector('meta[name="csrf-token"]')?.content || '';
  if (csrf) config.headers['X-CSRF-Token'] = csrf;
  return config;
});

// ===================== Global State =====================
const userState = reactive({
  username: '',
  permission: 'guest',
  isLoggedIn: false,
  avatarUrl: '',
});

// ===================== Components =====================

// --- Login Page ---
const LoginPage = {
  template: `
    <div class="login-card">
      <h2>🔐 登录</h2>
      <el-form :model="form" @submit.prevent="login" label-position="top">
        <el-form-item label="用户名">
          <el-input v-model="form.username" placeholder="请输入用户名" prefix-icon="User" size="large"/>
        </el-form-item>
        <el-form-item label="密码">
          <el-input v-model="form.password" type="password" placeholder="请输入密码" prefix-icon="Lock" show-password size="large" @keyup.enter="login"/>
        </el-form-item>
        <el-form-item label="验证码">
          <div style="display:flex;gap:12px;align-items:center;">
            <el-input v-model="form.captcha" placeholder="验证码" size="large" style="flex:1" @keyup.enter="login"/>
            <img :src="captchaUrl" @click="refreshCaptcha" style="height:40px;cursor:pointer;border-radius:4px;border:1px solid var(--el-border-color);" title="点击刷新"/>
          </div>
        </el-form-item>
        <el-form-item>
          <el-button type="primary" size="large" style="width:100%" @click="login" :loading="loading">登 录</el-button>
        </el-form-item>
      </el-form>
      <div style="text-align:center;font-size:13px;color:var(--text-secondary);">
        <a href="javascript:void(0)" @click="$router.push('/register')" style="color:var(--el-color-primary);">注册账号</a>
        <span style="margin:0 8px;">|</span>
        <a href="javascript:void(0)" @click="$router.push('/forgot')" style="color:var(--el-color-primary);">忘记密码</a>
      </div>
    </div>`,
  data() { return { form:{username:'',password:'',captcha:''}, loading:false, captchaUrl:'/api/captcha?'+Date.now() }; },
  methods: {
    refreshCaptcha() { this.captchaUrl='/api/captcha?'+Date.now(); },
    async login() {
      if(!this.form.username||!this.form.password){ ElMessage.warning('请填写用户名和密码');return; }
      this.loading=true;
      try {
        const r=await api.post('/api/auth/login', this.form);
        if(r.data&&r.data.ok){ userState.username=r.data.username;userState.permission=r.data.permission;userState.isLoggedIn=true;userState.avatarUrl=r.data.avatar||'';this.$router.push('/dashboard'); }
        else { ElMessage.error(r.data?.error||'登录失败');this.refreshCaptcha(); }
      } catch(e){ ElMessage.error(e.response?.data?.error||e.response?.data||'登录失败，请检查网络');this.refreshCaptcha(); }
      finally{ this.loading=false; }
    }
  }
};

// --- Register Page ---
const RegisterPage = {
  template: `
    <div class="login-card">
      <h2>📝 注册</h2>
      <el-form :model="form" label-position="top">
        <el-form-item label="用户名"><el-input v-model="form.username" placeholder="请输入用户名" size="large"/></el-form-item>
        <el-form-item label="密码"><el-input v-model="form.password" type="password" placeholder="至少8位，含字母和数字" show-password size="large"/></el-form-item>
        <el-form-item label="确认密码"><el-input v-model="form.confirm" type="password" placeholder="再次输入密码" show-password size="large"/></el-form-item>
        <el-form-item label="管理员密码（选填）"><el-input v-model="form.admin_pwd" type="password" placeholder="如需管理员权限请输入" show-password size="large"/></el-form-item>
        <el-form-item label="验证码">
          <div style="display:flex;gap:12px;align-items:center;">
            <el-input v-model="form.captcha" placeholder="验证码" size="large" style="flex:1"/>
            <img :src="captchaUrl" @click="refreshCaptcha" style="height:40px;cursor:pointer;border-radius:4px;border:1px solid var(--el-border-color);"/>
          </div>
        </el-form-item>
        <el-button type="primary" size="large" style="width:100%" @click="register" :loading="loading">注 册</el-button>
      </el-form>
      <div style="text-align:center;margin-top:16px;font-size:13px;">
        <a href="javascript:void(0)" @click="$router.push('/')" style="color:var(--el-color-primary);">已有账号？去登录</a>
      </div>
    </div>`,
  data() { return { form:{username:'',password:'',confirm:'',admin_pwd:'',captcha:''}, loading:false, captchaUrl:'/api/captcha?'+Date.now() }; },
  methods: {
    refreshCaptcha() { this.captchaUrl='/api/captcha?'+Date.now(); },
    async register() {
      const f=this.form;
      if(!f.username||!f.password||!f.confirm){ ElMessage.warning('请填写所有必填字段');return; }
      if(f.password!==f.confirm){ ElMessage.error('两次密码不一致');return; }
      if(f.password.length<8){ ElMessage.error('密码长度不能少于8位');return; }
      if(!/[A-Za-z]/.test(f.password)){ ElMessage.error('密码必须包含至少一个字母');return; }
      if(!/[0-9]/.test(f.password)){ ElMessage.error('密码必须包含至少一个数字');return; }
      this.loading=true;
      try {
        const r=await api.post('/api/auth/register', f);
        ElMessage.success(r.data?.message||'注册成功！请登录');
        this.$router.push('/');
      } catch(e){ ElMessage.error(e.response?.data?.error||'注册失败');this.refreshCaptcha(); }
      finally{ this.loading=false; }
    }
  }
};

const ChatPage = {
  template: `

        <el-radio-group v-model="chatMode" size="small">

          [[ chatMode==='ai' ? '👋 你好！我是AI助手，有什么可以帮助你的？' : '暂无消息，开始聊天吧！' ]]
        </div>
        <div v-for="msg in messages" :key="msg.id" :class="['chat-msg', msg.mine ? 'mine' : (msg.role==='assistant'?'bot':'other')]">
          <div v-if="!msg.mine&&msg.role!=='assistant'" class="meta" style="text-align:left;">[[ msg.username||msg.sender ]]</div>

        </div>
        <div v-if="aiLoading" class="chat-msg bot"><div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div></div>
      </div>
      <div class="chat-input-area">
        <el-input v-model="inputText" placeholder="输入消息..." @keyup.enter="send" :disabled="aiLoading" size="large"/>
        <el-button type="primary" @click="send" :loading="aiLoading" size="large">发送</el-button>
        <el-button v-if="chatMode==='ai'" @click="clearAiChat" size="large">清空</el-button>
      </div>
      <!-- AI Settings Dialog -->
      <el-dialog v-model="showAiSettings" title="AI 设置" width="500px">
        <el-form label-width="100px">
          <el-form-item label="API地址"><el-input v-model="aiConfig.url" placeholder="https://api.openai.com/v1"/></el-form-item>
          <el-form-item label="API Key"><el-input v-model="aiConfig.key" type="password" show-password placeholder="sk-..."/></el-form-item>
          <el-form-item label="模型"><el-input v-model="aiConfig.model" placeholder="gpt-3.5-turbo"/></el-form-item>
        </el-form>
        <template #footer><el-button @click="showAiSettings=false">取消</el-button><el-button type="primary" @click="saveAiConfig">保存</el-button></template>
      </el-dialog>
    </div>`,
  data() {
    return {
      chatMode:'chat', inputText:'', messages:[], aiLoading:false,
      showAiSettings:false, aiConfig:{url:'',key:'',model:'gpt-3.5-turbo'},
      pollTimer:null,
    };
  },
  methods: {
    formatTime(t) { if(!t)return''; const d=new Date(t); return d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}); },
    async loadMessages() {
      if(this.chatMode==='chat') {
        try { const r=await api.get('/api/chat/messages'); this.messages=(r.data||[]).map(m=>({...m,mine:m.sender===userState.username})); this.scrollBottom(); } catch(e){}
      }
    },
    async send() {
      if(!this.inputText.trim())return;
      const text=this.inputText; this.inputText='';
      if(this.chatMode==='chat') {
        try { await api.post('/api/chat/send',{message:text}); this.loadMessages(); } catch(e){ ElMessage.error('发送失败'); }
      } else {
        this.messages.push({id:Date.now(),role:'user',content:text,mine:true,created_at:new Date().toISOString()});
        this.aiLoading=true; this.scrollBottom();
        try {
          const r=await api.post('/api/chat/ai/ask',{message:text});
          this.messages.push({id:Date.now()+1,role:'assistant',content:r.data.reply||r.data.content||'...',mine:false,created_at:new Date().toISOString()});
        } catch(e){ this.messages.push({id:Date.now()+1,role:'assistant',content:'抱歉，AI服务暂时不可用',mine:false,created_at:new Date().toISOString()}); }
        finally{ this.aiLoading=false; this.scrollBottom(); }
      }
    },
    async clearAiChat() {
      try { await api.post('/api/chat/ai/clear'); this.messages=[]; ElMessage.success('已清空'); } catch(e){}
    },
    async loadAiConfig() {
      try { const r=await api.get('/api/chat/ai/config'); if(r.data){ this.aiConfig=r.data; } } catch(e){}
    },
    async saveAiConfig() {
      try { await api.post('/api/chat/ai/config',this.aiConfig); ElMessage.success('保存成功'); this.showAiSettings=false; } catch(e){ ElMessage.error('保存失败'); }
    },
    scrollBottom() { nextTick(()=>{ const el=this.$refs.msgBox; if(el) el.scrollTop=el.scrollHeight; }); }
  },
  watch: {
    chatMode(v) {
      if(v==='chat') this.loadMessages();
      else { this.loadAiConfig(); this.messages=[]; }
    }
  },
  mounted() {
    this.loadMessages();
    this.pollTimer=setInterval(()=>{ if(this.chatMode==='chat') this.loadMessages(); },3000);
  },
  beforeUnmount() { if(this.pollTimer) clearInterval(this.pollTimer); }
};

    petEmoji() { const s=this.pet?.stage||1; return s===1?'🐣':s===2?'🐥':'🐔'; },

    async loadDiary() { try { this.diary=(await api.get('/api/pet/diary')).data||[]; } catch(e){} },
    async equipItem(item) { try { await api.post('/api/pet/accessory/equip',{item_id:item.id}); this.loadInventory(); } catch(e){} },
    async loadShopItems() { try { this.shopItems=(await api.get('/api/pet/shop')).data||[]; } catch(e){} },

  async mounted() { await this.loadPet(); }
};

    isAdmin() { return userState.permission === 'administrator'; },
    permLabel() { return userState.permission==='administrator'?'管理员':userState.permission==='vip'?'VIP':'用户'; },
    permTagType() { return userState.permission==='administrator'?'danger':userState.permission==='vip'?'warning':'info'; },
    avatarUrl() { return userState.avatarUrl || ''; },
    currentRoute() { return this.$route.path; },
  },
  methods: {
    toggleTheme() {
      this.isDark = !this.isDark;
      document.documentElement.classList.toggle('dark', this.isDark);
      localStorage.setItem('theme', this.isDark ? 'dark' : 'light');
    },
    async switchLang(lang) {
      try { await api.post('/api/lang/switch', { lang }); location.reload(); } catch(e) {}
    },
    handleUserCommand(cmd) {
      if (cmd === 'logout') {
        ElMessageBox.confirm('确定要退出登录吗？', '确认', { type:'warning' }).then(async () => {
          try { await api.post('/api/auth/logout'); userState.isLoggedIn=false; userState.username=''; this.$router.push('/'); } catch(e) { userState.isLoggedIn=false; this.$router.push('/'); }
        }).catch(() => {});
      } else if (cmd === 'profile') { this.$router.push('/profile'); }
      else if (cmd === 'admin') { this.$router.push('/admin'); }
    },
    handleNotifClick(n) {
      if (n.link) this.$router.push(n.link);
    },
    async fetchNotifications() {
      try {
        const r = await api.get('/api/notifications');
        const d = r.data;
        const items = [];
        if (d.chat_unread) items.push({id:'chat',icon:'💬',text:`${d.chat_unread} 条未读消息`,link:'/chat'});
        if (d.admin_requests) items.push({id:'admin',icon:'📋',text:`${d.admin_requests} 个管理员申请`,link:'/admin'});
        if (d.pending_photos) items.push({id:'photo',icon:'🖼️',text:`${d.pending_photos} 张待审核照片`,link:'/album'});
        if (d.forum_unread) items.push({id:'forum',icon:'💬',text:`${d.forum_unread} 条论坛通知`,link:'/forum'});
        this.notifications = items;
        this.unreadCount = items.length;
      } catch(e) {}
    },
    async checkAuth() {
      try {
        const r = await api.get('/api/auth/status');
        if (r.data && r.data.logged_in) {
          userState.username = r.data.username || '';
          userState.permission = r.data.permission || 'guest';
          userState.isLoggedIn = true;
          userState.avatarUrl = r.data.avatar || '';
        }
      } catch(e) {}
  },
  watch: {
    '$route'() { this.sidebarOpen = false; }
  },
  async mounted() {
    // Theme
    const saved = localStorage.getItem('theme');
    this.isDark = saved === 'dark';
    if (this.isDark) document.documentElement.classList.add('dark');
    // Auth
    await this.checkAuth();
    if (this.isLoggedIn) {
      this.fetchNotifications();
      setInterval(() => this.fetchNotifications(), 30000);
    }
  }
};

// Create app
const app = createApp(App);
app.config.compilerOptions.delimiters = ['[[', ']]'];
app.use(router);
app.use(ElementPlus, { locale: ElementPlus.localeZhCn || {} });

// Register Element Plus icons
for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
  app.component(key, component);
}

app.mount('#app');
</script>
</body>
</html>
