{% extends "base.html" %}
{% block title %}校友故事 - 多合一工具箱{% endblock %}
{% block content %}
<style nonce="{{ csp_nonce }}">
.as-container { max-width: 1000px; margin: 0 auto; }
.as-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
.as-tabs { display: flex; gap: .25rem; margin-bottom: 1.5rem; border-bottom: 2px solid var(--bs-border-color); padding-bottom: 0; }
.as-tab {
    padding: .6rem 1.2rem; border: none; background: none; cursor: pointer;
    font-weight: 600; font-size: .9rem; color: var(--bs-secondary-color);
    border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all .2s;
}
.as-tab:hover { color: var(--bs-body-color); }
.as-tab.active { color: #6366f1; border-bottom-color: #6366f1; }
.as-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.25rem; }
.as-card {
    border-radius: 16px; border: 1.5px solid var(--bs-border-color);
    background: var(--bs-body-bg); overflow: hidden; cursor: pointer;
    transition: all .2s;
}
.as-card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,.1); border-color: #6366f1; }
.as-card-cover {
    height: 160px; background: linear-gradient(135deg, #6366f1, #8b5cf6);
    display: flex; align-items: center; justify-content: center;
    font-size: 2.5rem; color: #fff;
}
.as-card-cover img { width: 100%; height: 100%; object-fit: cover; }
.as-card-body { padding: 1.25rem; }
.as-card-title { font-weight: 700; font-size: 1.1rem; margin-bottom: .5rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.as-card-excerpt { font-size: .85rem; color: var(--bs-secondary-color); margin-bottom: .75rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.as-card-meta { display: flex; gap: 1rem; font-size: .8rem; color: var(--bs-secondary-color); }
.as-card-status { display: inline-block; padding: .15rem .5rem; border-radius: 8px; font-size: .7rem; font-weight: 600; }
.as-status-pending { background: rgba(245,158,11,.15); color: #d97706; }
.as-status-approved { background: rgba(16,185,129,.15); color: #059669; }
.as-status-rejected { background: rgba(239,68,68,.15); color: #dc2626; }
/* Detail modal */
.as-modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,.5); z-index: 1050; display: none;
    align-items: center; justify-content: center; padding: 1rem;
}
.as-modal-overlay.show { display: flex; }
.as-modal {
    background: var(--bs-body-bg); border-radius: 20px; max-width: 800px;
    width: 100%; max-height: 85vh; overflow-y: auto; padding: 2rem;
    position: relative;
}
.as-modal-close {
    position: absolute; top: 1rem; right: 1rem; width: 36px; height: 36px;
    border-radius: 50%; border: none; background: var(--bs-border-color);
    font-size: 1.2rem; cursor: pointer; display: flex; align-items: center;
    justify-content: center; z-index: 1;
}
.as-modal-title { font-size: 1.5rem; font-weight: 700; margin-bottom: .5rem; padding-right: 3rem; }
.as-modal-meta { display: flex; gap: 1rem; font-size: .85rem; color: var(--bs-secondary-color); margin-bottom: 1.5rem; flex-wrap: wrap; }
.as-modal-content { line-height: 1.9; font-size: 1rem; margin-bottom: 2rem; white-space: pre-wrap; }
.as-modal-actions { display: flex; gap: .75rem; border-top: 1px solid var(--bs-border-color); padding-top: 1rem; }
.as-comments { margin-top: 1.5rem; }
.as-comment-item { padding: .75rem 0; border-bottom: 1px solid var(--bs-border-color); }
.as-comment-user { font-weight: 600; margin-bottom: .25rem; }
.as-comment-content { color: var(--bs-body-color); }
.as-comment-form { display: flex; gap: .5rem; margin-top: 1rem; }
.as-comment-input { flex: 1; padding: .6rem .75rem; border-radius: 10px; border: 1.5px solid var(--bs-border-color); background: var(--bs-body-bg); color: var(--bs-body-color); }
.as-comment-input:focus { border-color: #6366f1; outline: none; }
/* Write page */
.as-write { max-width: 700px; margin: 0 auto; }
.as-write input, .as-write textarea {
    width: 100%; padding: .75rem 1rem; border-radius: 12px; border: 1.5px solid var(--bs-border-color);
    background: var(--bs-body-bg); color: var(--bs-body-color); margin-bottom: 1rem; font-size: .95rem;
}
.as-write textarea { min-height: 300px; resize: vertical; line-height: 1.7; }
.as-write input:focus, .as-write textarea:focus { border-color: #6366f1; outline: none; }
.as-pagination { display: flex; gap: .5rem; justify-content: center; margin-top: 2rem; }
.as-page-btn {
    padding: .4rem .9rem; border: 1.5px solid var(--bs-border-color); border-radius: 8px;
    background: var(--bs-body-bg); cursor: pointer; font-size: .85rem;
}
.as-page-btn.active { background: #6366f1; color: #fff; border-color: #6366f1; }
.as-page-btn:disabled { opacity: .4; cursor: not-allowed; }
</style>

<div class="as-container" id="asListView">
    <div class="as-header">
        <h2 class="mb-0">📖 校友故事</h2>
        <button class="btn btn-primary btn-sm ms-auto" data-csp-click="asShowWrite" style="border-radius:20px;">✏️ 写故事</button>
    </div>
    <div class="as-tabs">
        <button class="as-tab active" data-csp-click="asSwitchTab" data-csp-args='["approved"]'>✅ 精选故事</button>
        <button class="as-tab" data-csp-click="asSwitchTab" data-csp-args='["my"]'>📝 我的故事</button>
    </div>
    <div class="as-grid" id="asGrid"></div>
    <div class="as-pagination" id="asPagination"></div>
</div>

<!-- Write page -->
<div id="asWriteView" style="display:none;">
    <div class="as-write">
        <div class="as-header"><button class="btn btn-outline-secondary btn-sm" data-csp-click="asShowList" style="border-radius:20px;">← 返回</button></div>
        <h3 class="mb-3">✏️ 写故事</h3>
        <input type="text" id="asTitle" placeholder="故事标题..." maxlength="200">
        <textarea id="asContent" placeholder="写下你的校友回忆..."></textarea>
        <button class="btn btn-primary" data-csp-click="asSubmit" style="border-radius:25px;padding:.6rem 2rem;">📨 提交审核</button>
        <p class="text-muted mt-2" style="font-size:.8rem;">提交后将由管理员审核后发布</p>
    </div>
</div>

<!-- Detail modal -->
<div class="as-modal-overlay" id="asModalOverlay">
    <div class="as-modal" id="asModal">
        <button class="as-modal-close" data-csp-click="asCloseModal">✕</button>
        <div class="as-modal-title" id="asModalTitle"></div>
        <div class="as-modal-meta">
            <span id="asModalAuthor"></span>
            <span id="asModalDate"></span>
            <span id="asModalViews"></span>
        </div>
        <div class="as-modal-content" id="asModalContent"></div>
        <div class="as-modal-actions">
            <button class="btn btn-sm btn-outline-danger" data-csp-click="asLike" id="asLikeBtn">🤍 <span id="asLikeCount">0</span></button>
            <span style="margin-left:auto;"><span id="asModalStatus"></span></span>
        </div>
        <div class="as-comments" id="asComments"></div>
        <div class="as-comment-form">
            <input class="as-comment-input" id="asCommentInput" placeholder="写下你的评论...">
            <button class="btn btn-primary btn-sm" data-csp-click="asComment">发送</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script nonce="{{ csp_nonce }}">
var currentTab = 'approved';
var currentPage = 1;
var totalPages = 1;
var currentStoryId = null;

function asSwitchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.as-tab').forEach(function(t) { t.classList.remove('active'); });
    var target = document.querySelector('[data-csp-args*="\\"' + tab + '\\""]');
    if (target) target.classList.add('active');
    currentPage = 1;
    loadStories();
}

function loadStories() {
    var grid = document.getElementById('asGrid');
    grid.innerHTML = '<div class="text-center p-4 text-muted">加载中...</div>';
    fetch('/api/alumni_stories?status=' + currentTab + '&page=' + currentPage)
    .then(function(r) { return r.json(); })
    .then(function(d) {
        totalPages = d.total_pages;
        grid.innerHTML = '';
        if (d.stories.length === 0) {
            grid.innerHTML = '<div class="text-center p-5 text-muted" style="grid-column:1/-1;">📭 还没有故事</div>';
        }
        d.stories.forEach(function(s) {
            var coverHtml = s.cover_image
                ? '<div class="as-card-cover"><img src="' + s.cover_image + '" alt="cover"></div>'
                : '<div class="as-card-cover">📖</div>';
            var statusBadge = '';
            if (s.status === 'pending') statusBadge = '<span class="as-card-status as-status-pending">审核中</span>';
            else if (s.status === 'rejected') statusBadge = '<span class="as-card-status as-status-rejected">已退回</span>';
            grid.insertAdjacentHTML('beforeend',
                '<div class="as-card" data-csp-click="asOpenDetail" data-csp-args=\'[' + s.id + ']\'>' +
                coverHtml +
                '<div class="as-card-body">' +
                    statusBadge +
                    '<div class="as-card-title">' + s.title + '</div>' +
                    '<div class="as-card-excerpt">' + s.excerpt + '</div>' +
                    '<div class="as-card-meta">' +
                        '<span>👤 ' + s.username + '</span>' +
                        '<span>👁 ' + s.view_count + '</span>' +
                        '<span>❤️ ' + s.like_count + '</span>' +
                        '<span>💬 ' + s.comment_count + '</span>' +
                    '</div>' +
                '</div></div>'
            );
        });
        renderPagination();
    });
}

function renderPagination() {
    var pag = document.getElementById('asPagination');
    pag.innerHTML = '';
    if (totalPages <= 1) return;
    pag.insertAdjacentHTML('beforeend', '<button class="as-page-btn" data-csp-click="asGoPage" data-csp-args=\'[' + (currentPage-1) + ']\' ' + (currentPage===1?'disabled':'') + '>‹</button>');
    for (var i = 1; i <= totalPages; i++) {
        pag.insertAdjacentHTML('beforeend', '<button class="as-page-btn' + (i===currentPage?' active':'') + '" data-csp-click="asGoPage" data-csp-args=\'[' + i + ']\'>' + i + '</button>');
    }
    pag.insertAdjacentHTML('beforeend', '<button class="as-page-btn" data-csp-click="asGoPage" data-csp-args=\'[' + (currentPage+1) + ']\' ' + (currentPage===totalPages?'disabled':'') + '>›</button>');
}

function asGoPage(p) {
    if (p < 1 || p > totalPages) return;
    currentPage = p;
    loadStories();
}

function asShowWrite() {
    document.getElementById('asListView').style.display = 'none';
    document.getElementById('asWriteView').style.display = 'block';
}

function asShowList() {
    document.getElementById('asWriteView').style.display = 'none';
    document.getElementById('asListView').style.display = 'block';
    loadStories();
}

function asSubmit() {
    var title = document.getElementById('asTitle').value.trim();
    var content = document.getElementById('asContent').value.trim();
    if (!title || !content) { alert('请填写标题和内容'); return; }
    fetch('/api/alumni_stories', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: title, content: content })
    }).then(function(r) { return r.json(); })
    .then(function(d) {
        if (d.error) { alert(d.error); return; }
        document.getElementById('asTitle').value = '';
        document.getElementById('asContent').value = '';
        asShowList();
    });
}

function asOpenDetail(sid) {
    currentStoryId = sid;
    fetch('/api/alumni_stories/' + sid)
    .then(function(r) { return r.json(); })
    .then(function(d) {
        if (d.error) { alert(d.error); return; }
        var s = d.story;
        document.getElementById('asModalTitle').textContent = s.title;
        document.getElementById('asModalAuthor').textContent = '👤 ' + s.username;
        document.getElementById('asModalDate').textContent = '📅 ' + s.created_at.split(' ')[0];
        document.getElementById('asModalViews').textContent = '👁 ' + s.view_count;
        document.getElementById('asModalContent').textContent = s.content;
        document.getElementById('asLikeCount').textContent = s.like_count;
        document.getElementById('asLikeBtn').innerHTML = (s.liked ? '❤️' : '🤍') + ' <span id="asLikeCount">' + s.like_count + '</span>';
        document.getElementById('asModalStatus').textContent = s.status === 'pending' ? '⏳ 审核中' : (s.status === 'rejected' ? '❌ 已退回' : '');
        // Comments
        var commentsHtml = '<h5 class="mt-3 mb-2">💬 评论 (' + s.comments.length + ')</h5>';
        s.comments.forEach(function(c) {
            commentsHtml += '<div class="as-comment-item"><div class="as-comment-user">' + c.username + '</div><div class="as-comment-content">' + c.content + '</div></div>';
        });
        document.getElementById('asComments').innerHTML = commentsHtml;
        document.getElementById('asModalOverlay').classList.add('show');
    });
}

function asCloseModal() {
    document.getElementById('asModalOverlay').classList.remove('show');
    currentStoryId = null;
    loadStories();
}

function asLike() {
    if (!currentStoryId) return;
    fetch('/api/alumni_stories/' + currentStoryId + '/like', { method: 'POST' })
    .then(function(r) { return r.json(); })
    .then(function(d) {
        document.getElementById('asLikeCount').textContent = d.like_count;
        document.getElementById('asLikeBtn').innerHTML = (d.liked ? '❤️' : '🤍') + ' <span id="asLikeCount">' + d.like_count + '</span>';
    });
}

function asComment() {
    if (!currentStoryId) return;
    var input = document.getElementById('asCommentInput');
    var content = input.value.trim();
    if (!content) return;
    fetch('/api/alumni_stories/' + currentStoryId + '/comments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: content })
    }).then(function(r) { return r.json(); })
    .then(function(d) {
        if (d.error) { alert(d.error); return; }
        input.value = '';
        asOpenDetail(currentStoryId);
    });
}

loadStories();
</script>
{% endblock %}
