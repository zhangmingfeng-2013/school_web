{% extends "base.html" %}
{% block title %}SRC 管理后台 - 安全响应中心{% endblock %}
{% block content %}
<style nonce="{{ csp_nonce }}">
    .src-container { max-width: 1200px; margin: 0 auto; }
    .src-header {
        background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
        border-radius: 16px; padding: 2rem; margin-bottom: 2rem;
        color: #fff; position: relative; overflow: hidden;
    }
    .src-header::before {
        content: ''; position: absolute; top: -50%; left: -50%;
        width: 200%; height: 200%;
        background: radial-gradient(circle, rgba(220,53,69,.08) 0%, transparent 70%);
        animation: srcPulse 8s ease-in-out infinite;
    }
    @keyframes srcPulse {
        0%,100% { transform: translate(0,0); }
        50% { transform: translate(20px,-20px); }
    }
    .src-header h1 { position: relative; font-size: 1.8rem; font-weight: 700; }
    .src-header .nav-links { position: relative; margin-top: 1rem; }
    .src-header .nav-links a {
        color: rgba(255,255,255,.7); text-decoration: none;
        padding: .4rem 1rem; border-radius: 20px;
        border: 1px solid rgba(255,255,255,.15); font-size: .85rem;
        margin-right: .5rem; transition: all .2s;
    }
    .src-header .nav-links a:hover, .src-header .nav-links a.active {
        background: rgba(255,255,255,.1); color: #fff; border-color: rgba(255,255,255,.3);
    }
    .stat-box {
        background: var(--bs-body-bg); border-radius: 12px;
        padding: 1.2rem; text-align: center;
        border: 1px solid var(--border-light);
    }
    .stat-box .num { font-size: 2rem; font-weight: 700; }
    .stat-box .lbl { font-size: .8rem; color: #888; margin-top: .3rem; }
    .report-row {
        border: 1px solid var(--border-light);
        border-radius: 10px; padding: .8rem 1rem;
        margin-bottom: .5rem; cursor: pointer;
        transition: all .15s; background: var(--bs-body-bg);
    }
    .report-row:hover { background: var(--bg-card-hover); }
    .report-row .time { font-size: .75rem; color: #888; }
    .badge-status { font-size: .7rem; }
    .severity-dot {
        display: inline-block; width: 10px; height: 10px;
        border-radius: 50%; margin-right: 4px;
    }
    .sev-critical { color: #dc3545; }
    .sev-high { color: #fd7e14; }
    .sev-medium { color: #ffc107; }
    .sev-low { color: #198754; }
    .sev-info { color: #6c757d; }
    .admin-detail-modal .modal-body { max-height: 65vh; overflow-y: auto; }
    .admin-detail-modal .detail-section { margin-bottom: 1.2rem; }
    .admin-detail-modal .detail-label {
        font-size: .7rem; color: #888; text-transform: uppercase;
        letter-spacing: .5px; margin-bottom: .2rem;
    }
    .admin-detail-modal .detail-value { font-size: .9rem; line-height: 1.6; }
    .admin-detail-modal pre {
        background: var(--code-bg); color: var(--code-color);
        padding: .8rem; border-radius: 8px; font-size: .84rem;
        white-space: pre-wrap; word-break: break-word;
    }
</style>

<div class="src-container">
    <div class="src-header">
        <div style="position:relative;">
            <h1>⚙️ SRC 管理后台</h1>
            <p style="opacity:.7;">漏洞报告审核与管理 · 仅管理员可访问</p>
            <div class="nav-links">
                <a href="/src">📝 提交漏洞</a>
                <a href="/src/my">📋 我的报告</a>
                <a href="/src/admin" class="active">⚙️ 管理后台</a>
            </div>
        </div>
    </div>

    <!-- 统计卡片 -->
    <div class="row g-3 mb-4" id="statsRow">
        <div class="col-6 col-md-3"><div class="stat-box"><div class="num" id="statTotal">-</div><div class="lbl">总报告数</div></div></div>
        <div class="col-6 col-md-3"><div class="stat-box"><div class="num text-warning" id="statPending">-</div><div class="lbl">待审核</div></div></div>
        <div class="col-6 col-md-3"><div class="stat-box"><div class="num text-success" id="statResolved">-</div><div class="lbl">已修复</div></div></div>
        <div class="col-6 col-md-3"><div class="stat-box"><div class="num text-danger" id="statCritical">-</div><div class="lbl">严重漏洞</div></div></div>
    </div>

    <!-- 筛选 + 搜索 -->
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <div class="d-flex gap-2 flex-wrap" id="statusFilters">
            <button class="btn btn-sm btn-outline-secondary active filter-btn" data-status="">全部</button>
            <button class="btn btn-sm btn-outline-warning filter-btn" data-status="pending">待审核</button>
            <button class="btn btn-sm btn-outline-primary filter-btn" data-status="reviewing">审核中</button>
            <button class="btn btn-sm btn-outline-success filter-btn" data-status="accepted">已接受</button>
            <button class="btn btn-sm btn-outline-info filter-btn" data-status="resolved">已修复</button>
            <button class="btn btn-sm btn-outline-secondary filter-btn" data-status="closed">已关闭</button>
        </div>
        <button class="btn btn-sm btn-outline-secondary" id="refreshBtn">🔄 刷新</button>
    </div>

    <!-- 报告列表 -->
    <div id="reportsList">
        <div class="text-center py-5"><div class="spinner-border text-primary"></div><p class="mt-2">加载中...</p></div>
    </div>
</div>

<!-- 审核弹窗 -->
<div class="modal fade admin-detail-modal" id="adminDetailModal" tabindex="-1">
    <div class="modal-dialog modal-lg"><div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title" id="detailTitle">漏洞详情</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="detailBody"></div>
        <div class="modal-footer" id="detailFooter"></div>
    </div></div>
</div>
{% endblock %}

{% block scripts %}
<script nonce="{{ csp_nonce }}">
const statusLabels = {{ status_labels|tojson }};
const severityLabels = {{ severity_labels|tojson }};
let currentFilter = '';
let currentReportId = null;

// 加载统计
async function loadStats() {
    try {
        const resp = await fetch('/api/src/stats', { credentials: 'include' });
        const data = await resp.json();
        document.getElementById('statTotal').textContent = data.total || 0;
        document.getElementById('statPending').textContent = (data.by_status && data.by_status.pending) || 0;
        const resolved = ((data.by_status && data.by_status.resolved) || 0);
        document.getElementById('statResolved').textContent = resolved;
        document.getElementById('statCritical').textContent = (data.by_severity && data.by_severity.critical) || 0;
    } catch(e) {}
}

// 加载报告列表
async function loadReports(status) {
    currentFilter = status || '';
    const url = status ? `/api/src/reports?status=${status}` : '/api/src/reports';
    try {
        const resp = await fetch(url, { credentials: 'include' });
        const data = await resp.json();
        if (data.error) {
            document.getElementById('reportsList').innerHTML =
                `<div class="text-center py-4 text-danger">${data.error}</div>`;
            return;
        }
        if (!data.reports || data.reports.length === 0) {
            document.getElementById('reportsList').innerHTML =
                `<div class="text-center py-5 text-muted">📭 暂无报告</div>`;
            return;
        }
        renderReports(data.reports);
    } catch(e) {
        document.getElementById('reportsList').innerHTML =
            `<div class="text-center py-4 text-danger">加载失败</div>`;
    }
}

function getStatusBadge(status) {
    const map = {
        'pending': 'badge bg-warning text-dark',
        'reviewing': 'badge bg-primary',
        'accepted': 'badge bg-success',
        'resolved': 'badge bg-info text-dark',
        'closed': 'badge bg-secondary',
        'duplicate': 'badge bg-light text-dark',
    };
    return map[status] || 'badge bg-light text-dark';
}

function renderReports(reports) {
    const html = reports.map(r => {
        const sevClass = 'sev-' + r.severity;
        const sevLabel = severityLabels[r.severity] || r.severity;
        const stLabel = statusLabels[r.status] || r.status;
        const stBadge = getStatusBadge(r.status);
        return `<div class="report-row" data-csp-click="viewReport" data-csp-args='[${r.id}]'>
            <div class="d-flex justify-content-between align-items-start">
                <div style="flex:1;min-width:0;">
                    <div class="d-flex align-items-center gap-2 mb-1">
                        <span class="badge bg-light text-dark">#${r.id}</span>
                        <span class="${sevClass}" style="font-weight:700;font-size:.85rem;">${sevLabel}</span>
                        <span class="${stBadge} badge-status">${stLabel}</span>
                        <span class="badge bg-light text-dark" style="font-size:.7rem;">${r.vuln_type}</span>
                    </div>
                    <h6 class="mb-1" style="font-size:.9rem;font-weight:600;">${escapeHtml(r.title)}</h6>
                    <div class="d-flex gap-2 time">
                        <span>👤 ${escapeHtml(r.username)}</span>
                        <span>🕐 ${r.created_at.slice(0,16)}</span>
                    </div>
                </div>
                <span class="text-muted ms-3 mt-2">→</span>
            </div>
        </div>`;
    }).join('');
    document.getElementById('reportsList').innerHTML = html;
}

async function viewReport(id) {
    currentReportId = id;
    try {
        const resp = await fetch(`/api/src/report/${id}`, { credentials: 'include' });
        const data = await resp.json();
        if (data.error) { alert(data.error); return; }
        const r = data.report;
        const sevLabel = severityLabels[r.severity] || r.severity;
        const stLabel = statusLabels[r.status] || r.status;
        const stBadge = getStatusBadge(r.status);

        document.getElementById('detailTitle').textContent = `#${r.id} - ${r.title}`;

        let bodyHtml = `
            <div class="d-flex gap-2 mb-3 flex-wrap">
                <span class="${stBadge}">${stLabel}</span>
                <span class="badge bg-light text-dark">${sevLabel}</span>
                <span class="badge bg-light text-dark">${r.vuln_type}</span>
            </div>
            <div class="row g-2 mb-3">
                <div class="col-4"><span class="detail-label">提交者</span><div class="detail-value">${escapeHtml(r.username)}</div></div>
                <div class="col-4"><span class="detail-label">提交时间</span><div class="detail-value">${r.created_at ? r.created_at.slice(0,19) : '-'}</div></div>
                <div class="col-4"><span class="detail-label">更新时间</span><div class="detail-value">${r.updated_at ? r.updated_at.slice(0,19) : '-'}</div></div>
                ${r.affected_url ? `<div class="col-12"><span class="detail-label">受影响 URL</span><div class="detail-value"><code>${escapeHtml(r.affected_url)}</code></div></div>` : ''}
            </div>
            <div class="detail-section">
                <span class="detail-label">漏洞描述</span>
                <div class="detail-value"><pre>${escapeHtml(r.description || '-')}</pre></div>
            </div>
            ${r.steps_to_reproduce ? `<div class="detail-section"><span class="detail-label">复现步骤</span><div class="detail-value"><pre>${escapeHtml(r.steps_to_reproduce)}</pre></div></div>` : ''}
            ${r.impact ? `<div class="detail-section"><span class="detail-label">影响范围</span><div class="detail-value"><pre>${escapeHtml(r.impact)}</pre></div></div>` : ''}
            ${r.attachment ? `<div class="detail-section"><span class="detail-label">附件</span><div class="detail-value"><a href="${escapeHtml(r.attachment)}" target="_blank" rel="noopener">🔗 查看附件</a></div></div>` : ''}
            ${r.wechat_contact ? `<div class="detail-section"><span class="detail-label">💰 微信联系方式</span><div class="detail-value" style="font-weight:600; color:#07c160;">${escapeHtml(r.wechat_contact)}</div></div>` : '<div class="detail-section"><span class="detail-label">💰 微信联系方式</span><div class="detail-value text-muted">未填写（无奖金联系方式）</div></div>'}
            <div class="detail-section">
                <span class="detail-label">管理员备注</span>
                <textarea class="form-control" id="adminNotes" rows="3" style="font-size:.85rem;"
                          placeholder="添加审核备注...">${escapeHtml(r.admin_notes || '')}</textarea>
            </div>
            ${r.reviewed_by ? `<div class="text-muted small">审核人: ${escapeHtml(r.reviewed_by)}</div>` : ''}
        `;

        document.getElementById('detailBody').innerHTML = bodyHtml;

        // 操作按钮
        const footerHtml = `
            <span class="text-muted small me-auto">更新状态:</span>
            <button class="btn btn-sm btn-outline-warning" data-csp-click="updateStatus" data-csp-args='["pending"]'>⏳ 待审核</button>
            <button class="btn btn-sm btn-outline-primary" data-csp-click="updateStatus" data-csp-args='["reviewing"]'>🔍 审核中</button>
            <button class="btn btn-sm btn-outline-success" data-csp-click="updateStatus" data-csp-args='["accepted"]'>✅ 已接受</button>
            <button class="btn btn-sm btn-outline-info" data-csp-click="updateStatus" data-csp-args='["resolved"]'>🔧 已修复</button>
            <button class="btn btn-sm btn-outline-secondary" data-csp-click="updateStatus" data-csp-args='["closed"]'>🚫 关闭</button>
            <button class="btn btn-sm btn-outline-dark" data-csp-click="updateStatus" data-csp-args='["duplicate"]'>📋 重复</button>
        `;
        document.getElementById('detailFooter').innerHTML = footerHtml;

        new bootstrap.Modal(document.getElementById('adminDetailModal')).show();
    } catch(e) { alert('加载失败: ' + e.message); }
}

async function updateStatus(status) {
    const notes = document.getElementById('adminNotes').value.trim();
    if (!confirm(`确定将报告状态更新为「${statusLabels[status]}」？`)) return;
    try {
        const resp = await fetch(`/api/src/report/${currentReportId}/update`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status, admin_notes: notes })
        });
        const data = await resp.json();
        if (data.ok) {
            alert('✅ 状态已更新');
            bootstrap.Modal.getInstance(document.getElementById('adminDetailModal')).hide();
            loadReports(currentFilter);
            loadStats();
        } else {
            alert('❌ ' + (data.error || '更新失败'));
        }
    } catch(e) { alert('操作失败: ' + e.message); }
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

// 注册到 window 供 CSP 事件调度器使用（async function 不会自动挂载到 window）
window.viewReport = viewReport;
window.updateStatus = updateStatus;

// 筛选
document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        loadReports(this.dataset.status);
    });
});

document.getElementById('refreshBtn').addEventListener('click', () => {
    loadReports(currentFilter);
    loadStats();
});

// 初始
loadStats();
loadReports();
</script>
{% endblock %}
