{% extends "base.html" %}
{% block title %}电子宠物 - 多合一工具箱{% endblock %}
{% block content %}
<style nonce="{{ csp_nonce }}">
.pet-wrap { max-width: 520px; margin: 0 auto; text-align: center; }

/* ====== Pet Display ====== */
.pet-display { position: relative; width: 160px; height: 160px; margin: 0 auto 1rem; display: flex; align-items: center; justify-content: center; font-size: 5rem; }
.pet-display .pet-emoji { display: inline-block; animation: petWobble 2s ease-in-out infinite; }
.pet-display.egg .pet-emoji { animation: eggRock 1.5s ease-in-out infinite; }

@keyframes petWobble {
    0%,100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-6px) rotate(-3deg); }
    75% { transform: translateY(-4px) rotate(3deg); }
}
@keyframes eggRock {
    0%,100% { transform: rotate(0deg); }
    25% { transform: rotate(-8deg); }
    75% { transform: rotate(8deg); }
}
.pet-name { font-size: 1.2rem; font-weight: 600; color: var(--text-body); margin-bottom: 0.25rem; }
.pet-level { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem; }

/* ====== Stat Bars ====== */
.stat-bars { margin-bottom: 1rem; }
.stat-row { display: flex; align-items: center; margin-bottom: 0.5rem; gap: 0.5rem; }
.stat-label { width: 58px; font-size: 0.85rem; color: var(--text-body); text-align: right; flex-shrink: 0; }
.stat-bar-outer { flex: 1; height: 18px; border-radius: 9px; background: var(--bs-tertiary-bg); overflow: hidden; position: relative; }
.stat-bar-inner { height: 100%; border-radius: 9px; transition: width 0.5s ease; }
.stat-bar-inner.hunger { background: linear-gradient(90deg, #ef4444, #f97316); }
.stat-bar-inner.happiness { background: linear-gradient(90deg, #f59e0b, #eab308); }
.stat-bar-inner.energy { background: linear-gradient(90deg, #06b6d4, #3b82f6); }
.stat-val { font-size: 0.75rem; color: var(--text-muted); width: 32px; text-align: left; flex-shrink: 0; }

/* ====== XP Bar ====== */
.xp-wrap { margin-bottom: 1.25rem; }
.xp-label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.25rem; }
.xp-bar-outer { height: 10px; border-radius: 5px; background: var(--bs-tertiary-bg); overflow: hidden; }
.xp-bar-inner { height: 100%; border-radius: 5px; background: linear-gradient(90deg, #a78bfa, #8b5cf6); transition: width 0.5s ease; }

/* ====== Action Buttons ====== */
.pet-actions { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; margin-bottom: 1.5rem; }
.pet-btn { width: 64px; height: 64px; border-radius: 50%; border: none; font-size: 1.5rem; cursor: pointer; transition: all .2s; display: flex; align-items: center; justify-content: center; background: var(--bs-tertiary-bg); }
.pet-btn:hover { transform: scale(1.1); box-shadow: 0 4px 12px rgba(0,0,0,.15); }
.pet-btn:active { transform: scale(0.95); }
.pet-btn.feed-btn { background: #fef3c7; }
.pet-btn.feed-btn:hover { background: #fde68a; }
.pet-btn.play-btn { background: #dbeafe; }
.pet-btn.play-btn:hover { background: #bfdbfe; }
.pet-btn.sleep-btn { background: #e0e7ff; }
.pet-btn.sleep-btn:hover { background: #c7d2fe; }
.pet-btn.disabled { opacity: 0.4; pointer-events: none; }

/* ====== Hatch Section ====== */
.hatch-section { margin-bottom: 1.5rem; }
.hatch-types { display: flex; gap: 0.75rem; justify-content: center; margin: 1rem 0; }
.hatch-type-card { border: 2px solid var(--border-light); border-radius: 12px; padding: 0.75rem 1rem; cursor: pointer; transition: all .2s; background: var(--bs-body-bg); text-align: center; }
.hatch-type-card:hover { border-color: #8b5cf6; background: rgba(139,92,246,.05); }
.hatch-type-card.selected { border-color: #8b5cf6; background: rgba(139,92,246,.1); }
.hatch-type-card .type-emoji { font-size: 2rem; display: block; }
.hatch-type-card .type-name { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.25rem; }
.hatch-btn { background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: #fff; border: none; border-radius: 24px; padding: 10px 32px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all .2s; }
.hatch-btn:hover { transform: scale(1.05); box-shadow: 0 4px 16px rgba(139,92,246,.4); }

/* ====== Rename Modal ====== */
.pet-rename-area { margin-bottom: 1rem; }
.pet-name-row { display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
.rename-icon { font-size: 0.8rem; color: var(--text-muted); cursor: pointer; opacity: 0.5; transition: opacity .2s; background: none; border: none; padding: 2px; }
.rename-icon:hover { opacity: 1; }
.rename-form { display: none; margin-top: 0.75rem; }
.rename-form.show { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
.rename-row { display: flex; gap: 0.5rem; align-items: center; }
.rename-input { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border-light); background: var(--bs-body-bg); color: var(--text-body); font-size: 0.9rem; width: 160px; }
.rename-type-row { display: flex; gap: 0.35rem; }
.rename-type-dot { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--border-light); cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; transition: all .15s; background: var(--bs-body-bg); }
.rename-type-dot:hover { border-color: #8b5cf6; }
.rename-type-dot.selected { border-color: #8b5cf6; background: rgba(139,92,246,.1); }
.rename-actions { display: flex; gap: 0.5rem; }
.rename-save-btn { background: #8b5cf6; color: #fff; border: none; border-radius: 8px; padding: 6px 18px; font-size: 0.85rem; cursor: pointer; }
.rename-cancel-btn { background: var(--bs-tertiary-bg); color: var(--text-body); border: none; border-radius: 8px; padding: 6px 18px; font-size: 0.85rem; cursor: pointer; }

/* ====== Log Section ====== */
.pet-log { max-width: 400px; margin: 0 auto; text-align: left; }
.pet-log h6 { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem; text-align: center; }
.log-list { list-style: none; padding: 0; margin: 0; }
.log-item { padding: 6px 0; border-bottom: 1px solid var(--border-light); font-size: 0.85rem; color: var(--text-body); display: flex; gap: 0.5rem; }
.log-item:last-child { border-bottom: none; }
.log-time { color: var(--text-muted); font-size: 0.75rem; flex-shrink: 0; }
.log-action { font-weight: 500; }
</style>

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">🐾 电子宠物</h2>
</div>

<div class="pet-wrap">
    <!-- ====== No Pet: Egg + Hatch ====== -->
    <div id="noPetSection" style="display:none;">
        <div class="pet-display egg">
            <span class="pet-emoji">🥚</span>
        </div>
        <p class="text-muted">你还没有宠物，孵化一个吧！</p>
        <div class="hatch-section">
            <p class="text-muted small mb-2">选择宠物类型：</p>
            <div class="hatch-types" id="hatchTypes">
                <div class="hatch-type-card selected" data-type="cat" data-csp-click="selectPetType" data-csp-args='["cat"]'>
                    <span class="type-emoji">🐱</span>
                    <span class="type-name">小猫</span>
                </div>
                <div class="hatch-type-card" data-type="dog" data-csp-click="selectPetType" data-csp-args='["dog"]'>
                    <span class="type-emoji">🐶</span>
                    <span class="type-name">小狗</span>
                </div>
                <div class="hatch-type-card" data-type="rabbit" data-csp-click="selectPetType" data-csp-args='["rabbit"]'>
                    <span class="type-emoji">🐰</span>
                    <span class="type-name">兔子</span>
                </div>
                <div class="hatch-type-card" data-type="panda" data-csp-click="selectPetType" data-csp-args='["panda"]'>
                    <span class="type-emoji">🐼</span>
                    <span class="type-name">熊猫</span>
                </div>
            </div>
            <button class="hatch-btn" data-csp-click="hatchPet">✨ 孵化</button>
        </div>
    </div>

    <!-- ====== Has Pet: Display + Actions ====== -->
    <div id="hasPetSection" style="display:none;">
        <div class="pet-display" id="petDisplay">
            <span class="pet-emoji">🐱</span>
        </div>
        <div class="pet-rename-area">
            <div class="pet-name-row">
                <span class="pet-name" id="petName">小可爱</span>
                <button class="rename-icon" data-csp-click="toggleRename" title="重命名">✏️</button>
            </div>
            <div class="pet-level" id="petLevel">Lv.1</div>
            <div class="rename-form" id="renameForm">
                <div class="rename-row">
                    <input class="rename-input" id="renameInput" placeholder="新名字" maxlength="30">
                </div>
                <div class="rename-type-row" id="renameTypes">
                    <button class="rename-type-dot" data-type="cat" data-csp-click="selectRenameType" data-csp-args='["cat"]'>🐱</button>
                    <button class="rename-type-dot" data-type="dog" data-csp-click="selectRenameType" data-csp-args='["dog"]'>🐶</button>
                    <button class="rename-type-dot" data-type="rabbit" data-csp-click="selectRenameType" data-csp-args='["rabbit"]'>🐰</button>
                    <button class="rename-type-dot" data-type="panda" data-csp-click="selectRenameType" data-csp-args='["panda"]'>🐼</button>
                </div>
                <div class="rename-actions">
                    <button class="rename-save-btn" data-csp-click="saveRename">保存</button>
                    <button class="rename-cancel-btn" data-csp-click="cancelRename">取消</button>
                </div>
            </div>
        </div>

        <div class="stat-bars">
            <div class="stat-row">
                <span class="stat-label">❤️ 饥饿</span>
                <div class="stat-bar-outer">
                    <div class="stat-bar-inner hunger" id="hungerBar" style="width:100%;"></div>
                </div>
                <span class="stat-val" id="hungerVal">100</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">😊 快乐</span>
                <div class="stat-bar-outer">
                    <div class="stat-bar-inner happiness" id="happinessBar" style="width:100%;"></div>
                </div>
                <span class="stat-val" id="happinessVal">100</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">⚡ 精力</span>
                <div class="stat-bar-outer">
                    <div class="stat-bar-inner energy" id="energyBar" style="width:100%;"></div>
                </div>
                <span class="stat-val" id="energyVal">100</span>
            </div>
        </div>

        <div class="xp-wrap">
            <div class="xp-label">经验 Lv.<span id="xpLevel">1</span></div>
            <div class="xp-bar-outer">
                <div class="xp-bar-inner" id="xpBar" style="width:0%;"></div>
            </div>
        </div>

        <div class="pet-actions">
            <button class="pet-btn feed-btn" data-csp-click="petAction" data-csp-args='["feed"]' title="喂食">🍖</button>
            <button class="pet-btn play-btn" data-csp-click="petAction" data-csp-args='["play"]' title="玩耍">🎾</button>
            <button class="pet-btn sleep-btn" data-csp-click="petAction" data-csp-args='["sleep"]' title="睡觉">💤</button>
        </div>

        <div class="pet-log" id="petLog">
            <h6>📋 活动记录</h6>
            <ul class="log-list" id="logList"></ul>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script nonce="{{ csp_nonce }}">
var selectedHatchType = 'cat';
var selectedRenameType = '';
var currentPetType = 'cat';

function selectPetType(type) {
    selectedHatchType = type;
    document.querySelectorAll('#hatchTypes .hatch-type-card').forEach(function(el) {
        el.classList.toggle('selected', el.getAttribute('data-type') === type);
    });
}

function selectRenameType(type) {
    selectedRenameType = type;
    document.querySelectorAll('#renameTypes .rename-type-dot').forEach(function(el) {
        el.classList.toggle('selected', el.getAttribute('data-type') === type);
    });
}

function toggleRename() {
    var form = document.getElementById('renameForm');
    form.classList.toggle('show');
    if (form.classList.contains('show')) {
        document.getElementById('renameInput').value = document.getElementById('petName').textContent;
        selectedRenameType = '';
        document.querySelectorAll('#renameTypes .rename-type-dot').forEach(function(el) { el.classList.remove('selected'); });
    }
}

function cancelRename() {
    document.getElementById('renameForm').classList.remove('show');
}

function hatchPet() {
    fetch('/api/pet/hatch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pet_type: selectedHatchType })
    }).then(function(r) { return r.json(); }).then(function(d) {
        if (d.ok) {
            loadPet();
        } else {
            alert(d.error || '孵化失败');
        }
    });
}

function petAction(action) {
    var btns = document.querySelectorAll('.pet-btn');
    btns.forEach(function(b) { b.classList.add('disabled'); });
    fetch('/api/pet/action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: action })
    }).then(function(r) { return r.json(); }).then(function(d) {
        if (d.ok) {
            if (d.level_up) alert('🎉 升级啦！');
            loadPet();
        } else {
            alert(d.error || '操作失败');
        }
    }).finally(function() {
        btns.forEach(function(b) { b.classList.remove('disabled'); });
    });
}

function saveRename() {
    var name = document.getElementById('renameInput').value.trim();
    if (!name) { alert('名字不能为空'); return; }
    var body = { pet_name: name };
    if (selectedRenameType) body.pet_type = selectedRenameType;
    fetch('/api/pet/rename', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
    }).then(function(r) { return r.json(); }).then(function(d) {
        if (d.ok) {
            document.getElementById('renameForm').classList.remove('show');
            loadPet();
        } else {
            alert(d.error || '重命名失败');
        }
    });
}

function renderPet(data) {
    document.getElementById('noPetSection').style.display = 'none';
    document.getElementById('hasPetSection').style.display = 'none';

    if (!data.has_pet) {
        document.getElementById('noPetSection').style.display = '';
        return;
    }
    document.getElementById('hasPetSection').style.display = '';
    var p = data.pet;
    currentPetType = p.pet_type;
    var emojiMap = { 'cat': '🐱', 'dog': '🐶', 'rabbit': '🐰', 'panda': '🐼' };
    document.querySelector('#petDisplay .pet-emoji').textContent = emojiMap[p.pet_type] || '🐱';
    if (p.pet_type === 'dog') {
        document.querySelector('#petDisplay .pet-emoji').style.animation = 'petWobble 1.5s ease-in-out infinite';
    } else {
        document.querySelector('#petDisplay .pet-emoji').style.animation = 'petWobble 2s ease-in-out infinite';
    }
    document.getElementById('petName').textContent = p.pet_name;
    document.getElementById('petLevel').textContent = 'Lv.' + p.level;
    document.getElementById('xpLevel').textContent = p.level;

    document.getElementById('hungerBar').style.width = p.hunger + '%';
    document.getElementById('hungerVal').textContent = p.hunger;
    document.getElementById('happinessBar').style.width = p.happiness + '%';
    document.getElementById('happinessVal').textContent = p.happiness;
    document.getElementById('energyBar').style.width = p.energy + '%';
    document.getElementById('energyVal').textContent = p.energy;
    document.getElementById('xpBar').style.width = p.xp + '%';

    var logHtml = '';
    (data.logs || []).forEach(function(l) {
        var actionMap = { 'hatch': '🥚', 'feed': '🍖', 'play': '🎾', 'sleep': '💤', 'rename': '✏️' };
        var icon = actionMap[l.action] || '📝';
        logHtml += '<li class="log-item"><span class="log-time">' + l.created_at + '</span><span class="log-action">' + icon + ' ' + l.detail + '</span></li>';
    });
    document.getElementById('logList').innerHTML = logHtml || '<li class="log-item text-muted">暂无记录</li>';
}

function loadPet() {
    fetch('/api/pet').then(function(r) { return r.json(); }).then(function(d) {
        renderPet(d);
    });
}

loadPet();
</script>
{% endblock %}
