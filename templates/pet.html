    28|/* ===== 宠物展示区 ===== */

    42|.pet-hero::before {
    43|    content: '';
    44|    position: absolute;
    45|    top: -50%;
    46|    left: -50%;
    47|    width: 200%;
    48|    height: 200%;
    49|    background: radial-gradient(circle at 30% 40%, rgba(139,92,246,0.08) 0%, transparent 50%),

    55|    0%, 100% { transform: scale(1) rotate(0deg); }
    56|    50% { transform: scale(1.05) rotate(1deg); }
    57|}

    59|/* 宠物表情 */
    60|.pet-emoji-display {

    65|    z-index: 1;
    66|}
    67|.pet-emoji-display:hover {
    68|    transform: scale(1.12);
    69|}
    70|.pet-emoji-display .main-emoji {

    74|    transition: all 0.5s;
    75|}
    76|@keyframes petFloat {
    77|    0%, 100% { transform: translateY(0); }
    78|    50% { transform: translateY(-8px); }
