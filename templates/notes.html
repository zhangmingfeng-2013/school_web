{% extends "base.html" %}
{% block title %}备忘录 - 多合一工具箱 Web 版{% endblock %}
{% block content %}
<h2 class="mb-4">📝 备忘录</h2>
<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <textarea name="content" class="form-control" rows="15" style="font-size:1.1rem;line-height:1.6">{{ content }}</textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">💾 保存</button>
                <button type="reset" class="btn btn-secondary" onclick="document.querySelector('textarea').value=''">🗑 清空</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
