{% extends "base.html" %}
{% block title %}备忘录 - 多合一工具箱 Web 版{% endblock %}
{% block content %}
<h2 class="mb-4">📝 备忘录</h2>
<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <textarea class="form-control u155" name="content"  rows="15">{{ content }}</textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">💾 保存</button>
                <button type="reset" class="btn btn-secondary" data-csp-click="__clearTextarea">🗑 清空</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
