{% extends "base.html" %}
{% block title %}修改密码 - 多合一工具箱 Web 版{% endblock %}
{% block content %}
<h2 class="mb-4">🔑 修改密码</h2>

<div class="card">
    <div class="card-body">
        {% if is_admin %}
        <div class="alert alert-info">管理员模式：可修改任何用户的密码（修改他人密码需验证您的管理员密码）</div>
        {% endif %}

        <form method="POST">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">

            {% if is_admin and users %}
            <div class="mb-3">
                <label class="form-label">选择要修改的用户</label>
                <select name="target_user" class="form-select">
                    {% for u in users %}
                    <option value="{{ u }}" {% if u == username %}selected{% endif %}>{{ u }}</option>
                    {% endfor %}
                </select>
            </div>
            {% else %}
            <div class="mb-3">
                <label class="form-label">当前用户</label>
                <input type="text" class="form-control" value="{{ username }}" disabled>
            </div>
            {% endif %}

            <div class="mb-3">
                <label class="form-label">当前密码 <small class="text-muted">（验证身份，必须填写）</small></label>
                <input type="password" name="old_pwd" class="form-control" placeholder="输入您的当前密码" required>
            </div>

            <!-- 图形验证码 -->
            <div class="mb-3">
                <label class="form-label">验证码</label>
                <div class="input-group">
                    <input type="text" name="captcha" class="form-control" placeholder="输入验证码" maxlength="6" required style="max-width:160px">
                    <img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" class="captcha-img" class="captcha-img" title="点击刷新" alt="验证码">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">新密码 <small class="text-muted">(至少8位，含字母和数字)</small></label>
                <input type="password" name="new_pwd" class="form-control" placeholder="输入新密码" required>
            </div>

            <div class="mb-3">
                <label class="form-label">确认新密码</label>
                <input type="password" name="confirm_pwd" class="form-control" placeholder="再次输入新密码" required>
            </div>

            <button type="submit" class="btn btn-warning">✅ 确认修改</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">返回</a>
        </form>
    </div>
</div>

<style nonce="{{ csp_nonce }}">
.captcha-img { height: 42px; border: 1px solid #d9d9d9; border-radius: 4px; cursor: pointer; margin-left: 8px; }
</style>
{% endblock %}
