{% extends "base.html" %}
{% block title %}AI 写作助手 - 多合一工具箱{% endblock %}
{% block content %}
<style nonce="{{ csp_nonce }}">
.aiw-container { max-width: 900px; margin: 0 auto; }
.aiw-modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: .75rem; margin-bottom: 1.5rem; }
.aiw-mode-card {
    padding: 1rem .75rem; border-radius: 12px; border: 2px solid var(--bs-border-color);
    text-align: center; cursor: pointer; transition: all .2s; background: var(--bs-body-bg);
    user-select: none;
}
.aiw-mode-card:hover { border-color: #6366f1; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(99,102,241,.15); }
.aiw-mode-card.active { border-color: #6366f1; background: rgba(99,102,241,.08); }
.aiw-mode-card .mode-icon { font-size: 1.8rem; display: block; margin-bottom: .25rem; }
.aiw-mode-card .mode-name { font-size: .85rem; font-weight: 600; color: var(--bs-body-color); }
.aiw-mode-card.active .mode-name { color: #6366f1; }
.aiw-input-group { margin-bottom: 1rem; }
.aiw-input-group label { font-weight: 600; font-size: .9rem; margin-bottom: .35rem; display: block; color: var(--bs-body-color); }
.aiw-input-group textarea, .aiw-input-group input {
    width: 100%; padding: .75rem 1rem; border-radius: 10px; border: 1.5px solid var(--bs-border-color);
    background: var(--bs-body-bg); color: var(--bs-body-color); font-size: .95rem;
    transition: border-color .2s;
}
.aiw-input-group textarea:focus, .aiw-input-group input:focus { border-color: #6366f1; outline: none; box-shadow: 0 0 0 3px rgba(99,102,241,.15); }
.aiw-input-group textarea { min-height: 100px; resize: vertical; }
.aiw-result-box {
    min-height: 200px; padding: 1.5rem; border-radius: 12px; border: 1.5px solid var(--bs-border-color);
    background: var(--bs-body-bg); line-height: 1.8; white-space: pre-wrap; word-break: break-word;
    font-size: .95rem; margin-top: 1rem; position: relative;
}
.aiw-result-box.loading { display: flex; align-items: center; justify-content: center; }
.aiw-result-box .typing-indicator {
    display: flex; gap: 6px; align-items: center;
}
.aiw-result-box .typing-indicator span {
    width: 8px; height: 8px; background: #6366f1; border-radius: 50%;
    animation: aiw-bounce 1.4s infinite ease-in-out both;
}
.aiw-result-box .typing-indicator span:nth-child(1) { animation-delay: -.32s; }
.aiw-result-box .typing-indicator span:nth-child(2) { animation-delay: -.16s; }
@keyframes aiw-bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
}
.aiw-copy-btn { position: absolute; top: .75rem; right: .75rem; opacity: .6; transition: opacity .2s; }
.aiw-copy-btn:hover { opacity: 1; }
.aiw-error { color: #ef4444; padding: 1rem; border-radius: 10px; background: rgba(239,68,68,.08); margin-top: 1rem; }
@media (max-width: 768px) {
    .aiw-modes { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 480px) {
    .aiw-modes { grid-template-columns: repeat(2, 1fr); gap: .5rem; }
    .aiw-mode-card { padding: .75rem .5rem; }
    .aiw-mode-card .mode-icon { font-size: 1.4rem; }
}
</style>

<div class="aiw-container">
    <h2 class="mb-3">✍️ AI 写作助手 <a href="/ai_config" class="btn btn-sm btn-outline-secondary ms-2" style="border-radius:20px;font-size:.8rem;">⚙️ AI 设置</a></h2>
    <p class="text-muted mb-4">选择写作模式，输入主题和要求，让 AI 帮你快速生成高质量文本。</p>

    <!-- 模式选择 -->
    <div class="aiw-modes" id="modeGroup">
        <div class="aiw-mode-card active" data-csp-click="selectMode" data-csp-args='["speech","🎤","发言稿"]'>
            <span class="mode-icon">🎤</span>
            <span class="mode-name">发言稿</span>
        </div>
        <div class="aiw-mode-card" data-csp-click="selectMode" data-csp-args='["notice","📢","活动通知"]'>
            <span class="mode-icon">📢</span>
            <span class="mode-name">活动通知</span>
        </div>
        <div class="aiw-mode-card" data-csp-click="selectMode" data-csp-args='["social","📱","朋友圈文案"]'>
            <span class="mode-icon">📱</span>
            <span class="mode-name">朋友圈文案</span>
        </div>
        <div class="aiw-mode-card" data-csp-click="selectMode" data-csp-args='["report","📊","工作总结"]'>
            <span class="mode-icon">📊</span>
            <span class="mode-name">工作总结</span>
        </div>
        <div class="aiw-mode-card" data-csp-click="selectMode" data-csp-args='["email","📧","邮件"]'>
            <span class="mode-icon">📧</span>
            <span class="mode-name">邮件</span>
        </div>
        <div class="aiw-mode-card" data-csp-click="selectMode" data-csp-args='["free","💡","自由写作"]'>
            <span class="mode-icon">💡</span>
            <span class="mode-name">自由写作</span>
        </div>
    </div>

    <!-- 输入区域 -->
    <div class="aiw-input-group">
        <label for="aiwTopic">📌 主题 / 标题</label>
        <input type="text" id="aiwTopic" placeholder="例如：母校二十周年校庆致辞" maxlength="200">
    </div>
    <div class="aiw-input-group">
        <label for="aiwReqs">📝 具体要求（语气、长度、要点等）</label>
        <textarea id="aiwReqs" placeholder="例如：语气正式温暖，800字左右，突出感恩与展望未来..."></textarea>
    </div>

    <button class="btn btn-primary px-4 py-2" data-csp-click="aiwGenerate" style="border-radius:25px;font-weight:600;">
        🚀 生成文本
    </button>

    <!-- 结果区域 -->
    <div class="aiw-result-box" id="aiwResult" style="display:none;"></div>
    <div class="aiw-error" id="aiwError" style="display:none;"></div>
</div>
{% endblock %}

{% block scripts %}
<script nonce="{{ csp_nonce }}">
var currentMode = 'speech';

function selectMode(mode, icon, name) {
    currentMode = mode;
    var cards = document.querySelectorAll('.aiw-mode-card');
    cards.forEach(function(c) { c.classList.remove('active'); });
    var target = document.querySelector('[data-csp-args*="\\"' + mode + '\\""]');
    if (target) target.classList.add('active');
}

function aiwGenerate() {
    var topic = document.getElementById('aiwTopic').value.trim();
    var reqs = document.getElementById('aiwReqs').value.trim();
    var resultBox = document.getElementById('aiwResult');
    var errorBox = document.getElementById('aiwError');

    errorBox.style.display = 'none';

    if (!topic && currentMode !== 'free') {
        errorBox.style.display = 'block';
        errorBox.textContent = '请输入主题';
        return;
    }

    resultBox.style.display = 'flex';
    resultBox.classList.add('loading');
    resultBox.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div><p class="ms-3 text-muted mb-0">AI 正在生成...</p>';

    fetch('/api/ai/writing', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: currentMode, topic: topic, requirements: reqs })
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
        resultBox.classList.remove('loading');
        if (d.error) {
            resultBox.style.display = 'none';
            errorBox.style.display = 'block';
            errorBox.textContent = d.error;
            return;
        }
        resultBox.innerHTML = '<button class="btn btn-sm btn-outline-secondary aiw-copy-btn" data-csp-click="aiwCopy">📋 复制</button>' + d.result.replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
    })
    .catch(function(e) {
        resultBox.classList.remove('loading');
        resultBox.style.display = 'none';
        errorBox.style.display = 'block';
        errorBox.textContent = '网络错误，请稍后再试';
    });
}

function aiwCopy() {
    var box = document.getElementById('aiwResult');
    var text = box.textContent.replace('📋 复制', '').trim();
    navigator.clipboard.writeText(text).then(function() {
        var btn = box.querySelector('.aiw-copy-btn');
        if (btn) { btn.textContent = '✅ 已复制'; setTimeout(function() { btn.textContent = '📋 复制'; }, 2000); }
    });
}
</script>
{% endblock %}
