{% extends "base.html" %}
{% block title %}🔐 密码强度分析 - 多合一工具箱{% endblock %}
{% block content %}
<style nonce="{{ csp_nonce }}">
.pw-wrap { max-width:700px;margin:0 auto }
.pw-meter { height:12px;border-radius:6px;background:var(--bs-tertiary-bg);overflow:hidden;margin:12px 0 }
.pw-meter-fill { height:100%;border-radius:6px;transition:width .3s,background .3s }
.pw-score { font-size:2rem;font-weight:700 }
.pw-checks { list-style:none;padding:0 }
.pw-checks li { padding:4px 0;font-size:.9rem }
.pw-checks .pass { color:#10b981 }
.pw-checks .fail { color:#ef4444 }
.pw-entropy { font-size:.85rem;color:var(--text-muted) }
.pw-crack { font-family:monospace;font-size:.85rem }
</style>

<div class="pw-wrap">
    <h2 class="mb-1">🔐 密码强度分析器</h2>
    <p class="text-muted mb-3">实时评估密码强度、计算熵值、预估破解时间</p>

    <div class="card mb-3"><div class="card-body">
        <label class="form-label">输入密码</label>
        <div class="input-group">
            <input class="form-control form-control-lg u299" type="password"  id="pwInput" placeholder="输入要分析的密码...">
            <button class="btn btn-outline-secondary" data-csp-click="togglePwVis" id="pwVisBtn">👁</button>
        </div>
        <div class="pw-meter"><div class="pw-meter-fill" id="pwMeter"></div></div>
        <div class="d-flex justify-content-between align-items-center">
            <span class="pw-score" id="pwScore">-</span>
            <span id="pwLabel" class="u300"></span>
        </div>
    </div></div>

    <div class="row g-3">
        <div class="col-md-6">
            <div class="card h-100"><div class="card-body">
                <h6>✅ 安全检查</h6>
                <ul class="pw-checks" id="pwChecks">
                    <li class="fail">等待输入...</li>
                </ul>
            </div></div>
        </div>
        <div class="col-md-6">
            <div class="card h-100"><div class="card-body">
                <h6>📊 详细信息</h6>
                <div id="pwDetails">
                    <div class="pw-entropy">输入密码开始分析</div>
                </div>
            </div></div>
        </div>
    </div>

    <div class="card mt-3"><div class="card-body">
        <h6>⚡ 破解时间估算（每秒1000亿次尝试）</h6>
        <div class="pw-crack" id="pwCrackTime">-</div>
    </div></div>
</div>
{% endblock %}

{% block scripts %}
<script nonce="{{ csp_nonce }}">
function analyzePw() {
    var pw = document.getElementById('pwInput').value;

    // Checks
    var checks = [];
    var score = 0;

    // Length
    if (pw.length >= 16) { checks.push({text:'✅ 长度 ≥ 16 字符',cls:'pass'}); score += 25; }
    else if (pw.length >= 12) { checks.push({text:'✅ 长度 ≥ 12 字符',cls:'pass'}); score += 20; }
    else if (pw.length >= 8) { checks.push({text:'⚠️ 长度 ≥ 8 字符',cls:'pass'}); score += 10; }
    else if (pw.length > 0) { checks.push({text:'❌ 长度不足 8 字符',cls:'fail'}); }
    else { checks.push({text:'等待输入...',cls:'fail'}); }

    if (pw.length > 0) {
        // Character variety
        var hasUpper = /[A-Z]/.test(pw);
        var hasLower = /[a-z]/.test(pw);
        var hasDigit = /[0-9]/.test(pw);
        var hasSymbol = /[^A-Za-z0-9]/.test(pw);

        if (hasUpper) { checks.push({text:'✅ 包含大写字母',cls:'pass'}); score += 5; }
        else checks.push({text:'❌ 缺少大写字母',cls:'fail'});
        if (hasLower) { checks.push({text:'✅ 包含小写字母',cls:'pass'}); score += 5; }
        else checks.push({text:'❌ 缺少小写字母',cls:'fail'});
        if (hasDigit) { checks.push({text:'✅ 包含数字',cls:'pass'}); score += 5; }
        else checks.push({text:'❌ 缺少数字',cls:'fail'});
        if (hasSymbol) { checks.push({text:'✅ 包含特殊字符',cls:'pass'}); score += 5; }
        else checks.push({text:'⚠️ 缺少特殊字符',cls:'fail'});

        // Pattern checks
        var hasRepeat = /(.)\1{2,}/.test(pw);
        var hasSeq = /(abc|bcd|cde|def|efg|123|234|345|456|567|678|789)/i.test(pw);
        var hasCommon = /(password|123456|qwerty|admin|iloveyou|welcome|monkey|dragon)/i.test(pw);

        if (!hasRepeat) { checks.push({text:'✅ 无连续重复字符',cls:'pass'}); score += 5; }
        else checks.push({text:'❌ 包含连续重复字符',cls:'fail'});
        if (!hasSeq) { checks.push({text:'✅ 无键盘/字母序列',cls:'pass'}); score += 5; }
        else checks.push({text:'❌ 包含键盘序列',cls:'fail'});
        if (!hasCommon) { checks.push({text:'✅ 非常见密码',cls:'pass'}); score += 5; }
        else checks.push({text:'❌ 常见密码模式',cls:'fail'});

        // Entropy
        var pool = 0;
        if (hasUpper) pool += 26;
        if (hasLower) pool += 26;
        if (hasDigit) pool += 10;
        if (hasSymbol) pool += 33;
        if (pool === 0) pool = 26;
        var entropy = Math.round(pw.length * Math.log2(pool) * 10) / 10;

        // Crack time estimate
        var combos = Math.pow(pool, pw.length);
        var sec = combos / 1e11;
        var crackStr = '';
        if (sec < 1) crackStr = '瞬间破解';
        else if (sec < 60) crackStr = Math.round(sec) + ' 秒';
        else if (sec < 3600) crackStr = Math.round(sec/60) + ' 分钟';
        else if (sec < 86400) crackStr = Math.round(sec/3600) + ' 小时';
        else if (sec < 31536000) crackStr = Math.round(sec/86400) + ' 天';
        else if (sec < 31536000*100) crackStr = Math.round(sec/31536000) + ' 年';
        else if (sec < 31536000*1000) crackStr = Math.round(sec/31536000/100) + ' 百年';
        else if (sec < 31536000*1e6) crackStr = Math.round(sec/31536000/1000) + ' 千年';
        else crackStr = '> 百万年';

        // Details
        var details = '';
        details += '字符集大小: <strong>' + pool + '</strong><br>';
        details += '信息熵: <strong>' + entropy + ' bits</strong><br>';
        details += '可能的组合: <strong>' + combos.toExponential(2) + '</strong><br>';
        details += '长度: <strong>' + pw.length + '</strong> 字符';

        document.getElementById('pwDetails').innerHTML = details;
        document.getElementById('pwCrackTime').textContent = crackStr;
    } else {
        document.getElementById('pwDetails').innerHTML = '<div class="pw-entropy">输入密码开始分析</div>';
        document.getElementById('pwCrackTime').textContent = '-';
        score = 0;
    }

    // Render checks
    var checksHtml = '';
    for (var i = 0; i < checks.length; i++) {
        checksHtml += '<li class="' + checks[i].cls + '">' + checks[i].text + '</li>';
    }
    document.getElementById('pwChecks').innerHTML = checksHtml;

    // Score
    score = Math.min(score, 100);
    var label, color;
    if (score >= 80) { label = '🔒 非常强'; color = '#10b981'; }
    else if (score >= 60) { label = '🔒 较强'; color = '#3b82f6'; }
    else if (score >= 40) { label = '⚠️ 一般'; color = '#f59e0b'; }
    else if (score >= 20) { label = '❌ 较弱'; color = '#f97316'; }
    else { label = '❌ 非常弱'; color = '#ef4444'; }

    document.getElementById('pwScore').textContent = score + '/100';
    document.getElementById('pwLabel').textContent = label;
    document.getElementById('pwLabel').style.color = color;

    var meter = document.getElementById('pwMeter');
    meter.style.width = score + '%';
    meter.style.background = color;
}

function togglePwVis() {
    var el = document.getElementById('pwInput');
    var btn = document.getElementById('pwVisBtn');
    if (el.type === 'password') { el.type = 'text'; btn.textContent = '🙈'; }
    else { el.type = 'password'; btn.textContent = '👁'; }
}

// Hook input event (CSP-safe)
setTimeout(function(){
    var el = document.getElementById('pwInput');
    if (el) { el.addEventListener('input', analyzePw); el.removeAttribute('oninput'); }
}, 100);
</script>
{% endblock %}
