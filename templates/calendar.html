{% extends "base.html" %}
{% block title %}{{ _('calendar_title') }} - {{ _('app_title') }}{% endblock %}
{% block content %}
<h2 class="mb-3">📅 {{ _('calendar_title') }}</h2>

<div class="card">
    <div class="card-body">
        <!-- 月份导航 -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <button class="btn btn-outline-secondary" onclick="prevMonth()">← {{ _('calendar_prev') }}</button>
            <h4 class="mb-0" id="monthLabel"></h4>
            <button class="btn btn-outline-secondary" onclick="nextMonth()">{{ _('calendar_next') }} →</button>
            <button class="btn btn-primary btn-sm ms-2" onclick="goToday()">{{ _('calendar_today') }}</button>
        </div>

        <!-- 添加事件按钮 -->
        <div class="mb-3">
            <button class="btn btn-success btn-sm" onclick="showAddModal()">+ {{ _('calendar_new_event') }}</button>
        </div>

        <!-- 分类图例 -->
        <div class="d-flex flex-wrap gap-2 mb-3" id="legend"></div>

        <!-- 日历网格 -->
        <div class="table-responsive">
            <table class="table table-bordered text-center" style="table-layout:fixed;">
                <thead>
                    <tr id="weekdayHeader"></tr>
                </thead>
                <tbody id="calendarBody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- 事件详情/添加弹窗 -->
<div class="modal fade" id="eventModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">{{ _('calendar_new_event') }}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="evId">
                <div class="mb-2">
                    <label class="form-label">{{ _('calendar_event_title') }}</label>
                    <input type="text" id="evTitle" class="form-control" required>
                </div>
                <div class="mb-2">
                    <label class="form-label">{{ _('calendar_event_date') }}</label>
                    <input type="date" id="evDate" class="form-control" required>
                </div>
                <div class="mb-2">
                    <label class="form-label">{{ _('calendar_event_time') }}</label>
                    <input type="time" id="evTime" class="form-control">
                </div>
                <div class="mb-2">
                    <label class="form-label">{{ _('calendar_event_category') }}</label>
                    <select id="evCategory" class="form-select">
                        <option value="class">{{ _('calendar_cat_class') }}</option>
                        <option value="exam">{{ _('calendar_cat_exam') }}</option>
                        <option value="activity">{{ _('calendar_cat_activity') }}</option>
                        <option value="personal">{{ _('calendar_cat_personal') }}</option>
                        <option value="holiday">{{ _('calendar_cat_holiday') }}</option>
                        <option value="other">{{ _('calendar_cat_other') }}</option>
                    </select>
                </div>
                <div class="mb-2">
                    <label class="form-label">{{ _('calendar_event_desc') }}</label>
                    <textarea id="evDesc" class="form-control" rows="3"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-danger me-auto" id="btnDelete" style="display:none;" onclick="deleteEvent()">{{ _('calendar_delete') }}</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">{{ _('common_cancel') }}</button>
                <button type="button" class="btn btn-primary" onclick="saveEvent()">{{ _('calendar_save') }}</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<style>
    .cal-cell { height: 90px; vertical-align: top; padding: 4px; cursor: pointer; position: relative; transition: background .15s; }
    .cal-cell:hover { background: #f0f4ff; }
    .cal-cell.today { background: #e8f4fd; }
    .cal-cell.other-month { background: #f9f9f9; color: #bbb; }
    .cal-date { font-weight: 600; font-size: 13px; margin-bottom: 2px; }
    .cal-date.today-label { display:inline-block; background:#04c; color:#fff; border-radius:50%; width:24px; height:24px; line-height:24px; text-align:center; }
    .cal-event { font-size: 11px; padding: 1px 5px; border-radius: 3px; margin-bottom: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; color: #fff; }
    .cal-event:hover { opacity: .85; }
    .cal-more { font-size: 10px; color: #888; cursor: pointer; }
    .legend-dot { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 3px; vertical-align: middle; }
</style>

<script nonce="{{ csp_nonce }}">
const catColors = {
    class: '#3b82f6', exam: '#ef4444', activity: '#10b981',
    personal: '#f59e0b', holiday: '#8b5cf6', other: '#6b7280'
};
const catNames = {
    class: '{{ _('calendar_cat_class') }}', exam: '{{ _('calendar_cat_exam') }}',
    activity: '{{ _('calendar_cat_activity') }}', personal: '{{ _('calendar_cat_personal') }}',
    holiday: '{{ _('calendar_cat_holiday') }}', other: '{{ _('calendar_cat_other') }}'
};

let currentYear, currentMonth;
let events = [];
let modal;

document.addEventListener('DOMContentLoaded', () => {
    const now = new Date();
    currentYear = now.getFullYear();
    currentMonth = now.getMonth() + 1;
    modal = new bootstrap.Modal(document.getElementById('eventModal'));
    renderLegend();
    loadEvents();
});

function renderLegend() {
    let html = '';
    for (let [cat, color] of Object.entries(catColors)) {
        html += `<span style="font-size:12px;"><span class="legend-dot" style="background:${color};"></span>${catNames[cat]}</span>`;
    }
    document.getElementById('legend').innerHTML = html;
}

function loadEvents() {
    fetch(`/api/calendar/events?year=${currentYear}&month=${currentMonth}`, { credentials: 'include' })
        .then(r => r.json())
        .then(d => {
            if (d.ok) { events = d.events; renderCalendar(); }
        });
}

function renderCalendar() {
    const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
    document.getElementById('weekdayHeader').innerHTML = weekdays.map(w => `<th style="background:#f8f9fa;">${w}</th>`).join('');
    document.getElementById('monthLabel').textContent = `${currentYear}年 ${currentMonth}月`;

    const firstDay = new Date(currentYear, currentMonth - 1, 1);
    const lastDay = new Date(currentYear, currentMonth, 0);
    const startDow = firstDay.getDay();
    const totalDays = lastDay.getDate();
    const today = new Date();
    const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

    // 上个月填充
    const prevLastDay = new Date(currentYear, currentMonth - 1, 0).getDate();
    let cells = [];
    for (let i = startDow - 1; i >= 0; i--) {
        const d = prevLastDay - i;
        const ds = `${currentMonth===1?currentYear-1:currentYear}-${String(currentMonth===1?12:currentMonth-1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        cells.push({ day: d, dateStr: ds, otherMonth: true });
    }

    // 当月
    for (let d = 1; d <= totalDays; d++) {
        const ds = `${currentYear}-${String(currentMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        cells.push({ day: d, dateStr: ds, otherMonth: false, isToday: ds === todayStr });
    }

    // 下个月填充
    const remaining = 7 - (cells.length % 7);
    if (remaining < 7) {
        for (let d = 1; d <= remaining; d++) {
            const nm = currentMonth === 12 ? 1 : currentMonth + 1;
            const ny = currentMonth === 12 ? currentYear + 1 : currentYear;
            const ds = `${ny}-${String(nm).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            cells.push({ day: d, dateStr: ds, otherMonth: true });
        }
    }

    // 按事件分组
    const evMap = {};
    events.forEach(ev => {
        if (!evMap[ev.event_date]) evMap[ev.event_date] = [];
        evMap[ev.event_date].push(ev);
    });

    let html = '';
    for (let i = 0; i < cells.length; i += 7) {
        html += '<tr>';
        for (let j = 0; j < 7; j++) {
            const cell = cells[i + j];
            let cls = 'cal-cell';
            if (cell.otherMonth) cls += ' other-month';
            if (cell.isToday) cls += ' today';
            html += `<td class="${cls}" onclick="onCellClick('${cell.dateStr}')">`;
            html += `<div class="cal-date${cell.isToday ? ' today-label' : ''}">${cell.day}</div>`;
            const dayEvents = evMap[cell.dateStr] || [];
            dayEvents.slice(0, 3).forEach(ev => {
                html += `<div class="cal-event" style="background:${ev.color};" onclick="event.stopPropagation();openEvent(${ev.id})">${ev.event_time ? ev.event_time.substring(0,5)+' ' : ''}${escapeHtml(ev.title)}</div>`;
            });
            if (dayEvents.length > 3) {
                html += `<div class="cal-more">+${dayEvents.length - 3} 更多</div>`;
            }
            html += '</td>';
        }
        html += '</tr>';
    }
    document.getElementById('calendarBody').innerHTML = html;
}

function escapeHtml(text) {
    const d = document.createElement('div');
    d.textContent = text;
    return d.innerHTML;
}

function prevMonth() { currentMonth--; if(currentMonth<1){currentMonth=12;currentYear--;} loadEvents(); }
function nextMonth() { currentMonth++; if(currentMonth>12){currentMonth=1;currentYear++;} loadEvents(); }
function goToday() { const n=new Date(); currentYear=n.getFullYear(); currentMonth=n.getMonth()+1; loadEvents(); }
function onCellClick(dateStr) { showAddModal(dateStr); }

function showAddModal(dateStr) {
    document.getElementById('modalTitle').textContent = '{{ _('calendar_new_event') }}';
    document.getElementById('evId').value = '';
    document.getElementById('evTitle').value = '';
    document.getElementById('evDate').value = dateStr || '';
    document.getElementById('evTime').value = '';
    document.getElementById('evCategory').value = 'other';
    document.getElementById('evDesc').value = '';
    document.getElementById('btnDelete').style.display = 'none';
    modal.show();
}

function openEvent(id) {
    const ev = events.find(e => e.id === id);
    if (!ev) return;
    document.getElementById('modalTitle').textContent = '{{ _('common_edit') }}';
    document.getElementById('evId').value = ev.id;
    document.getElementById('evTitle').value = ev.title;
    document.getElementById('evDate').value = ev.event_date;
    document.getElementById('evTime').value = ev.event_time ? ev.event_time.substring(0,5) : '';
    document.getElementById('evCategory').value = ev.category;
    document.getElementById('evDesc').value = ev.description || '';
    document.getElementById('btnDelete').style.display = '';
    modal.show();
}

function saveEvent() {
    const id = document.getElementById('evId').value;
    const data = {
        title: document.getElementById('evTitle').value.trim(),
        event_date: document.getElementById('evDate').value,
        event_time: document.getElementById('evTime').value || null,
        category: document.getElementById('evCategory').value,
        description: document.getElementById('evDesc').value.trim(),
        color: catColors[document.getElementById('evCategory').value]
    };
    if (!data.title || !data.event_date) { alert('请填写标题和日期'); return; }

    const method = id ? 'PUT' : 'POST';
    const url = id ? `/api/calendar/events/${id}` : '/api/calendar/events';

    fetch(url, {
        method, headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data), credentials: 'include'
    }).then(r => r.json()).then(d => {
        if (d.ok) { modal.hide(); loadEvents(); }
        else alert(d.error || 'Error');
    });
}

function deleteEvent() {
    const id = document.getElementById('evId').value;
    if (!id || !confirm('确定要删除这个事件吗？')) return;
    fetch(`/api/calendar/events/${id}`, { method: 'DELETE', credentials: 'include' })
        .then(r => r.json()).then(d => {
            if (d.ok) { modal.hide(); loadEvents(); }
            else alert(d.error || 'Error');
        });
}
</script>
{% endblock %}
