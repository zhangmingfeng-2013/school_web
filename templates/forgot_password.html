{% extends "base.html" %}
{% block title %}忘记密码{% endblock %}
{% block content %}
<div class="card" style="max-width:440px;margin:60px auto">
    <div class="card-body p-4">
        <h3 class="text-center mb-3">🔑 忘记密码</h3>
        <p class="text-muted text-center small mb-4">输入用户名获取重置令牌</p>

        <form method="POST">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
            <div class="mb-3">
                <label class="form-label">用户名</label>
                <input type="text" name="username" class="form-control form-control-lg" placeholder="请输入用户名" required>
            </div>
            <div class="mb-3">
                <label class="form-label">验证码</label>
                <div class="input-group">
                    <input type="text" name="captcha" class="form-control" placeholder="输入验证码" maxlength="4" required style="font-size:18px;letter-spacing:4px">
                    <img src="/api/captcha" class="captcha-img" title="点击刷新" alt="验证码" style="height:46px;border:1px solid #d9d9d9;border-radius:4px;cursor:pointer">
                </div>
            </div>
            <button type="submit" class="btn btn-warning btn-lg w-100 mb-2">获取重置令牌</button>
        </form>

        <div class="mt-3 p-3 bg-light rounded small">
            <p class="mb-1 fw-bold">📋 获取令牌后：</p>
            <p class="mb-1">① 复制上方显示的令牌</p>
            <p class="mb-0">② 前往 <a href="{{ url_for('reset_password') }}">重置密码页面</a> 设置新密码</p>
        </div>

        <div class="text-center mt-3">
            <a href="{{ url_for('login') }}" class="text-decoration-none">← 返回登录</a>
        </div>
    </div>
</div>
{% endblock %}
