{% extends "base.html" %}
{% block title %}RSS 阅读器 - 多合一工具箱{% endblock %}
{% block content %}
<style nonce="{{ csp_nonce }}">
.rss-container { display: flex; gap: 1.5rem; }
.rss-sidebar { width: 280px; flex-shrink: 0; }
.rss-main { flex: 1; min-width: 0; }
.rss-feed-item { cursor: pointer; padding: 0.6rem 1rem; border-radius: 8px; transition: background .15s; display: flex; align-items: center; justify-content: space-between; }
.rss-feed-item:hover { background: var(--bg-card-hover); }
.rss-feed-item.active { background: rgba(59,130,246,.15); border-left: 3px solid #3b82f6; }
.rss-feed-item .feed-title { font-weight: 500; font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.rss-feed-item .feed-actions { display: none; gap: 4px; }
.rss-feed-item:hover .feed-actions { display: flex; }
.rss-article { padding: 1rem; border-bottom: 1px solid var(--border-light); cursor: pointer; transition: background .15s; }
.rss-article:hover { background: var(--bg-card-hover); }
.rss-article .article-title { font-weight: 600; font-size: 1rem; margin-bottom: .25rem; }
.rss-article .article-summary { font-size: .85rem; color: var(--text-muted); margin-bottom: .35rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rss-article .article-meta { font-size: .75rem; color: var(--text-muted); display: flex; gap: 1rem; }
.rss-empty { text-align: center; padding: 3rem; color: var(--text-muted); }
.rss-empty .icon { font-size: 3rem; margin-bottom: 1rem; }
@media (max-width: 768px) { .rss-container { flex-direction: column; } .rss-sidebar { width: 100%; } }
</style>

<h2 class="mb-3">📡 RSS 阅读器</h2>

<div class="rss-container">
    <!-- Sidebar: Feeds -->
    <div class="rss-sidebar">
        <div class="card mb-3">
            <div class="card-body p-3">
                <h6 class="card-title mb-3">📋 订阅源</h6>
                <form data-csp-submit="addFeed">
                    <div class="input-group input-group-sm mb-2">
                        <input type="url" id="feedUrl" class="form-control" placeholder="RSS 订阅地址" required>
                        <button type="submit" class="btn btn-primary">添加</button>
                    </div>
                </form>
                <div id="feedList" class="mt-2">
                    <div class="rss-empty u266"><small class="text-muted">暂无订阅源，请添加</small></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main: Articles -->
    <div class="rss-main">
        <div class="card">
            <div class="card-body p-3">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h6 class="mb-0" id="currentFeedTitle">选择订阅源查看文章</h6>
                    <button class="btn btn-sm btn-outline-primary u30" data-csp-click="refreshFeed" id="refreshBtn">🔄 刷新</button>
                </div>
                <div id="articleList">
                    <div class="rss-empty">
                        <div class="icon">📰</div>
                        <p>从左侧选择一个订阅源查看内容</p>
                    </div>
                </div>
                <div id="articleLoading" class="u267">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 text-muted">加载中...</p>
                </div>
                <div id="articleError" class="u30 alert alert-danger"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script nonce="{{ csp_nonce }}">
var currentFeedId = null;
var feedsData = [];

function addFeed(e) {
    e.preventDefault();
    var url = document.getElementById('feedUrl').value.trim();
    if (!url) return;
    if (!/^https?:\/\/.+/.test(url)) { alert('请输入有效的 RSS 地址'); return; }
    fetch('/api/rss/feeds', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: url })
    }).then(function(r) { return r.json(); }).then(function(d) {
        if (d.ok) {
            document.getElementById('feedUrl').value = '';
            loadFeeds();
        } else {
            alert('添加失败: ' + (d.error || '未知错误'));
        }
    }).catch(function(err) { alert('网络错误: ' + err.message); });
    return false;
}

function loadFeeds() {
    fetch('/api/rss/feeds').then(function(r) { return r.json(); }).then(function(d) {
        var list = document.getElementById('feedList');
        if (d.ok && d.feeds && d.feeds.length > 0) {
            feedsData = d.feeds;
            var html = '';
            d.feeds.forEach(function(f) {
                html += '<div class="rss-feed-item' + (f.id === currentFeedId ? ' active' : '') + '" data-csp-click="selectFeed" data-csp-args=\'' + JSON.stringify([f.id]) + '\'>';
                html += '<span class="feed-title" title="' + (f.title || f.url) + '">' + (f.title || f.url).replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</span>';
                html += '<span class="feed-actions">';
                html += '<button class="btn btn-sm btn-outline-danger u268" data-csp-click="deleteFeed" data-csp-args=\'' + JSON.stringify([f.id]) + '\'>✕</button>';
                html += '</span></div>';
            });
            list.innerHTML = html;
        } else {
            feedsData = [];
            list.innerHTML = '<div class="rss-empty u266"><small class="text-muted">暂无订阅源，请添加</small></div>';
        }
    }).catch(function(err) { console.error('Failed to load feeds:', err); });
}

function selectFeed(feedId) {
    currentFeedId = feedId;
    var feed = feedsData.find(function(f) { return f.id === feedId; });
    document.getElementById('currentFeedTitle').textContent = feed ? (feed.title || feed.url) : '选择订阅源';
    document.getElementById('refreshBtn').style.display = 'inline-block';
    document.getElementById('articleList').innerHTML = '';
    document.getElementById('articleError').style.display = 'none';
    document.getElementById('articleLoading').style.display = 'block';
    renderFeedList();
    fetch('/api/rss/fetch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ feed_id: feedId })
    }).then(function(r) { return r.json(); }).then(function(d) {
        document.getElementById('articleLoading').style.display = 'none';
        if (d.ok && d.articles && d.articles.length > 0) {
            var html = '';
            d.articles.forEach(function(a) {
                html += '<div class="rss-article">';
                html += '<div class="article-title">' + (a.link ? '<a href="' + a.link + '" target="_blank" rel="noopener">' : '') + (a.title || '无标题').replace(/</g,'&lt;').replace(/>/g,'&gt;') + (a.link ? '</a>' : '') + '</div>';
                if (a.summary) html += '<div class="article-summary">' + a.summary.replace(/<[^>]*>/g, '').substring(0, 200) + '</div>';
                html += '<div class="article-meta"><span>' + (a.date || '') + '</span>' + (a.author ? '<span>' + a.author + '</span>' : '') + '</div>';
                html += '</div>';
            });
            document.getElementById('articleList').innerHTML = html;
        } else {
            document.getElementById('articleList').innerHTML = '<div class="rss-empty"><p>' + (d.error || '暂无文章') + '</p></div>';
        }
    }).catch(function(err) {
        document.getElementById('articleLoading').style.display = 'none';
        document.getElementById('articleError').style.display = 'block';
        document.getElementById('articleError').textContent = '加载失败: ' + err.message;
    });
}

function refreshFeed() {
    if (currentFeedId) selectFeed(currentFeedId);
}

function deleteFeed(feedId) {
    if (!confirm('确定要删除这个订阅源吗？')) return;
    fetch('/api/rss/feeds/' + feedId, { method: 'DELETE' }).then(function(r) { return r.json(); }).then(function(d) {
        if (d.ok) {
            if (currentFeedId === feedId) {
                currentFeedId = null;
                document.getElementById('currentFeedTitle').textContent = '选择订阅源查看文章';
                document.getElementById('refreshBtn').style.display = 'none';
                document.getElementById('articleList').innerHTML = '<div class="rss-empty"><div class="icon">📰</div><p>从左侧选择一个订阅源查看内容</p></div>';
            }
            loadFeeds();
        } else {
            alert('删除失败: ' + (d.error || '未知错误'));
        }
    }).catch(function(err) { alert('网络错误: ' + err.message); });
}

function renderFeedList() {
    var list = document.getElementById('feedList');
    var html = '';
    feedsData.forEach(function(f) {
        html += '<div class="rss-feed-item' + (f.id === currentFeedId ? ' active' : '') + '" data-csp-click="selectFeed" data-csp-args=\'' + JSON.stringify([f.id]) + '\'>';
        html += '<span class="feed-title" title="' + (f.title || f.url) + '">' + (f.title || f.url).replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</span>';
        html += '<span class="feed-actions">';
        html += '<button class="btn btn-sm btn-outline-danger u268" data-csp-click="deleteFeed" data-csp-args=\'' + JSON.stringify([f.id]) + '\'>✕</button>';
        html += '</span></div>';
    });
    list.innerHTML = html;
}

loadFeeds();
</script>
{% endblock %}
