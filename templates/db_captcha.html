{% extends "base.html" %}
{% block title %}安全验证{% endblock %}
{% block content %}
<h2 class="mb-4">🔐 数据库操作验证</h2>

<div class="card u25">
    <div class="card-body text-center">
        <p class="text-muted mb-3">进入数据库功能需要输入验证码</p>

        <form method="POST">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
            <div class="mb-3">
                <img class="captcha-img u251" src="data:image/gif;base64,R0lGODlhAQABAAAAACw="  title="点击刷新" alt="验证码">
            </div>
            <div class="mb-3">
                <input class="form-control text-center u252" type="text" name="db_captcha"  placeholder="输入验证码" maxlength="6" autofocus>
            </div>
            <button type="submit" class="btn btn-primary w-100">✅ 验证</button>
        </form>
        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary mt-2 w-100">返回首页</a>
    </div>
</div>
{% endblock %}
