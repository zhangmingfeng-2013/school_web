{% extends "base.html" %}
{% block title %}安全验证{% endblock %}
{% block content %}
<h2 class="mb-4">🔐 数据库操作验证</h2>

<div class="card" style="max-width:420px;margin:60px auto">
    <div class="card-body text-center">
        <p class="text-muted mb-3">进入数据库功能需要输入验证码</p>

        <form method="POST">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
            <div class="mb-3">
                <img src="/api/captcha?t={{ cache_buster }}" class="captcha-img" class="captcha-img" title="点击刷新" alt="验证码" style="border:1px solid #d9d9d9;border-radius:4px;cursor:pointer">
            </div>
            <div class="mb-3">
                <input type="text" name="db_captcha" class="form-control text-center" placeholder="输入验证码" maxlength="4" autofocus style="font-size:20px;letter-spacing:4px">
            </div>
            <button type="submit" class="btn btn-primary w-100">✅ 验证</button>
        </form>
        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary mt-2 w-100">返回首页</a>
    </div>
</div>
{% endblock %}
