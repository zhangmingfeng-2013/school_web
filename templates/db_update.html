{% extends "base.html" %}
{% block title %}更改数据库 - 多合一工具箱 Web 版{% endblock %}
{% block content %}
<h2 class="mb-4">🗄️ 可视化数据库 <span class="badge bg-danger">仅管理员</span></h2>

<div class="card mb-4">
    <div class="card-body">
        <div class="row g-3 align-items-end">
            <div class="col-auto">
                <label class="form-label">选择表</label>
                <select id="tableSelect" class="form-select" data-csp-change="loadTableData()">
                    <option value="">-- 请选择 --</option>
                    {% for t in tables %}
                    <option value="{{ t }}">{{ t }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-auto">
                <button class="btn btn-primary" data-csp-click="loadTableData">🔄 加载数据</button>
                <button class="btn btn-success" data-csp-click="showAddDialog" id="addBtn" style="display:none">➕ 添加行</button>
            </div>
        </div>
    </div>
</div>

<!-- 数据表格 -->
<div id="tableContainer" class="card" style="display:none">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-bordered table-hover table-sm mb-0" id="dataTable">
                <thead class="table-dark" id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <div class="p-3 text-muted small" id="rowCount"></div>
    </div>
</div>

<div id="loadingSpinner" class="text-center py-5" style="display:none">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="mt-2">加载中...</p>
</div>

<!-- 添加/编辑 Modal -->
<div class="modal fade" id="formModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="formModalTitle">添加行</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="formModalBody">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="formSubmitBtn" data-csp-click="submitForm">确认</button>
            </div>
        </div>
    </div>
</div>

<!-- 删除确认 Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title text-danger">⚠️ 确认删除</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="deleteModalBody">确定要删除该行吗？</div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-danger" id="deleteConfirmBtn" data-csp-click="confirmDelete">删除</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script nonce="{{ csp_nonce }}">
let currentTable = '';
let currentColumns = [];
let currentPK = '';
let currentPKType = '';
let currentModalMode = ''; // 'add' or 'edit'
let editPKValue = '';
let deletePKValue = '';

function loadTableData() {
    const table = document.getElementById('tableSelect').value;
    if (!table) return;
    currentTable = table;
    document.getElementById('loadingSpinner').style.display = 'block';
    document.getElementById('tableContainer').style.display = 'none';
    document.getElementById('addBtn').style.display = 'none';

    fetch('/api/table/' + encodeURIComponent(table) + '/data')
        .then(r => r.json())
        .then(data => {
            document.getElementById('loadingSpinner').style.display = 'none';
            if (data.error) { alert('加载失败: ' + data.error); return; }

            currentColumns = data.columns;
            currentPK = data.primary_key;

            // 渲染表头
            let thead = document.getElementById('tableHead');
            let hdr = '<tr><th style="width:80px">操作</th>';
            data.columns.forEach(c => { hdr += '<th>' + c + '</th>'; });
            hdr += '</tr>';
            thead.innerHTML = hdr;

            // 渲染数据
            let tbody = document.getElementById('tableBody');
            if (data.rows.length === 0) {
                tbody.innerHTML = '<tr><td colspan="' + (data.columns.length + 1) + '" class="text-center text-muted py-4">表中没有数据</td></tr>';
            } else {
                let rows = '';
                data.rows.forEach(row => {
                    const pkVal = encodeURIComponent(row[0]);
                    rows += '<tr>';
                    rows += '<td class="text-nowrap">';
                    rows += '<button class="btn btn-sm btn-outline-primary me-1 dbu-edit-btn" data-row=\'' + JSON.stringify(row).replace(/'/g,"\\'") + '\' title="编辑">✏️</button>';
                    rows += '<button class="btn btn-sm btn-outline-danger dbu-del-btn" data-pk="' + pkVal + '" title="删除">🗑️</button>';
                    rows += '</td>';
                    row.forEach(cell => {
                        rows += '<td>' + escapeHtml(String(cell)) + '</td>';
                    });
                    rows += '</tr>';
                });
                tbody.innerHTML = rows;
            }

            document.getElementById('rowCount').textContent = '共 ' + data.rows.length + ' 行';
            document.getElementById('tableContainer').style.display = 'block';
            document.getElementById('addBtn').style.display = 'inline-block';
        })
        .catch(e => {
            document.getElementById('loadingSpinner').style.display = 'none';
            alert('加载失败: ' + e.message);
        });
}

function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showAddDialog() {
    currentModalMode = 'add';
    document.getElementById('formModalTitle').textContent = '➕ 添加行 - ' + currentTable;
    let html = '';
    currentColumns.forEach(col => {
        html += '<div class="mb-3">';
        html += '<label class="form-label">' + col + '</label>';
        html += '<input type="text" class="form-control" name="' + col + '" placeholder="输入值">';
        html += '</div>';
    });
    document.getElementById('formModalBody').innerHTML = html;
    document.getElementById('formSubmitBtn').textContent = '✅ 添加';
    new bootstrap.Modal(document.getElementById('formModal')).show();
}

function showEditDialog(rowData) {
    currentModalMode = 'edit';
    editPKValue = rowData[0];
    document.getElementById('formModalTitle').textContent = '✏️ 编辑行 - ' + currentTable;
    let html = '';
    currentColumns.forEach((col, i) => {
        html += '<div class="mb-3">';
        html += '<label class="form-label">' + col + '</label>';
        if (col === currentPK) {
            html += '<input type="text" class="form-control" value="' + escapeHtml(String(rowData[i])) + '" disabled>';
            html += '<input type="hidden" name="' + col + '" value="' + escapeHtml(String(rowData[i])) + '">';
        } else {
            html += '<input type="text" class="form-control" name="' + col + '" value="' + escapeHtml(String(rowData[i])) + '">';
        }
        html += '</div>';
    });
    document.getElementById('formModalBody').innerHTML = html;
    document.getElementById('formSubmitBtn').textContent = '💾 保存';
    new bootstrap.Modal(document.getElementById('formModal')).show();
}

function submitForm() {
    const modal = bootstrap.Modal.getInstance(document.getElementById('formModal'));
    const inputs = document.querySelectorAll('#formModalBody input[type="text"]:not([disabled]), #formModalBody input[type="hidden"]');
    const data = {};
    inputs.forEach(inp => { data[inp.name] = inp.value; });

    if (currentModalMode === 'add') {
        fetch('/api/table/' + encodeURIComponent(currentTable) + '/insert', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        })
        .then(r => r.json())
        .then(res => {
            if (res.error) { alert('添加失败: ' + res.error); return; }
            modal.hide();
            loadTableData();
        })
        .catch(e => alert('请求失败: ' + e.message));
    } else {
        const pkInput = document.querySelector('#formModalBody input[name="' + currentPK + '"]');
        const pkVal = pkInput ? pkInput.value : editPKValue;
        const fields = {};
        Object.entries(data).forEach(([k,v]) => {
            if (k !== currentPK) fields[k] = v;
        });
        fetch('/api/table/' + encodeURIComponent(currentTable) + '/update', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                pk_col: currentPK,
                pk: pkVal,
                fields: fields
            })
        })
        .then(r => r.json())
        .then(res => {
            if (res.error) { alert('更新失败: ' + res.error); return; }
            modal.hide();
            loadTableData();
        })
        .catch(e => alert('请求失败: ' + e.message));
    }
}

function showDeleteDialog(pkVal) {
    deletePKValue = pkVal;
    document.getElementById('deleteModalBody').textContent = '确定要删除 ' + currentPK + ' = ' + decodeURIComponent(pkVal) + ' 的行吗？';
    new bootstrap.Modal(document.getElementById('deleteModal')).show();
}

function confirmDelete() {
    const modal = bootstrap.Modal.getInstance(document.getElementById('deleteModal'));
    fetch('/api/table/' + encodeURIComponent(currentTable) + '/delete/' + deletePKValue + '?pk_col=' + encodeURIComponent(currentPK))
        .then(r => r.json())
        .then(res => {
            if (res.error) { alert('删除失败: ' + res.error); return; }
            modal.hide();
            loadTableData();
        })
        .catch(e => alert('请求失败: ' + e.message));
}
// CSP-safe event delegation
document.addEventListener('click', function(e) {
    var btn = e.target.closest('.dbu-edit-btn');
    if (btn) { var row = JSON.parse(btn.getAttribute('data-row')); showEditDialog(row); return; }
    btn = e.target.closest('.dbu-del-btn');
    if (btn) { showDeleteDialog(decodeURIComponent(btn.getAttribute('data-pk'))); return; }
});
</script>
{% endblock %}
