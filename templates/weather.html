{% extends "base.html" %}
{% block title %}天气预报 - 多合一工具箱{% endblock %}
{% block content %}
<style nonce="{{ csp_nonce }}">
.weather-current { background: linear-gradient(135deg, #1a73e8 0%, #4a90d9 50%, #6db3f2 100%); color: #fff; border-radius: 16px; padding: 2rem; text-align: center; position: relative; overflow: hidden; }
.weather-current::before { content: ""; position: absolute; top: -50%; right: -20%; width: 200px; height: 200px; background: rgba(255,255,255,.08); border-radius: 50%; pointer-events: none; }
.weather-current .temp { font-size: 4rem; font-weight: 700; line-height: 1; }
.weather-current .desc { font-size: 1.3rem; opacity: 0.9; }
.weather-current .detail { font-size: 0.95rem; opacity: 0.85; margin-top: 0.5rem; }
.weather-current .extra-detail { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.75rem 1.5rem; margin-top: 1rem; font-size: 0.85rem; opacity: 0.8; }
.weather-current .extra-detail span { white-space: nowrap; }
.forecast-card { background: var(--bs-body-bg); border: 1px solid var(--border-light); border-radius: 12px; padding: 1.25rem 1rem; text-align: center; transition: transform .2s, box-shadow .2s; }
.forecast-card:hover { transform: translateY(-3px); box-shadow: var(--card-shadow); }
.forecast-card .day { font-weight: 600; font-size: 0.9rem; color: var(--text-muted); }
.forecast-card .icon { font-size: 2.5rem; margin: 0.5rem 0; }
.forecast-card .temp-range { font-size: 1rem; }
.forecast-card .temp-high { color: #e74c3c; font-weight: 600; }
.forecast-card .temp-low { color: #3498db; font-weight: 600; }
.forecast-card .extras { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.5rem; line-height: 1.6; }
.weather-search { max-width: 480px; }
.weather-loading { text-align: center; padding: 3rem; color: var(--text-muted); }
.weather-error { background: rgba(220,53,69,.1); color: #dc3545; padding: 1rem; border-radius: 10px; text-align: center; }
.weather-attribution { text-align: center; font-size: 0.75rem; color: var(--text-muted); margin-top: 1.5rem; }
.weather-attribution a { color: var(--text-muted); text-decoration: underline; }
</style>

<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h2 class="mb-0">🌤️ 天气预报</h2>
    <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary btn-sm">← 返回</a>
</div>

<div class="weather-search mx-auto mb-4">
    <div class="input-group">
        <span class="input-group-text">🏙️</span>
        <input type="text" id="cityInput" class="form-control" placeholder="输入城市名，如：北京、上海、重庆..." value="重庆" data-csp-enter="searchWeather">
        <button class="btn btn-primary" data-csp-click="searchWeather">🔍 查询</button>
    </div>
</div>

<div id="weatherResult">
    <div class="weather-loading">
        <div class="spinner-border text-primary mb-2" role="status"></div>
        <p>加载中...</p>
    </div>
</div>

<div class="weather-attribution u30">
    天气数据来源：<a href="https://www.qweather.com/" target="_blank" rel="noopener">和风天气</a>
</div>
{% endblock %}
{% block scripts %}
<script nonce="{{ csp_nonce }}">
// 和风天气图标映射 -> Emoji
var weatherEmojiMap = {
    '100': '☀️', '101': '🌤️', '102': '⛅', '103': '🌥️', '104': '☁️',
    '150': '🌙', '151': '🌙', '152': '🌙', '153': '🌙', '154': '☁️',
    '300': '🌦️', '301': '🌦️', '302': '⛈️', '303': '⛈️', '304': '🌨️',
    '305': '🌧️', '306': '🌧️', '307': '🌧️', '308': '🌧️', '309': '🌧️',
    '310': '🌧️', '311': '🌧️', '312': '🌧️', '313': '🌨️', '314': '🌧️',
    '315': '🌧️', '316': '🌧️', '317': '🌧️', '318': '🌧️',
    '350': '🌦️', '351': '🌦️',
    '400': '🌨️', '401': '🌨️', '402': '🌨️', '403': '🌨️', '404': '🌨️',
    '405': '❄️', '406': '❄️', '407': '🌨️', '408': '🌨️', '409': '🌨️',
    '410': '🌨️',
    '456': '🌧️', '457': '🌧️',
    '500': '🌫️', '501': '🌫️', '502': '🌫️', '503': '🌫️', '504': '🌫️',
    '507': '🌪️', '508': '🌪️',
    '509': '🌫️', '510': '🌫️', '511': '🌫️', '512': '🌫️', '513': '🌫️',
    '514': '🌫️', '515': '🌫️',
    '900': '🌡️', '901': '🥶'
};

function weatherEmoji(iconCode, text) {
    // 优先用图标代码
    if (iconCode && weatherEmojiMap[iconCode]) return weatherEmojiMap[iconCode];
    // 降级到文本匹配
    var map = {
        '晴': '☀️', '多云': '⛅', '阴': '☁️', '少云': '🌤️', '晴间多云': '🌤️',
        '小雨': '🌧️', '中雨': '🌧️', '大雨': '⛈️', '暴雨': '⛈️', '阵雨': '🌦️',
        '雷阵雨': '⛈️', '小雪': '🌨️', '中雪': '🌨️', '大雪': '🌨️', '暴雪': '🌨️',
        '雨夹雪': '🌨️', '冻雨': '🌧️', '雾': '🌫️', '霾': '🌫️', '沙尘暴': '🌫️',
        '扬沙': '🌫️', '浮尘': '🌫️', '风': '💨', '大风': '💨', '台风': '🌀',
        '热': '🌡️', '冷': '🥶'
    };
    if (text) {
        for (var k in map) {
            if (text.indexOf(k) !== -1) return map[k];
        }
    }
    return '🌤️';
}

function windDirectionText(angle) {
    if (!angle && angle !== 0 && angle !== '0') return '';
    var dirs = ['北', '东北', '东', '东南', '南', '西南', '西', '西北'];
    var idx = Math.round(parseInt(angle) / 45) % 8;
    return dirs[idx] + '风';
}

function searchWeather() {
    var city = document.getElementById('cityInput').value.trim() || '重庆';
    var resultDiv = document.getElementById('weatherResult');
    var attrDiv = document.querySelector('.weather-attribution');
    resultDiv.innerHTML = '<div class="weather-loading"><div class="spinner-border text-primary mb-2"></div><p>查询中...</p></div>';

    fetch('/api/weather?city=' + encodeURIComponent(city))
        .then(function(r) {
            if (!r.ok) throw new Error('查询失败 (HTTP ' + r.status + ')');
            return r.json();
        })
        .then(function(data) {
            if (!data || data.error) {
                resultDiv.innerHTML = '<div class="weather-error">⚠️ ' + (data && data.error ? data.error : '暂无该城市的天气数据') + '</div>';
                return;
            }
            if (!data.current) {
                resultDiv.innerHTML = '<div class="weather-error">暂无该城市的天气数据</div>';
                return;
            }
            var c = data.current;
            var emoji = weatherEmoji(c.icon, c.condition);
            var forecasts = data.forecast || [];

            var html = '';
            // Current weather
            html += '<div class="weather-current mb-4">';
            html += '<div class="u147">📍 ' + (data.city || city) + '</div>';
            html += '<div class="temp">' + emoji + ' ' + c.temp + '°C</div>';
            html += '<div class="desc">' + (c.condition || '') + '</div>';
            html += '<div class="detail">';
            html += '💧 湿度 ' + (c.humidity || '--') + '% &nbsp;|&nbsp; ';
            html += '🌡️ 体感 ' + (c.feelsLike || c.temp) + '°C';
            html += '</div>';
            // Extra details
            var extras = [];
            if (c.windDir || c.windScale) {
                extras.push('💨 ' + (c.windDir || '') + ' ' + (c.windScale || '') + '级 (' + (c.wind || '--') + ' km/h)');
            } else if (c.wind) {
                extras.push('💨 风速 ' + c.wind + ' km/h');
            }
            if (c.vis && c.vis !== '--') extras.push('👁️ 能见度 ' + c.vis + ' km');
            if (c.pressure && c.pressure !== '--') extras.push('📊 气压 ' + c.pressure + ' hPa');
            if (c.precip && c.precip !== '0.0' && c.precip !== '--') extras.push('🌧️ 降水量 ' + c.precip + ' mm');
            if (extras.length > 0) {
                html += '<div class="extra-detail">';
                html += extras.map(function(e) { return '<span>' + e + '</span>'; }).join('');
                html += '</div>';
            }
            html += '</div>';

            // Forecast
            if (forecasts.length > 0) {
                html += '<h5 class="mb-3">📅 未来天气</h5>';
                html += '<div class="row g-3">';
                for (var i = 0; i < forecasts.length; i++) {
                    var f = forecasts[i];
                    html += '<div class="col-md-4 col-6">';
                    html += '<div class="forecast-card">';
                    html += '<div class="day">' + (f.date || '') + '</div>';
                    html += '<div class="icon">' + weatherEmoji(f.iconDay, f.condition) + '</div>';
                    html += '<div class="temp-range">';
                    html += '<span class="temp-high">' + (f.high || '--') + '°</span> ';
                    html += '<span class="temp-low">' + (f.low || '--') + '°</span>';
                    html += '</div>';
                    html += '<div class="u148">' + (f.condition || '') + '</div>';
                    var fExtras = [];
                    if (f.sunrise) fExtras.push('🌅 ' + f.sunrise);
                    if (f.sunset) fExtras.push('🌇 ' + f.sunset);
                    if (fExtras.length > 0) {
                        html += '<div class="extras">' + fExtras.join(' &nbsp; ') + '</div>';
                    }
                    html += '</div></div>';
                }
                html += '</div>';
            }

            resultDiv.innerHTML = html;
            if (attrDiv) attrDiv.style.display = 'block';
        })
        .catch(function(err) {
            resultDiv.innerHTML = '<div class="weather-error">⚠️ ' + (err.message || '网络错误') + '</div>';
        });
}

// Load on page ready
searchWeather();
</script>
{% endblock %}
